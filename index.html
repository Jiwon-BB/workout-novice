// timer.js — 쉬는시간 타이머 + Screen Wake Lock + 소리
//
// 이 파일의 유일한 규칙: 남은 시간은 절대 카운터로 관리하지 않는다.
// 항상 시작 타임스탬프와 Date.now()의 차이로 계산한다.
// iOS PWA는 화면이 꺼지면 setInterval/requestAnimationFrame 콜백이 멈춘다.
// 카운터 방식이면 화면을 켠 순간 "3분 남음"이 그대로 떠 있게 된다.
// 아래 setInterval은 화면을 다시 그리는 용도일 뿐, 시간을 세지 않는다.

const REPAINT_INTERVAL_MS = 200;
// 화면이 꺼진 동안 타이머가 끝났다면, 다시 켰을 때 뒤늦게 소리를 내지 않는다.
// 실제 종료 시점에서 이 시간 안에 감지된 경우에만 소리를 낸다.
const BEEP_GRACE_MS = 2000;

let audioContext = null;

// iOS는 사용자 제스처 안에서 만들어진 AudioContext만 소리를 낸다.
// 첫 "세트 완료" 탭에서 이 함수를 부른다.
function unlockAudio() {
  if (audioContext) {
    if (audioContext.state === 'suspended') audioContext.resume();
    return;
  }
  const AudioContextClass = window.AudioContext || window.webkitAudioContext;
  if (!AudioContextClass) return; // 소리는 부가 기능이다. 없어도 앱은 돌아간다.
  audioContext = new AudioContextClass();
  // 무음 버퍼를 한 번 재생해 unlock을 확정한다.
  const source = audioContext.createBufferSource();
  source.buffer = audioContext.createBuffer(1, 1, 22050);
  source.connect(audioContext.destination);
  source.start(0);
}

function beep() {
  if (!audioContext || audioContext.state !== 'running') return;
  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();
  oscillator.frequency.value = 880;
  gain.gain.setValueAtTime(0.001, audioContext.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.3, audioContext.currentTime + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.5);
  oscillator.connect(gain);
  gain.connect(audioContext.destination);
  oscillator.start();
  oscillator.stop(audioContext.currentTime + 0.5);
}

function createRestTimer({ onTick, onFinish }) {
  let startedAt = null;
  let durationMs = 0;
  let repaintId = null;
  let wakeLock = null;
  let finished = false;

  function remainingMs() {
    if (startedAt === null) return 0;
    return Math.max(0, durationMs - (Date.now() - startedAt));
  }

  async function acquireWakeLock() {
    // Wake Lock은 secure context(https / localhost)에서만 존재한다.
    // 실패해도 조용히 넘어간다 — 타이머 자체는 타임스탬프 기반이라 영향받지 않는다.
    if (!('wakeLock' in navigator)) return;
    try {
      wakeLock = await navigator.wakeLock.request('screen');
    } catch {
      wakeLock = null;
    }
  }

  function releaseWakeLock() {
    if (wakeLock) {
      wakeLock.release().catch(() => {});
      wakeLock = null;
    }
  }

  function handleVisibilityChange() {
    if (document.visibilityState !== 'visible' || startedAt === null) return;
    // 화면이 꺼지면 Wake Lock이 해제된다. 돌아오면 다시 잡는다.
    acquireWakeLock();
    tick();
  }

  function tick() {
    if (startedAt === null) return;
    const remaining = remainingMs();
    onTick?.(remaining);
    if (remaining === 0 && !finished) {
      finished = true;
      const overshootMs = Date.now() - startedAt - durationMs;
      if (overshootMs <= BEEP_GRACE_MS) beep();
      onFinish?.();
    }
  }

  return {
    start(seconds) {
      this.stop();
      startedAt = Date.now();
      durationMs = seconds * 1000;
      finished = false;
      acquireWakeLock();
      document.addEventListener('visibilitychange', handleVisibilityChange);
      repaintId = setInterval(tick, REPAINT_INTERVAL_MS);
      tick();
    },
    stop() {
      if (repaintId !== null) clearInterval(repaintId);
      repaintId = null;
      startedAt = null;
      document.removeEventListener('visibilitychange', handleVisibilityChange);
      releaseWakeLock();
    },
    remainingMs,
    isRunning: () => startedAt !== null,
    hasWakeLock: () => wakeLock !== null,
  };
}

function formatRemaining(milliseconds) {
  const totalSeconds = Math.ceil(milliseconds / 1000);
  const minutes = Math.floor(totalSeconds / 60);
  const seconds = totalSeconds % 60;
  return `${minutes}:${String(seconds).padStart(2, '0')}`;
}

// progression.js — double progression 엔진 (M3)
//
// 순수 함수만 둔다. IndexedDB도 DOM도 없으므로 node에서 그대로 검사할 수 있다.
//
// **정직성 플래그 (근거표 parameters.progression.double_progression_honesty_flag 원문):**
//   double progression을 다른 방식과 직접 비교한 시험은 존재하지 않는다. 근거는 2009 ACSM
//   가이드라인이지 비교 시험이 아니다. 안전하고 단순하고 self-limiting하고 권장되기 때문에 쓰는 것이지
//   우월성이 증명되어서가 아니다. 사용자가 "이게 최선이냐"고 물으면 그렇게 답해야 한다.
//
// progression 자체의 중요성은 다르다 — 같은 세션 수에서 근비대를 대략 2배로 만든다
// (parameters.progression, certainty moderate_high). 그래서 이 엔진은 옵션이 아니라 필수다.

// ── RIR 보정 ───────────────────────────────────────────────────────────────
// 근거: parameters.rir_self_report_validity.error_model (certainty moderate_high).
// 오차는 실재하고, 방향이 있고, 유계다 — 사용자는 실제보다 실패에 가깝다고 믿는다.
// 보정 자체는 근거표가 "engineering inference, not a validated finding"이라고 명시한다.
const RIR_ERROR_MODEL = {
  highTrustMaxReps: 8,          // reps <= 8 이거나 부하 >= 75% 1RM → 보정 0
  mediumTrustMaxReps: 15,       // reps 9-15 → +1
  rampExtraOffset: 1,           // 램프 기간에는 추가 +1 (근거표 rir_report_bias)
};

/**
 * 보고된 RIR → 추정 실제 RIR.
 * @returns {{ rir: number|null, trust: 'high'|'medium'|'none', offset: number }}
 *          trust==='none'이면 이 세트의 RIR을 제어 변수로 쓰지 않는다.
 */
function correctRir(reportedRir, reps, { isRamp = false } = {}) {
  if (reportedRir === null || reportedRir === undefined) {
    return { rir: null, trust: 'none', offset: 0 };
  }
  if (reps > RIR_ERROR_MODEL.mediumTrustMaxReps) {
    // 관측 오차 ~5.15회. 이 크기의 오차는 보정할 수 있는 것이 아니라 배제해야 하는 것이다.
    return { rir: null, trust: 'none', offset: 0 };
  }
  const base = reps <= RIR_ERROR_MODEL.highTrustMaxReps ? 0 : 1;
  const offset = base + (isRamp ? RIR_ERROR_MODEL.rampExtraOffset : 0);
  return { rir: reportedRir + offset, trust: base === 0 ? 'high' : 'medium', offset };
}

// ── e1RM ───────────────────────────────────────────────────────────────────
// Epley. RIR을 실패까지 남은 횟수로 가산한다.
function e1rm(weight, reps, rir) {
  if (weight === null || reps === null) return null;
  const repsToFailure = reps + (rir ?? 0);
  return weight * (1 + repsToFailure / 30);
}

// 진행 판정 임계값. MRI typical error 3.27% (measurement_caveat.noise_floor_pct)보다 위에 둔다.
// 그 아래 변화는 측정 노이즈이지 진행이 아니다.
const E1RM_NOISE_FLOOR_PCT = 3.27;

// ── double progression ─────────────────────────────────────────────────────
// 부하 증가폭. 근거표는 +2-10%를 말한다. 장비 해상도가 그 구간을 넘으면 부하 대신 반복으로 간다
// (parameters.progression: "choose by EQUIPMENT GRANULARITY").
const LOAD_INCREMENT_PCT = { min: 2, max: 10 };
const FAILED_SESSIONS_BEFORE_BACKOFF = 2;
const BACKOFF_PCT = 5;

/**
 * 직전 수행에서 다음 세션 처방을 만든다.
 *
 * @param previousSessions 최근 세션부터 [최신, 그 이전, ...] 순서의 배열.
 *        각 원소는 그 세션에서 이 종목의 **작업 세트**(워밍업 제외) 배열이다.
 *        [{ actual_reps, actual_weight, actual_rir, completed }]
 * @param target { rep_low, rep_high, rir_high, increment }  increment = 그 장비의 최소 조절 단위(kg)
 * @param options { isRamp }
 * @returns { weight, action, reason }
 *          action: 'increase_load' | 'increase_reps' | 'hold' | 'back_off' | 'no_data'
 */
function nextPrescription(previousSessions, target, options = {}) {
  const { rep_low: repLow, rep_high: repHigh, rir_high: rirHigh, increment } = target;
  const lastSets = (previousSessions[0] ?? []).filter((set) => set.completed && set.actual_reps !== null);

  if (lastSets.length === 0) {
    return { weight: null, action: 'no_data', reason: '이 종목의 지난 기록이 없습니다. 첫 세션에서 부하를 입력하세요.' };
  }

  // 기준 부하는 지난 세션에서 실제로 쓴 부하 중 가장 무거운 값.
  // 세트마다 부하가 달랐다면(드롭세트·중량 변경) 가장 무거운 것이 그 세션의 작업 부하다.
  const weight = Math.max(...lastSets.map((set) => set.actual_weight ?? 0));
  if (weight === 0) {
    return { weight: null, action: 'no_data', reason: '지난 기록에 부하가 없습니다(맨몸 종목이거나 미입력).' };
  }

  const belowLow = (sets) => sets.some((set) => set.actual_reps < repLow);
  const allAtHigh = lastSets.every((set) => set.actual_reps >= repHigh);

  // RIR 조건: 보정된 RIR이 목표 이하여야 증량한다.
  // 신뢰할 수 없는 세트(15회 초과)는 RIR 조건에서 제외하고 반복수만으로 판단한다 —
  // 근거표가 그 구간의 RIR을 제어 변수로 쓰지 말라고 한다.
  const usableRir = lastSets
    .map((set) => correctRir(set.actual_rir, set.actual_reps, options))
    .filter((corrected) => corrected.trust !== 'none');

  // 2세션 연속 rep_low 미만 → 감량. 단일 세션 부진은 노이즈다.
  const failedStreak = previousSessions
    .slice(0, FAILED_SESSIONS_BEFORE_BACKOFF)
    .filter((sets) => sets.length > 0)
    .every((sets) => belowLow(sets.filter((set) => set.completed && set.actual_reps !== null)));
  const haveEnoughSessions = previousSessions.filter((sets) => sets.length > 0).length >= FAILED_SESSIONS_BEFORE_BACKOFF;

  if (haveEnoughSessions && failedStreak) {
    const reduced = roundTo(weight * (1 - BACKOFF_PCT / 100), increment);
    return {
      weight: Math.max(increment, reduced),
      action: 'back_off',
      reason: `2세션 연속 ${repLow}회 미만 → 부하 ${BACKOFF_PCT}% 감량. 단일 세션 부진은 노이즈라 기다렸습니다.`,
    };
  }

  if (belowLow(lastSets)) {
    return { weight, action: 'hold', reason: `지난 세션에 ${repLow}회 미만 세트가 있었습니다. 같은 부하로 재시도합니다.` };
  }

  if (allAtHigh) {
    // 최소 증분이 10%를 넘으면 부하 대신 반복으로 간다. 장비 해상도가 레버를 고른다.
    const incrementPct = (increment / weight) * 100;
    if (incrementPct > LOAD_INCREMENT_PCT.max) {
      return {
        weight,
        action: 'increase_reps',
        reason: `이 장비의 최소 증분(${increment}kg)이 ${incrementPct.toFixed(0)}%로 너무 큽니다. 부하 대신 반복을 늘립니다.`,
      };
    }

    // RIR로 증량 여부를 가르지 않는다 — 증량 '폭'만 고른다.
    // 1) 자기보고 오차(9-15회 구간에서 ~2회)가 1-RIR 차이보다 크므로 그런 분기를 만들지 않는다
    //    (CLAUDE.md 금지 목록, parameters.rir_self_report_validity.engine_rule 5번).
    // 2) 0-2 RIR은 gradient가 아니라 plateau다. 페널티는 ~3 RIR을 넘을 때만
    //    (parameters.proximity_to_failure.engine_rule).
    // 따라서 보정된 RIR이 목표보다 2 이상 높을 때만 "부하가 확실히 가벼웠다"로 보고 증량폭을 키운다.
    const clearlyTooLight = usableRir.length > 0 &&
      usableRir.every((corrected) => corrected.rir >= rirHigh + 2);
    const targetPct = clearlyTooLight ? LOAD_INCREMENT_PCT.max : LOAD_INCREMENT_PCT.min;
    const step = Math.max(increment, roundTo(weight * (targetPct / 100), increment));

    return {
      weight: weight + step,
      action: 'increase_load',
      reason: clearlyTooLight
        ? `전 세트 ${repHigh}회 달성 + 보고 RIR이 목표보다 여유 → +${step}kg (증량폭 확대).`
        : `전 세트 ${repHigh}회 달성 → +${step}kg.`,
    };
  }

  return {
    weight,
    action: 'hold',
    reason: `아직 ${repHigh}회를 전 세트에서 채우지 못했습니다. 같은 부하로 반복을 늘리는 것이 목표입니다.`,
  };
}

function roundTo(value, increment) {
  return Math.round(value / increment) * increment;
}

// ── deload 신호 (반응형만) ──────────────────────────────────────────────────
// 달력 기반 자동 deload는 만들지 않는다. 직접 RCT 2편 모두 근비대에 null이고 하나는 근력에 음성이다
// (parameters.deload.verdict). 아래는 "제안"이지 자동 실행이 아니다.
const DELOAD_DROP_PCT = 10;          // deload_detection: >10% over >=2-3 sessions
const DELOAD_MIN_SESSIONS = 2;

/**
 * 같은 종목의 세션별 최고 e1RM 시계열에서 지속적 하락을 찾는다.
 * @param e1rmBySession [최신, ...] 순서
 * @returns { triggered, dropPct, message } | null
 */
function detectDeloadSignal(e1rmBySession) {
  const series = e1rmBySession.filter((value) => value !== null && value !== undefined);
  if (series.length < DELOAD_MIN_SESSIONS + 1) return null;

  const baseline = Math.max(...series.slice(DELOAD_MIN_SESSIONS));
  const recent = series.slice(0, DELOAD_MIN_SESSIONS);
  const allDropped = recent.every((value) => (baseline - value) / baseline * 100 > DELOAD_DROP_PCT);
  if (!allDropped) return null;

  const dropPct = (baseline - Math.min(...recent)) / baseline * 100;
  return {
    triggered: true,
    dropPct,
    message: `최근 ${DELOAD_MIN_SESSIONS}세션 e1RM이 최고치 대비 ${dropPct.toFixed(0)}% 낮습니다(임계 ${DELOAD_DROP_PCT}%).`,
  };
}

// ── 자가점검 ───────────────────────────────────────────────────────────────
function selftestProgression() {
  const results = [];
  const check = (label, ok, detail = '') => results.push({ ok, label, detail });
  const target = { rep_low: 8, rep_high: 12, rir_high: 2, increment: 2.5 };

  const beatTarget = [[
    { actual_reps: 12, actual_weight: 60, actual_rir: 2, completed: true },
    { actual_reps: 12, actual_weight: 60, actual_rir: 1, completed: true },
  ]];
  const up = nextPrescription(beatTarget, target);
  check('전 세트 rep_high 달성 → 증량', up.action === 'increase_load', `${up.action} ${up.weight}kg`);
  check('증량폭이 2-10% 구간', up.weight === 62.5, `${up.weight}kg`);

  const missed = [[{ actual_reps: 7, actual_weight: 60, actual_rir: 0, completed: true }]];
  check('rep_low 미만 1회 → 유지', nextPrescription(missed, target).action === 'hold');

  const missedTwice = [
    [{ actual_reps: 7, actual_weight: 60, actual_rir: 0, completed: true }],
    [{ actual_reps: 6, actual_weight: 60, actual_rir: 0, completed: true }],
  ];
  const back = nextPrescription(missedTwice, target);
  check('2세션 연속 rep_low 미만 → 5% 감량', back.action === 'back_off' && back.weight === 57.5, `${back.weight}kg`);

  // 덤벨 5kg 간격 · 작업 부하 20kg → 증분이 25%라 부하 대신 반복
  const coarse = nextPrescription(beatTarget.map((sets) => sets.map((set) => ({ ...set, actual_weight: 20 }))),
    { ...target, increment: 5 });
  check('증분이 10% 초과면 반복 progression', coarse.action === 'increase_reps', coarse.action);

  // 보고 RIR 5 @ 12회 → 보정 +1 = 6. 목표 2보다 4 높으므로 "확실히 가벼웠다" → 증량폭 확대.
  const tooLight = [[
    { actual_reps: 12, actual_weight: 60, actual_rir: 5, completed: true },
    { actual_reps: 12, actual_weight: 60, actual_rir: 5, completed: true },
  ]];
  const bigStep = nextPrescription(tooLight, target);
  check('RIR 여유 → 증량폭 확대', bigStep.action === 'increase_load' && bigStep.weight === 65, `${bigStep.weight}kg`);

  // 보고 RIR 2 @ 12회 → 보정 3. 목표 2와의 차이가 1뿐이므로 분기하지 않는다(금지 룰).
  const oneRirDiff = nextPrescription(beatTarget, target);
  check('1-RIR 차이로 분기하지 않음', oneRirDiff.weight === 62.5, `${oneRirDiff.weight}kg`);

  check('RIR 보정: 8회 이하는 보정 0', correctRir(2, 8).offset === 0);
  check('RIR 보정: 9-15회는 +1', correctRir(2, 12).rir === 3, String(correctRir(2, 12).rir));
  check('RIR 보정: 램프 중 추가 +1', correctRir(2, 12, { isRamp: true }).rir === 4, String(correctRir(2, 12, { isRamp: true }).rir));
  check('RIR 보정: 15회 초과는 사용 안 함', correctRir(2, 20).trust === 'none');

  check('e1RM Epley', Math.abs(e1rm(100, 10, 2) - 140) < 0.001, String(e1rm(100, 10, 2)));

  check('deload: 단일 세션 하락은 무시', detectDeloadSignal([80, 100, 100]) === null);
  check('deload: 2세션 연속 10% 초과 하락 → 신호',
    detectDeloadSignal([85, 86, 100, 100])?.triggered === true);

  check('기록 없음 → no_data', nextPrescription([], target).action === 'no_data');

  return { pass: results.every((result) => result.ok), results };
}

// coverage.js — 주간 볼륨 집계 + 커버리지 룰 검사
//
// 순수 함수만 둔다. IndexedDB도 DOM도 건드리지 않으므로 node에서 그대로 돌릴 수 있고,
// M4 대시보드와 개발용 검사 스크립트(audit-week.mjs)가 같은 코드를 쓴다.
//
// 룰은 코드에 없다. 어떤 룰이 어떤 슬롯을 요구하는지는 data/coverage-map.json,
// 룰의 원문·PMID·확실성 등급은 docs/programming-evidence.json에 있다.

// fractional set: direct 1.0 / indirect 0.5.
// 계수는 exercises.seed.json의 muscles 값에 이미 들어 있으므로 여기서 다시 정의하지 않는다.
// (근거: parameters.volume_metric, fractional_indirect_coefficient = 0.5, certainty moderate)
const DIRECT_COEFFICIENT = 1.0;

/**
 * 세션 템플릿 목록 → 근육군별 주간 fractional set.
 * @param templates 한 주에 수행할 세션 템플릿 배열
 * @param exercisesById { [id]: 종목 }
 * @returns { [muscle]: { fractional, direct, indirect, sessions } }
 */
function weeklyVolume(templates, exercisesById) {
  const volume = {};

  for (const template of templates) {
    const musclesThisSession = new Set();

    for (const item of template.items) {
      const exercise = exercisesById[item.exercise_id];
      if (!exercise) throw new Error(`종목 '${item.exercise_id}'이(가) 종목표에 없다.`);

      for (const [muscle, coefficient] of Object.entries(exercise.muscles)) {
        volume[muscle] ??= { fractional: 0, direct: 0, indirect: 0, sessions: 0 };
        volume[muscle].fractional += item.target_sets * coefficient;
        if (coefficient === DIRECT_COEFFICIENT) volume[muscle].direct += item.target_sets;
        else volume[muscle].indirect += item.target_sets;
        musclesThisSession.add(muscle);
      }
    }

    for (const muscle of musclesThisSession) volume[muscle].sessions += 1;
  }

  return volume;
}

/** 한 세션 안에서 근육군별 direct 세트 수. per-session cap 검사용. */
function perSessionDirectSets(template, exercisesById) {
  const counts = {};
  for (const item of template.items) {
    const exercise = exercisesById[item.exercise_id];
    for (const [muscle, coefficient] of Object.entries(exercise.muscles)) {
      if (coefficient !== DIRECT_COEFFICIENT) continue;
      counts[muscle] = (counts[muscle] ?? 0) + item.target_sets;
    }
  }
  return counts;
}

/**
 * 특정 근육을 '단독으로' 쓰는 종목(= isolation)의 주간 direct 세트 수.
 * 프론트레이즈는 front_delt 하나만 쓰지만 오버헤드프레스는 삼각·삼두를 함께 쓴다.
 * front_delt 룰이 겨냥하는 것은 앞의 것이다.
 */
function isolationDirectSets(templates, exercisesById, muscle) {
  let sets = 0;
  for (const template of templates) {
    for (const item of template.items) {
      const muscles = exercisesById[item.exercise_id].muscles;
      const directMuscles = Object.entries(muscles).filter(([, coefficient]) => coefficient === DIRECT_COEFFICIENT);
      if (directMuscles.length === 1 && directMuscles[0][0] === muscle && Object.keys(muscles).length === 1) {
        sets += item.target_sets;
      }
    }
  }
  return sets;
}

/** 이 주에 등장하는 coverage_role 집합. */
function rolesPresent(templates, exercisesById) {
  const roles = new Set();
  for (const template of templates) {
    for (const item of template.items) {
      for (const role of exercisesById[item.exercise_id].coverage_roles) roles.add(role);
    }
  }
  return roles;
}

/**
 * 한 주 분량의 프로그램을 검사한다.
 * @param options.trainingStatus 'novice_or_returner_ramp' | 'intermediate' | 'advanced'
 *        (근거표 parameters.weekly_volume.training_status_bands의 키)
 * @param options.volumeTargetPct 램프 주차의 목표 볼륨 비율(%). W1이면 33 — 밴드를 그만큼 낮춰 본다.
 */
function auditWeek(templates, exercisesById, evidence, coverageMap, options = {}) {
  const { trainingStatus = 'intermediate', volumeTargetPct = 100 } = options;

  const parameters = Object.fromEntries(evidence.parameters.map((parameter) => [parameter.id, parameter]));
  const volumeModel = parameters.weekly_volume.model;
  const band = parameters.weekly_volume.training_status_bands[trainingStatus];
  if (!band) throw new Error(`training status '${trainingStatus}'가 근거표의 밴드에 없다.`);

  const sessionCap = 10; // parameters.per_session_volume_cap: soft cap 8-10, certainty LOW. 상한값을 쓴다.
  const scale = volumeTargetPct / 100;

  // 하한(minimum effective dose = 4)은 스케일하지 않는다. "성장에 필요한 최소치"라는
  // 절대 기준이기 때문이다. 램프 주차에 이 아래로 내려가는 것은 의도된 것이며
  // (복귀 첫 3주는 성장 국면이 아니라 repair 국면 — returner_protocol.core_rationale.why_the_ramp_is_free),
  // 따라서 램프 중에는 error도 warning도 아닌 info로 보고한다.
  const floor = volumeModel.minimum_effective_dose;
  const belowFloorSeverity = volumeTargetPct < 100 ? 'info' : 'warning';

  const volume = weeklyVolume(templates, exercisesById);
  const roles = rolesPresent(templates, exercisesById);
  const findings = [];

  // 1. 필수 슬롯 — 그 근육을 direct로 훈련하는데 요구 슬롯이 없으면 위반.
  for (const requirement of coverageMap.required_slots) {
    const trained = (volume[requirement.when_muscle_trained]?.direct ?? 0) > 0;
    if (trained && !roles.has(requirement.require_role)) {
      findings.push({
        severity: requirement.severity,
        rule_id: requirement.rule_id,
        message: requirement.message,
      });
    }
  }

  // 2. direct 볼륨 상한 (전면삼각 isolation 기본 0세트)
  for (const limit of coverageMap.direct_volume_limits) {
    const direct = limit.isolation_only
      ? isolationDirectSets(templates, exercisesById, limit.muscle)
      : (volume[limit.muscle]?.direct ?? 0);
    if (direct > limit.max_direct_sets_per_week) {
      findings.push({
        severity: limit.severity,
        rule_id: limit.rule_id,
        message: `${limit.message} 현재 direct ${direct}세트.`,
      });
    }
  }

  // 3. minimum effective dose — 훈련하기로 한 근육이 하한 미만이면 경고.
  //    0세트인 근육은 여기서 걸리지 않는다(이번 주에 훈련 대상이 아닐 수 있다).
  //    "훈련하기로 했는데 모자란다"와 "아예 안 한다"는 다른 문제이고, 후자는 M4가 주 단위 추이로 잡는다.
  for (const [muscle, entry] of Object.entries(volume)) {
    if (entry.direct > 0 && entry.fractional < floor) {
      findings.push({
        severity: belowFloorSeverity,
        rule_id: 'weekly_volume.minimum_effective_dose',
        message: `${muscle}: 주간 ${entry.fractional} fractional sets — 하한 ${floor} 미만.`,
      });
    }
  }

  // 4. per-session cap — 넘으면 세션을 깊게 하지 말고 빈도를 올린다.
  for (const template of templates) {
    for (const [muscle, sets] of Object.entries(perSessionDirectSets(template, exercisesById))) {
      if (sets > sessionCap) {
        findings.push({
          severity: 'warning',
          rule_id: 'per_session_volume_cap',
          message: `${template.name}: ${muscle} direct ${sets}세트 — 세션당 soft cap ${sessionCap} 초과. 세션을 깊게 하지 말고 빈도를 올릴 것 (certainty LOW).`,
        });
      }
    }
  }

  // 5. 반복 구간 credit — 5회 미만 / 30회 초과는 hypertrophy 집계에 온전히 credit하지 않는다.
  const { min_reps: minReps, max_reps: maxReps } = coverageMap.rep_range_credit;
  for (const template of templates) {
    for (const item of template.items) {
      if (item.target_rep_low < minReps || item.target_rep_high > maxReps) {
        findings.push({
          severity: 'warning',
          rule_id: 'volume_metric.rep_range_credit',
          message: `${template.name} / ${item.exercise_id}: ${item.target_rep_low}–${item.target_rep_high}회는 credit 구간(${minReps}–${maxReps}) 밖이다.`,
        });
      }
    }
  }

  return {
    volume,
    band: band.map((value) => value * scale),
    floor,
    findings,
    pass: findings.every((finding) => finding.severity !== 'error'),
  };
}

// analytics.js — 실제 수행 기록에서 뽑는 통계 (M4)
//
// coverage.js가 '처방'을 검사한다면 이 파일은 '수행'을 집계한다. 둘은 다른 문제다 —
// 과거 로그에서 하체 세트는 시트에 처방되어 있었고 실제로는 상당수가 수행되지 않았다.
//
// 순수 함수만 둔다(node에서 검사 가능). 입력은 db가 읽어온 sets/sessions 배열이다.


// direct 계수의 단일 출처는 coverage.js다. 복제하면 두 벌이 어긋난다.


const DAY_MS = 24 * 60 * 60 * 1000;

/** hypertrophy 볼륨에 세는 세트: 수행 완료 + 워밍업 아님. */
function isWorkingSet(set) {
  return set.completed === true && set.is_warmup !== true && set.actual_reps !== null;
}

/**
 * 실제 수행한 주간 fractional set (근육군별).
 * @param sets  sets 스토어 행 전체
 * @param sinceDays 최근 며칠 (기본 7)
 */
function performedVolume(sets, exercisesById, { sinceDays = 7, now = Date.now() } = {}) {
  const cutoff = now - sinceDays * DAY_MS;
  const volume = {};

  for (const set of sets) {
    if (!isWorkingSet(set)) continue;
    if (new Date(set.completed_at).getTime() < cutoff) continue;
    const exercise = exercisesById[set.exercise_id];
    if (!exercise) continue;

    for (const [muscle, coefficient] of Object.entries(exercise.muscles)) {
      volume[muscle] ??= { fractional: 0, direct: 0, indirect: 0 };
      volume[muscle].fractional += coefficient;
      if (coefficient === DIRECT_COEFFICIENT) volume[muscle].direct += 1;
      else volume[muscle].indirect += 1;
    }
  }

  return volume;
}

/**
 * 커버리지 결손 — 처방이 아니라 실제 수행 기준.
 * 어떤 근육을 direct로 훈련했는데 요구 슬롯의 종목을 실제로 수행하지 않았다면 결손이다.
 * @returns [{ rule_id, message, suggestions: [exercise_id] }]
 */
function performedCoverageGaps(sets, exercisesById, coverageMap, options = {}) {
  const volume = performedVolume(sets, exercisesById, options);
  const cutoff = (options.now ?? Date.now()) - (options.sinceDays ?? 7) * DAY_MS;

  const rolesPerformed = new Set();
  for (const set of sets) {
    if (!isWorkingSet(set)) continue;
    if (new Date(set.completed_at).getTime() < cutoff) continue;
    for (const role of exercisesById[set.exercise_id]?.coverage_roles ?? []) rolesPerformed.add(role);
  }

  return coverageMap.required_slots
    .filter((requirement) => (volume[requirement.when_muscle_trained]?.direct ?? 0) > 0)
    .filter((requirement) => !rolesPerformed.has(requirement.require_role))
    .map((requirement) => ({
      rule_id: requirement.rule_id,
      message: requirement.message,
      // 그 룰을 만족시키는 종목을 제안한다. 사용자가 해본 적 있는 종목을 앞에 둔다.
      suggestions: Object.values(exercisesById)
        .filter((exercise) => exercise.coverage_roles.includes(requirement.require_role))
        .sort((a, b) => Number(b.in_user_history) - Number(a.in_user_history))
        .map((exercise) => exercise.name_en),
    }));
}

/**
 * rest 준수율. 같은 세션 안에서 연속한 두 세트의 completed_at 간격을
 * 앞 세트의 처방 rest와 비교한다. 타임스탬프만 있으면 공짜로 나오는 지표다.
 * @returns { samples, medianRatio, withinPct } | null
 */
function restAdherence(sets, { toleranceRatio = 0.25 } = {}) {
  const bySession = new Map();
  for (const set of sets) {
    if (!set.completed_at || set.completed !== true) continue;
    if (!bySession.has(set.session_id)) bySession.set(set.session_id, []);
    bySession.get(set.session_id).push(set);
  }

  const ratios = [];
  for (const sessionSets of bySession.values()) {
    const ordered = [...sessionSets].sort((a, b) => a.recorded_order - b.recorded_order);
    for (let index = 0; index < ordered.length - 1; index++) {
      const prescribed = ordered[index].rest_seconds ?? ordered[index].prescribed_rest_seconds;
      if (!prescribed) continue;
      const gapSeconds =
        (new Date(ordered[index + 1].completed_at).getTime() - new Date(ordered[index].completed_at).getTime()) / 1000;
      // 세션 중간에 자리를 뜬 경우(30분 초과)는 rest가 아니라 이탈이므로 제외한다.
      if (gapSeconds <= 0 || gapSeconds > 1800) continue;
      ratios.push(gapSeconds / prescribed);
    }
  }

  if (ratios.length === 0) return null;
  const sorted = [...ratios].sort((a, b) => a - b);
  return {
    samples: ratios.length,
    medianRatio: sorted[Math.floor(sorted.length / 2)],
    withinPct: (ratios.filter((ratio) => Math.abs(ratio - 1) <= toleranceRatio).length / ratios.length) * 100,
  };
}

/** 세션 이행/스킵 통계. 이유별 빈도가 이 앱의 1순위 설계 제약을 감시하는 지표다. */
function sessionStats(allSessions) {
  // 자기 전 루틴은 훈련 세션이 아니다. 이행률 분모에 넣으면 실제 훈련 이행률이 부풀려진다.
  const sessions = allSessions.filter((session) => session.kind !== 'routine');
  const routines = allSessions.filter((session) => session.kind === 'routine').length;
  const done = sessions.filter((session) => session.status === 'done').length;
  const skipped = sessions.filter((session) => session.status === 'skipped');
  const reasons = {};
  for (const session of skipped) {
    const reason = session.skip_reason ?? '(이유 없음)';
    reasons[reason] = (reasons[reason] ?? 0) + 1;
  }
  const decided = done + skipped.length;
  return {
    done,
    skipped: skipped.length,
    routines,
    completionPct: decided === 0 ? null : (done / decided) * 100,
    reasons,
  };
}

/**
 * 종목별 e1RM 추이. 세션마다 최고 e1RM 하나.
 * 3% 노이즈 밴드(MRI typical error 3.27%)를 함께 돌려준다 — 그 아래 변화는 진행이 아니다.
 */
function e1rmTrend(sets, exerciseId, { unilateral = false } = {}) {
  const bySession = new Map();
  for (const set of sets) {
    if (!isWorkingSet(set)) continue;
    if (set.exercise_id !== exerciseId) continue;
    if ((set.unilateral === true) !== unilateral) continue;
    if (set.actual_weight === null) continue;
    const value = e1rm(set.actual_weight, set.actual_reps, set.actual_rir);
    const previous = bySession.get(set.session_id);
    if (!previous || value > previous.e1rm) {
      bySession.set(set.session_id, { e1rm: value, at: set.completed_at });
    }
  }

  const points = [...bySession.values()].sort((a, b) => a.at.localeCompare(b.at));
  if (points.length === 0) return null;

  const best = Math.max(...points.map((point) => point.e1rm));
  const latest = points[points.length - 1];
  const changePct = points.length > 1
    ? ((latest.e1rm - points[0].e1rm) / points[0].e1rm) * 100
    : 0;

  return {
    points,
    best,
    latest: latest.e1rm,
    changePct,
    noiseFloorPct: E1RM_NOISE_FLOOR_PCT,
    // 3% 밴드 안이면 방향을 주장하지 않는다. 노이즈다.
    meaningful: Math.abs(changePct) > E1RM_NOISE_FLOOR_PCT,
  };
}

// ── 자가점검 ───────────────────────────────────────────────────────────────
function selftestAnalytics() {
  const results = [];
  const check = (label, ok, detail = '') => results.push({ ok, label, detail });

  const exercisesById = {
    leg_press: { muscles: { quads: 1, glutes: 1 }, coverage_roles: ['quad_vl'], in_user_history: true, name_en: 'Leg press' },
    leg_extension: { muscles: { quads: 1 }, coverage_roles: ['quad_rf'], in_user_history: true, name_en: 'Leg extension' },
  };
  const now = Date.parse('2026-08-26T12:00:00Z');
  const at = (minutesAgo) => new Date(now - minutesAgo * 60000).toISOString();

  const sets = [
    { session_id: 's1', exercise_id: 'leg_press', actual_reps: 12, actual_weight: 180, actual_rir: 2,
      completed: true, is_warmup: false, completed_at: at(30), recorded_order: 0, rest_seconds: 150 },
    { session_id: 's1', exercise_id: 'leg_press', actual_reps: 12, actual_weight: 180, actual_rir: 2,
      completed: true, is_warmup: false, completed_at: at(27.5), recorded_order: 1, rest_seconds: 150 },
    // 워밍업은 볼륨에 안 들어간다
    { session_id: 's1', exercise_id: 'leg_press', actual_reps: 10, actual_weight: 90, actual_rir: null,
      completed: true, is_warmup: true, completed_at: at(35), recorded_order: 2, rest_seconds: 60 },
    // 건너뛴 세트도 안 들어간다
    { session_id: 's1', exercise_id: 'leg_extension', actual_reps: null, actual_weight: null, actual_rir: null,
      completed: false, is_warmup: false, completed_at: at(25), recorded_order: 3, rest_seconds: 90 },
  ];

  const volume = performedVolume(sets, exercisesById, { now });
  check('수행 볼륨: 워밍업·건너뜀 제외', volume.quads.direct === 2, `quads direct ${volume.quads?.direct}`);
  check('간접 볼륨 0.5 계수', volume.glutes.fractional === 2, `glutes ${volume.glutes?.fractional}`);
  check('건너뛴 종목은 집계 안 됨', volume.quads.direct === 2 && !('leg_extension' in volume));

  const gaps = performedCoverageGaps(sets, exercisesById, {
    required_slots: [
      { rule_id: 'quad_rf', when_muscle_trained: 'quads', require_role: 'quad_rf', message: 'RF 결손' },
      { rule_id: 'quad_vl', when_muscle_trained: 'quads', require_role: 'quad_vl', message: 'VL 결손' },
    ],
  }, { now });
  check('수행 기준 커버리지 결손 감지', gaps.length === 1 && gaps[0].rule_id === 'quad_rf',
    gaps.map((gap) => gap.rule_id).join(','));
  check('결손 룰을 만족시키는 종목 제안', gaps[0]?.suggestions.includes('Leg extension'));

  const rest = restAdherence(sets);
  check('rest 준수율 계산', rest !== null && rest.samples > 0, `${rest?.samples}개 표본`);

  const stats = sessionStats([
    { status: 'done' }, { status: 'done' }, { status: 'skipped', skip_reason: '시간 없음' },
    { status: 'in_progress' }, { status: 'done', kind: 'routine' },
  ]);
  check('이행률 = 수행 / (수행+스킵)', Math.abs(stats.completionPct - 66.67) < 0.1, `${stats.completionPct?.toFixed(1)}%`);
  check('진행 중 세션은 분모에서 제외', stats.done === 2 && stats.skipped === 1);
  check('스킵 이유 집계', stats.reasons['시간 없음'] === 1);
  check('자기 전 루틴은 훈련 이행률과 분리', stats.done === 2 && stats.routines === 1,
    `훈련 ${stats.done} / 루틴 ${stats.routines}`);

  const trend = e1rmTrend(sets, 'leg_press');
  check('e1RM 추이 산출', trend !== null && trend.points.length === 1, `${trend?.points.length}점`);
  check('단일 세션은 변화 0 → 노이즈 밴드 안', trend?.meaningful === false);

  return { pass: results.every((result) => result.ok), results };
}

// generator.js — 프로그램 생성기 (M5)
//
// SPEC §5의 순서를 그대로 따른다:
//   1. 근육군별 주간 볼륨 목표를 정한다
//   2. 커버리지 룰의 필수 슬롯을 **먼저** 배치한다 — 다른 어떤 최적화보다 우선한다
//   3. 남은 볼륨을 세션에 분배하되 근육당 세션당 cap을 넘기지 않는다
//   4. 생성 결과를 커버리지 룰에 다시 통과시킨다. 위반이 남으면 생성 실패로 처리한다
//
// 순수 함수다. 룰은 코드에 없다 — 목표 근육 목록·부위 구분·필수 슬롯은 data/coverage-map.json,
// 밴드와 cap은 docs/programming-evidence.json, 제외 종목은 data/gym-inventory.json에서 온다.
//
// **종목 선택은 성장 레버가 아니다.** 근거표는 이것을 커버리지와 adherence 문제로 본다
// (parameters.exercise_selection_principle). 그래서 이 생성기는 '최적 종목'을 찾지 않고
// 커버리지를 채운 뒤 사용자가 해본 적 있는 종목을 우선한다.




// 한 종목에 몰아줄 수 있는 최대 세트 수. 종목 수를 늘리는 것보다 세트를 늘리는 쪽을 먼저 쓴다 —
// 종목 선택은 성장 레버가 아니고(parameters.exercise_selection_principle), 종목이 늘면
// 세션만 길어진다. 종목을 늘리는 것만으로 결과가 좋아지지는 않는다.
const MAX_SETS_PER_EXERCISE = 5;

// 그 근육을 쓸 수 있는 종목이 하나뿐이면 상한을 올린다. 종아리가 그런 경우다 —
// 시드에 카프레이즈가 사실상 하나뿐이라 5세트로 막으면 목표의 절반도 못 채운다.
const MAX_SETS_SOLE_OPTION = 12;

// 한 세션에 들어가는 한 종목의 최대 세트. 이보다 큰 블록은 여러 세션에 쪼개 배치한다
// (종아리를 한 날 12세트 하는 것이 아니라 세 날에 4세트씩 나눈다).
const MAX_SETS_PER_SESSION_BLOCK = 4;

/** 이 종목이 direct로 쓰는 근육들. */
function directMuscles(exercise) {
  return Object.entries(exercise.muscles)
    .filter(([, coefficient]) => coefficient === DIRECT_COEFFICIENT)
    .map(([muscle]) => muscle);
}

/** 볼륨 장부에 한 블록(종목 × 세트)을 더한다. */
function addVolume(volume, exercise, sets) {
  for (const [muscle, coefficient] of Object.entries(exercise.muscles)) {
    volume[muscle] = (volume[muscle] ?? 0) + sets * coefficient;
  }
}

/**
 * 한 주 프로그램을 생성한다.
 *
 * @param options.daysPerWeek     주당 세션 수
 * @param options.volumePct       목표 볼륨 대비 비율 (램프 주차면 33/50/67, 본 블록이면 100)
 * @param options.setsPerExercise 한 종목에 배치할 세트 수
 * @param options.repRange        { low, high }
 * @param options.rir             { low, high }
 * @returns { templates, volume, findings }  — 검증 실패 시 Error를 던진다
 */
function generateWeek({
  exercises, coverageMap, evidence, inventory,
  daysPerWeek = 5, volumePct = 100, setsPerExercise = 3,
  repRange = { low: 8, high: 12 }, rir = { low: 1, high: 2 },
  // 근거표 parameters.weekly_volume.training_status_bands의 키.
  // 초보자는 'novice_or_returner_ramp'(4-8), 경력자는 'intermediate'(10-16).
  trainingStatus = 'intermediate',
  extraExcluded = [],
  // 지정하면 이 종목들만 쓴다. 다른 사람의 프로그램과 '같은 종목'을 하고 싶을 때 쓴다.
  // 종목 선택은 성장 레버가 아니므로(parameters.exercise_selection_principle) 이렇게 묶어도
  // 커버리지만 충족되면 잃는 것이 없다. 충족되지 않으면 아래 필수 슬롯 단계에서 예외가 난다.
  restrictTo = null,
  // 전신 분할. 초보자에게 쓴다 — 같은 동작을 주 3회 반복해야 기술이 붙는다.
  // 근거표에 '기술 습득 빈도' 항목은 없다(관행). 근비대 측면에서는 빈도가 볼륨 전달 수단일 뿐이라
  // (parameters.frequency) 전신이든 분할이든 같은 볼륨이면 차이가 없다.
  fullBody = false,
}) {
  const parameters = Object.fromEntries(evidence.parameters.map((entry) => [entry.id, entry]));
  const band = parameters.weekly_volume.training_status_bands[trainingStatus];
  if (!band) throw new Error(`training status '${trainingStatus}'가 근거표의 밴드에 없다.`);
  const targetPerMuscle = ((band[0] + band[1]) / 2) * (volumePct / 100);
  const sessionCap = 10; // per_session_volume_cap: soft cap 8-10 (certainty LOW). 상한을 쓴다.

  const excluded = new Set([...Object.keys(inventory.excluded ?? {}), ...extraExcluded]);
  const allowed = restrictTo ? new Set(restrictTo) : null;
  const available = exercises
    .filter((exercise) => !excluded.has(exercise.id))
    .filter((exercise) => !allowed || allowed.has(exercise.id));
  const byId = Object.fromEntries(available.map((exercise) => [exercise.id, exercise]));

  const volume = {};
  const chosen = [];   // { exercise, sets }

  const use = (exercise, sets) => {
    const existing = chosen.find((entry) => entry.exercise.id === exercise.id);
    if (existing) existing.sets += sets;
    else chosen.push({ exercise, sets });
    addVolume(volume, exercise, sets);
  };

  // ── 1+2. 필수 슬롯 먼저 ────────────────────────────────────────────────
  // 목표 근육을 훈련한다면 그 룰이 요구하는 슬롯이 반드시 있어야 한다.
  // 여기서 실패하면 뒤의 어떤 최적화도 의미가 없다.
  const targetMuscles = coverageMap.target_muscles.list;
  for (const requirement of coverageMap.required_slots) {
    if (!targetMuscles.includes(requirement.when_muscle_trained)) continue;
    const candidates = available
      .filter((exercise) => exercise.coverage_roles.includes(requirement.require_role))
      // 사용자가 해본 적 있는 종목을 우선한다 — 종목 선택의 목적은 adherence다.
      .sort((a, b) => Number(b.in_user_history) - Number(a.in_user_history));
    if (candidates.length === 0) {
      throw new Error(`필수 슬롯 '${requirement.require_role}'을 채울 종목이 없다(장비 제외 후).`);
    }
    use(candidates[0], setsPerExercise);
  }

  // ── 3. 남은 볼륨 채우기 ────────────────────────────────────────────────
  // 가장 모자란 근육부터 채운다. 이미 고른 종목의 세트를 늘리는 쪽을 먼저 시도하고,
  // 그것이 한계에 닿았을 때만 새 종목을 붙인다.
  // 더 채울 수단이 없는 근육. 하나가 막혔다고 나머지까지 포기하면 안 된다.
  const exhausted = new Set();

  for (let iteration = 0; iteration < targetMuscles.length * 12; iteration++) {
    const deficits = targetMuscles
      .filter((muscle) => !exhausted.has(muscle))
      .map((muscle) => ({ muscle, deficit: targetPerMuscle - (volume[muscle] ?? 0) }))
      .filter((entry) => entry.deficit >= 1)
      .sort((a, b) => b.deficit - a.deficit);
    if (deficits.length === 0) break;

    const { muscle } = deficits[0];

    const optionCount = available.filter((exercise) => directMuscles(exercise).includes(muscle)).length;
    const maxSets = optionCount <= 1 ? MAX_SETS_SOLE_OPTION : MAX_SETS_PER_EXERCISE;

    const growable = chosen
      .filter((entry) => directMuscles(entry.exercise).includes(muscle))
      .filter((entry) => entry.sets < maxSets)
      .sort((a, b) => a.sets - b.sets)[0];
    if (growable) {
      use(growable.exercise, 1);
      continue;
    }

    const candidate = available
      .filter((exercise) => directMuscles(exercise).includes(muscle))
      .filter((exercise) => !chosen.some((entry) => entry.exercise.id === exercise.id))
      .sort((a, b) => {
        // 이미 목표를 채운 근육을 더 얹는 종목은 뒤로 민다.
        const overshoot = (exercise) => directMuscles(exercise)
          .filter((other) => other !== muscle)
          .reduce((sum, other) => sum + Math.max(0, (volume[other] ?? 0) - targetPerMuscle), 0);
        return (overshoot(a) - overshoot(b)) || (Number(b.in_user_history) - Number(a.in_user_history));
      })[0];

    // 늘릴 종목도 새 종목도 없으면 이 근육은 여기까지다. 억지로 채우지 않고 다음 근육으로 넘어간다.
    if (!candidate) { exhausted.add(muscle); continue; }
    use(candidate, Math.min(setsPerExercise, Math.max(1, Math.round(deficits[0].deficit))));
  }

  // ── 세션 분배 ──────────────────────────────────────────────────────────
  const regions = coverageMap.muscle_regions;
  const regionOf = (exercise) => {
    const primary = directMuscles(exercise)[0] ?? Object.keys(exercise.muscles)[0];
    if (regions.lower.includes(primary)) return 'lower';
    if (regions.core.includes(primary)) return 'core';
    return 'upper';
  };

  const setsIn = (session) => session.items.reduce((sum, entry) => sum + entry.sets, 0);

  // 큰 블록은 세션에 나눠 담는다. 같은 종목이 여러 세션에 흩어지는 것은 빈도를 올리는 것이고,
  // 근거표는 세션을 깊게 하는 것보다 빈도를 올리라고 한다(per_session_volume_cap).
  const blocks = chosen.flatMap((entry) => {
    // 균등하게 쪼갠다. 4씩 잘라 나머지를 남기면 "1세트짜리" 조각이 생겨 세션이 지저분해진다.
    const pieceCount = Math.ceil(entry.sets / MAX_SETS_PER_SESSION_BLOCK);
    const base = Math.floor(entry.sets / pieceCount);
    const remainder = entry.sets % pieceCount;
    return Array.from({ length: pieceCount }, (_, index) => ({
      exercise: entry.exercise,
      sets: base + (index < remainder ? 1 : 0),
    }));
  });

  const spreadMuscles = regions.spread_across_all_sessions ?? [];
  const isSpread = (exercise) => directMuscles(exercise).some((muscle) => spreadMuscles.includes(muscle));

  const buckets = { lower: [], upper: [], core: [] };
  for (const entry of blocks) buckets[isSpread(entry.exercise) ? 'core' : regionOf(entry.exercise)].push(entry);

  // 부위별 세션 수를 세트 수에 비례해 배정한다. 종목 수로 나누면 상체에 종목이 많다는 이유만으로
  // 한 세션이 34세트가 되고 다른 세션이 13세트가 된다.
  const lowerSets = buckets.lower.reduce((sum, entry) => sum + entry.sets, 0);
  const upperSets = buckets.upper.reduce((sum, entry) => sum + entry.sets, 0);
  // 주 4일 이상이면 하체 세션을 최소 2개 보장한다. 세트 비율만으로 정하면 상체 근육 수가 많다는
  // 이유로 하체가 한 세션에 몰리고, 그러면 근육당 세션 cap을 넘는다.
  // 하체 세션이 하나뿐이면 그 하나가 밀렸을 때 주간 하체 볼륨이 0이 된다 — 과거 실패 모드다.
  const minimumLowerDays = daysPerWeek >= 4 ? 2 : 1;
  const lowerDays = Math.max(minimumLowerDays, Math.min(daysPerWeek - 1,
    Math.round((lowerSets / Math.max(1, lowerSets + upperSets)) * daysPerWeek)));

  const sessions = Array.from({ length: daysPerWeek }, (_, index) => ({
    // 하체 세션과 상체 세션을 번갈아 배치한다. 한 세션이 통째로 밀려도 특정 부위가 0이 되지 않게 —
    // 과거 이행률 문제에 대한 대응이다.
    region: index % 2 === 0
      ? (sessionsAssigned(index, 'lower') ? 'lower' : 'upper')
      : (sessionsAssigned(index, 'upper') ? 'upper' : 'lower'),
    items: [], directSets: {},
  }));

  function sessionsAssigned(index, region) {
    const evenIndexes = Array.from({ length: daysPerWeek }, (_, i) => i).filter((i) => i % 2 === 0);
    const oddIndexes = Array.from({ length: daysPerWeek }, (_, i) => i).filter((i) => i % 2 === 1);
    const pool = region === 'lower' ? evenIndexes : oddIndexes;
    const quota = region === 'lower' ? lowerDays : daysPerWeek - lowerDays;
    return pool.indexOf(index) < quota;
  }

  const fits = (session, exercise, sets) =>
    directMuscles(exercise).every((muscle) => (session.directSets[muscle] ?? 0) + sets <= sessionCap);

  const place = (entry, pool) => {
    // 세트 수가 가장 적은 세션부터 채운다. cap을 넘지 않는 첫 세션에 넣는다.
    // 같은 종목이 이미 있는 세션은 뒤로 미룬다 — 쪼갠 목적이 빈도를 늘리는 것이기 때문이다.
    const ordered = [...pool].sort((a, b) => {
      const duplicate = (session) => session.items.some((item) => item.exercise.id === entry.exercise.id) ? 1 : 0;
      return (duplicate(a) - duplicate(b)) || (setsIn(a) - setsIn(b));
    });
    // 부위 풀 안에서 cap에 맞는 세션이 없으면 다른 세션까지 본다.
    // cap을 넘기느니 부위 구분을 양보한다 — 부위 구분은 일정 편의이고 cap은 근거표 항목이다.
    const fallback = [...sessions].sort((a, b) => setsIn(a) - setsIn(b));
    const session = ordered.find((candidate) => fits(candidate, entry.exercise, entry.sets))
      ?? fallback.find((candidate) => fits(candidate, entry.exercise, entry.sets))
      ?? ordered[0];
    const existing = session.items.find((item) => item.exercise.id === entry.exercise.id);
    if (existing) existing.sets += entry.sets;
    else session.items.push(entry);
    for (const muscle of directMuscles(entry.exercise)) {
      session.directSets[muscle] = (session.directSets[muscle] ?? 0) + entry.sets;
    }
  };

  const lowerPool = fullBody ? sessions : sessions.filter((session) => session.region === 'lower');
  const upperPool = fullBody ? sessions : sessions.filter((session) => session.region === 'upper');

  // 세트가 많은 블록부터 배치해야 균형이 맞는다(큰 것을 나중에 넣으면 한 세션에 몰린다).
  const bySizeDesc = (a, b) => b.sets - a.sets;
  for (const entry of [...buckets.lower].sort(bySizeDesc)) place(entry, lowerPool.length ? lowerPool : sessions);
  for (const entry of [...buckets.upper].sort(bySizeDesc)) place(entry, upperPool.length ? upperPool : sessions);
  // 코어·종아리는 전 세션에 흩는다 — 전용 날이 밀리면 0세트가 되기 때문이다.
  // 전용 슬롯은 가장 먼저 밀리는 슬롯이다.
  for (const entry of [...buckets.core].sort(bySizeDesc)) place(entry, sessions);

  const restFor = (exercise) =>
    Object.keys(exercise.muscles).length > 1
      ? parameters.rest_interval.defaults_seconds.multi_joint[1]
      : parameters.rest_interval.defaults_seconds.single_joint[1];

  const templates = sessions.map((session, index) => {
    return {
      id: `generated_day${index + 1}`,
      name: fullBody
        ? `Day ${index + 1} — 전신`
        : `Day ${index + 1} — ${session.region === 'lower' ? '하체' : session.region === 'core' ? '코어' : '상체'}`,
      week: 5,
      day_index: index + 1,
      is_ramp: false,
      is_main_block: true,
      generated: true,
      items: session.items.map((entry, order) => ({
        exercise_id: entry.exercise.id,
        order: order + 1,
        target_sets: entry.sets,
        target_rep_low: repRange.low,
        target_rep_high: repRange.high,
        target_rir_low: rir.low,
        target_rir_high: rir.high,
        rest_seconds: restFor(entry.exercise),
        prescribed_weight: null,
        progression: 'double',
        ...(entry.exercise.equipment === 'bodyweight' ? { bodyweight: true } : {}),
      })),
    };
  }).filter((template) => template.items.length > 0);

  // ── 4. 재검증. 위반이 남으면 생성 실패다. ────────────────────────────────
  const audit = auditWeek(templates, byId, evidence, coverageMap, { volumeTargetPct: volumePct, trainingStatus });
  const errors = audit.findings.filter((finding) => finding.severity === 'error');
  if (errors.length > 0) {
    throw new Error(`생성 실패 — 커버리지 위반이 남았다: ${errors.map((error) => error.message).join(' / ')}`);
  }

  return { templates, volume: audit.volume, findings: audit.findings, targetPerMuscle };
}

// db.js — M1: IndexedDB 데이터 계층 + 시드
//
// 스토어 5개.
//   exercises     data/exercises.seed.json 66개 종목            (v1)
//   history_sets  data/training-log.csv 과거 세트 (읽기 전용, 이 빌드에는 비어 있음) (v1)
//   meta          시드 버전 등 단일 키-값                        (v1)
//   sessions      실제 수행 세션                                 (v2)
//   sets          실제 수행 세트 — 이 앱에서 가장 중요한 테이블    (v2)
//
// program_blocks / session_templates 스토어는 아직 없다. 템플릿이 JSON 파일 하나뿐인 동안은
// fetch로 충분하고, M5가 템플릿을 생성하기 시작하는 순간 스토어가 필요해진다.
//
// 과거 로그를 앞으로 만들 sets 스토어와 물리적으로 분리한 이유:
// 과거 CSV 상당수에 날짜가 없고 세션 경계도 없다. 같은 테이블에 넣으려면
// session_id와 completed_at을 지어내야 하는데, 그 두 필드는 "안 함"과 "기록 안 함"을
// 구분하려고 존재하는 필드다. 지어낸 값을 넣으면 M3 progression 엔진이 "직전 세션"을
// 조회하다 4년 전 기록을 집는다.

// ── 설정 (튜너블은 전부 여기) ──────────────────────────────────────────────
const CONFIG = {
  dbName: 'workout',
  dbVersion: 2,

  // 데이터 파일이 바뀌면(parse_logs.py 재실행 등) 이 값을 올린다 → 다음 실행에서 재적재된다.
  seedVersion: '1.0.0-bundle-nohistory',

  exercisesUrl: 'data/exercises.seed.json',
  trainingLogUrl: 'data/training-log.csv',

  // 자가점검 기대값. 현재 동봉된 CSV의 지문(fingerprint)이며 검증된 상수가 아니다.
  // parse_logs.py를 다시 돌려 로그가 늘어나면 이 숫자들도 함께 갱신해야 한다.
  expected: null,   // 번들에서는 제거됨 — 자가점검은 debug.html에서만 돈다
};

// CSV에서 그대로 가져오는 컬럼. muscles 컬럼은 일부러 버린다 —
// 근육 계수의 단일 출처는 exercises 스토어이고, 복제하면 두 벌이 어긋난다.
const NUMERIC_INT_COLUMNS = ['set_no', 'reps'];
const NUMERIC_FLOAT_COLUMNS = ['weight_kg', 'rir', 'prescribed_rpe'];
const TEXT_COLUMNS = ['era', 'source_file', 'sheet', 'date', 'exercise_raw'];

// ── IndexedDB 프라미스 래퍼 (라이브러리 대신 이 4줄) ────────────────────────
function promisifyRequest(request) {
  return new Promise((resolve, reject) => {
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

function promisifyTransaction(transaction) {
  return new Promise((resolve, reject) => {
    transaction.oncomplete = () => resolve();
    transaction.onerror = () => reject(transaction.error);
    transaction.onabort = () => reject(transaction.error || new Error('트랜잭션 중단됨'));
  });
}

let databasePromise = null;

function openDatabase() {
  if (databasePromise) return databasePromise;

  databasePromise = new Promise((resolve, reject) => {
    const request = indexedDB.open(CONFIG.dbName, CONFIG.dbVersion);

    request.onupgradeneeded = () => {
      const db = request.result;

      if (!db.objectStoreNames.contains('exercises')) {
        // in_user_history 인덱스는 만들지 않는다. IndexedDB는 boolean을 유효한 키로
        // 취급하지 않아 인덱스에 아무것도 안 들어간다. 66개는 JS에서 필터가 빠르다.
        db.createObjectStore('exercises', { keyPath: 'id' });
      }

      if (!db.objectStoreNames.contains('history_sets')) {
        const store = db.createObjectStore('history_sets', { keyPath: 'row_id', autoIncrement: true });
        store.createIndex('exercise_id', 'exercise_id');
        store.createIndex('era', 'era');
      }

      if (!db.objectStoreNames.contains('meta')) {
        db.createObjectStore('meta', { keyPath: 'key' });
      }

      // v2. 기존 v1 DB를 쓰던 브라우저는 이 두 스토어만 추가로 만들어진다(옮길 데이터 없음).
      if (!db.objectStoreNames.contains('sessions')) {
        const store = db.createObjectStore('sessions', { keyPath: 'id' });
        store.createIndex('status', 'status');
        store.createIndex('template_id', 'template_id');
      }

      if (!db.objectStoreNames.contains('sets')) {
        const store = db.createObjectStore('sets', { keyPath: 'id' });
        store.createIndex('session_id', 'session_id');
        store.createIndex('exercise_id', 'exercise_id');
      }
    };

    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
    request.onblocked = () => reject(new Error('다른 탭이 이 DB를 잡고 있다. 해당 탭을 닫고 새로고침할 것.'));
  });

  return databasePromise;
}

// ── CSV 파서 ───────────────────────────────────────────────────────────────
// CSV는 따옴표 없이 고정 필드 수를 전제한다.
// 따라서 split(',')으로 충분하다. 그 전제가 깨지면 아래 필드 수 검사에서 즉시 터진다.
function parseTrainingLog(csvText, exerciseNameToId) {
  const lines = csvText
    .replace(/^﻿/, '') // 파일 선두에 실제로 BOM이 있다
    .split(/\r?\n/)
    .filter((line) => line.trim() !== '');

  if (lines.length < 1) throw new Error('training-log.csv가 비어 있다.');
  // 헤더만 있고 데이터 행이 없는 것은 정상이다(과거 로그 없이 배포한 번들).
  // 잘려서 온 응답과 구분하기 위해 헤더 자체는 반드시 있어야 한다.
  if (lines.length === 1) return [];

  const header = lines[0].split(',');
  const columnIndex = {};
  for (const name of [...TEXT_COLUMNS, ...NUMERIC_INT_COLUMNS, ...NUMERIC_FLOAT_COLUMNS, 'exercise']) {
    const index = header.indexOf(name);
    if (index < 0) throw new Error(`CSV에 '${name}' 컬럼이 없다. 헤더: ${header.join(', ')}`);
    columnIndex[name] = index;
  }

  const rows = [];

  for (let lineNumber = 1; lineNumber < lines.length; lineNumber++) {
    const fields = lines[lineNumber].split(',');
    if (fields.length !== header.length) {
      throw new Error(`${lineNumber + 1}행: 필드 ${fields.length}개, 헤더는 ${header.length}개`);
    }

    const exerciseName = fields[columnIndex.exercise];
    const exerciseId = exerciseNameToId.get(exerciseName.trim().toLowerCase());
    // 조용히 넘기지 않고 던진다. 과거 로그가 망가진 원인이 바로 표기 불일치를 방치한 것이었다.
    if (!exerciseId) {
      throw new Error(`${lineNumber + 1}행: 종목 '${exerciseName}'이(가) exercises.seed.json에 없다.`);
    }

    const row = { exercise_id: exerciseId };

    for (const name of TEXT_COLUMNS) {
      const value = fields[columnIndex[name]];
      // 빈 문자열은 null. ''로 두면 "기록 없음"과 "값 있음"이 다시 섞인다.
      row[name] = value === '' ? null : value;
    }

    for (const name of [...NUMERIC_INT_COLUMNS, ...NUMERIC_FLOAT_COLUMNS]) {
      const raw = fields[columnIndex[name]];
      if (raw === '') {
        row[name] = null;
        continue;
      }
      const parsed = Number(raw);
      if (!Number.isFinite(parsed)) {
        throw new Error(`${lineNumber + 1}행: ${name} 값 '${raw}'을(를) 숫자로 읽을 수 없다.`);
      }
      row[name] = NUMERIC_INT_COLUMNS.includes(name) ? Math.trunc(parsed) : parsed;
    }

    rows.push(row);
  }

  return rows;
}

// ── 시드 ───────────────────────────────────────────────────────────────────
async function seedIfNeeded({ force = false } = {}) {
  const installedVersion = await getMeta('seed_version');
  if (!force && installedVersion === CONFIG.seedVersion) {
    return { seeded: false, ...(await counts()) };
  }

  const [seedResponse, csvResponse] = await Promise.all([
    bundledFetch(CONFIG.exercisesUrl),
    bundledFetch(CONFIG.trainingLogUrl),
  ]);
  // file:// 로 열면 여기서 실패한다. 로컬 서버로 열 것 (python -m http.server).
  if (!seedResponse.ok) throw new Error(`${CONFIG.exercisesUrl} 로드 실패 (${seedResponse.status})`);
  if (!csvResponse.ok) throw new Error(`${CONFIG.trainingLogUrl} 로드 실패 (${csvResponse.status})`);

  const seedJson = await seedResponse.json();
  const exercises = seedJson.exercises;
  if (!Array.isArray(exercises)) throw new Error('exercises.seed.json에 exercises 배열이 없다.');

  // CSV의 exercise 컬럼(영문명) → 종목 id. 표기가 name_en과 일치해야 한다.
  const exerciseNameToId = new Map(exercises.map((item) => [item.name_en.trim().toLowerCase(), item.id]));
  const historyRows = parseTrainingLog(await csvResponse.text(), exerciseNameToId);

  const db = await openDatabase();
  const transaction = db.transaction(['exercises', 'history_sets', 'meta'], 'readwrite');
  const exerciseStore = transaction.objectStore('exercises');
  const historyStore = transaction.objectStore('history_sets');

  exerciseStore.clear();
  for (const item of exercises) exerciseStore.put(item);

  historyStore.clear();
  for (const row of historyRows) historyStore.put(row);

  transaction.objectStore('meta').put({ key: 'seed_version', value: CONFIG.seedVersion });
  transaction.objectStore('meta').put({ key: 'seeded_at', value: new Date().toISOString() });

  await promisifyTransaction(transaction);

  return { seeded: true, ...(await counts()) };
}

// ── 조회 ───────────────────────────────────────────────────────────────────
async function readAll(storeName) {
  const db = await openDatabase();
  return promisifyRequest(db.transaction(storeName, 'readonly').objectStore(storeName).getAll());
}

async function allExercises() {
  const exercises = await readAll('exercises');
  return exercises.sort((a, b) => a.name_en.localeCompare(b.name_en));
}

async function getExercise(exerciseId) {
  const db = await openDatabase();
  return promisifyRequest(db.transaction('exercises', 'readonly').objectStore('exercises').get(exerciseId));
}

async function historyFor(exerciseId) {
  const db = await openDatabase();
  const index = db.transaction('history_sets', 'readonly').objectStore('history_sets').index('exercise_id');
  const rows = await promisifyRequest(index.getAll(exerciseId));
  // era 문자열은 '2021-22' < '2025 Apr-Jul' < '2025 Nov-Dec' 순으로 사전식 정렬이
  // 시간순과 일치한다. 내림차순 = 최신 먼저. sort는 안정적이므로 era 안에서는 CSV 원래 순서가 유지된다.
  return rows.sort((a, b) => b.era.localeCompare(a.era));
}

async function getMeta(key) {
  const db = await openDatabase();
  const record = await promisifyRequest(db.transaction('meta', 'readonly').objectStore('meta').get(key));
  return record ? record.value : null;
}

async function setMeta(key, value) {
  const db = await openDatabase();
  const transaction = db.transaction('meta', 'readwrite');
  transaction.objectStore('meta').put({ key, value });
  return promisifyTransaction(transaction);
}

async function counts() {
  const db = await openDatabase();
  const transaction = db.transaction(['exercises', 'history_sets'], 'readonly');
  const [exerciseCount, historyCount] = await Promise.all([
    promisifyRequest(transaction.objectStore('exercises').count()),
    promisifyRequest(transaction.objectStore('history_sets').count()),
  ]);
  return { exerciseCount, historyCount };
}

// ── 세션 / 세트 (M2) ───────────────────────────────────────────────────────
// crypto.randomUUID는 secure context(https 또는 localhost)에서만 있다.
// LAN IP + http로 열면 undefined이므로 대체 경로를 둔다. 충돌 가능성은 개인용 단일 기기 수준에서 무시할 만하다.
function newId() {
  if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
  return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;
}

async function createSession(templateId) {
  const session = {
    id: newId(),
    template_id: templateId,
    kind: 'workout',
    started_at: new Date().toISOString(),
    ended_at: null,
    status: 'in_progress',
    skip_reason: null,
  };
  const db = await openDatabase();
  const transaction = db.transaction('sessions', 'readwrite');
  transaction.objectStore('sessions').put(session);
  await promisifyTransaction(transaction);
  return session;
}

async function activeSession() {
  const db = await openDatabase();
  const index = db.transaction('sessions', 'readonly').objectStore('sessions').index('status');
  const sessions = await promisifyRequest(index.getAll('in_progress'));
  // 정상 상태에서는 0개 또는 1개다. 여러 개면 가장 최근 것을 쓴다.
  return sessions.sort((a, b) => b.started_at.localeCompare(a.started_at))[0] ?? null;
}

async function allSets() {
  const db = await openDatabase();
  return promisifyRequest(db.transaction('sets', 'readonly').objectStore('sets').getAll());
}

async function allSessions() {
  const db = await openDatabase();
  const rows = await promisifyRequest(db.transaction('sessions', 'readonly').objectStore('sessions').getAll());
  return rows.sort((a, b) => b.started_at.localeCompare(a.started_at));
}

async function updateSession(sessionId, patch) {
  const db = await openDatabase();
  const transaction = db.transaction('sessions', 'readwrite');
  const store = transaction.objectStore('sessions');
  const session = await promisifyRequest(store.get(sessionId));
  if (!session) throw new Error(`세션 ${sessionId}이(가) 없다.`);
  store.put({ ...session, ...patch });
  await promisifyTransaction(transaction);
}

// 한 세트의 기록. completed=false는 "명시적으로 건너뜀"이고, 행이 아예 없으면 "아직 안 함"이다.
// 이 둘을 절대 섞지 않는 것이 과거 로그의 핵심 결함을 없애는 장치다.
async function recordSet(setRecord) {
  const record = { id: newId(), ...setRecord };
  const db = await openDatabase();
  const transaction = db.transaction('sets', 'readwrite');
  transaction.objectStore('sets').put(record);
  await promisifyTransaction(transaction);
  return record;
}

async function setsForSession(sessionId) {
  const db = await openDatabase();
  const index = db.transaction('sets', 'readonly').objectStore('sets').index('session_id');
  const rows = await promisifyRequest(index.getAll(sessionId));
  return rows.sort((a, b) => a.recorded_order - b.recorded_order);
}

async function lastCompletedSet(sessionId) {
  const rows = await setsForSession(sessionId);
  const withTimestamp = rows.filter((row) => row.completed_at);
  return withTimestamp[withTimestamp.length - 1] ?? null;
}

// 특정 종목에서 마지막으로 실제 사용한 중량. 처방 중량이 비어 있는 종목(스미스 카프레이즈)의
// 기본값으로 쓴다. 없으면 null.
async function lastActualWeight(exerciseId, unilateral = false) {
  const db = await openDatabase();
  const index = db.transaction('sets', 'readonly').objectStore('sets').index('exercise_id');
  const rows = await promisifyRequest(index.getAll(exerciseId));
  const withWeight = rows.filter((row) =>
    row.completed &&
    row.actual_weight !== null &&
    !row.is_warmup &&
    // 한쪽 부하와 양쪽 합을 섞으면 다음 세션 기본값이 2배로 틀린다.
    (row.unilateral === true) === unilateral);
  return withWeight.length ? withWeight[withWeight.length - 1].actual_weight : null;
}

// 세션과 그 세션의 세트를 함께 지운다. 자가점검이 남긴 흔적을 치우는 용도이며,
// 실제 훈련 기록을 지우는 UI는 없다(기록 손실이 이 앱에서 가장 비싼 사고다).
async function deleteSession(sessionId) {
  const db = await openDatabase();
  const transaction = db.transaction(['sessions', 'sets'], 'readwrite');
  const setStore = transaction.objectStore('sets');
  const setIds = await promisifyRequest(setStore.index('session_id').getAllKeys(sessionId));
  for (const id of setIds) setStore.delete(id);
  transaction.objectStore('sessions').delete(sessionId);
  await promisifyTransaction(transaction);
  return setIds.length;
}

// 이 종목의 최근 세션별 **작업 세트** 묶음. progression 엔진의 입력이다.
// 워밍업과 미완료 세트는 뺀다. 한쪽/양쪽 수행 방식이 다른 기록도 뺀다 —
// 한쪽 90kg과 양쪽 180kg을 같은 시계열에 넣으면 2배 성장으로 읽힌다.
async function recentWorkingSets(exerciseId, { unilateral = false, sessionCount = 3 } = {}) {
  const db = await openDatabase();
  const index = db.transaction('sets', 'readonly').objectStore('sets').index('exercise_id');
  const rows = (await promisifyRequest(index.getAll(exerciseId)))
    .filter((row) => row.completed && !row.is_warmup && (row.unilateral === true) === unilateral)
    .filter((row) => row.actual_reps !== null);

  const bySession = new Map();
  for (const row of rows) {
    if (!bySession.has(row.session_id)) bySession.set(row.session_id, []);
    bySession.get(row.session_id).push(row);
  }

  // 세션을 최신순으로. 각 세션의 마지막 completed_at을 시각으로 쓴다.
  return [...bySession.values()]
    .sort((a, b) => latest(b).localeCompare(latest(a)))
    .slice(0, sessionCount);

  function latest(sets) {
    return sets.reduce((max, set) => (set.completed_at > max ? set.completed_at : max), '');
  }
}

// 자기 전 루틴 수행 기록. 세트를 남기지 않는다 — 근비대 볼륨이 아니기 때문이다.
// kind: 'routine'으로 표시해 훈련 세션 이행률 통계와 섞이지 않게 한다.
async function recordRoutineSession(routineId, { completedItems, totalItems }) {
  const now = new Date().toISOString();
  const session = {
    id: newId(),
    template_id: routineId,
    kind: 'routine',
    started_at: now,
    ended_at: now,
    status: 'done',
    skip_reason: null,
    completed_items: completedItems,
    total_items: totalItems,
  };
  const db = await openDatabase();
  const transaction = db.transaction('sessions', 'readwrite');
  transaction.objectStore('sessions').put(session);
  await promisifyTransaction(transaction);
  return session;
}

// ── 백업 / 복원 (M6) ───────────────────────────────────────────────────────
// 내보내는 것은 사용자가 만든 데이터뿐이다. exercises와 history_sets는 시드 파일에서
// 언제든 다시 만들 수 있으므로 백업에 넣지 않는다 — 백업 파일이 커지면 아무도 안 만든다.
async function exportUserData() {
  const db = await openDatabase();
  const transaction = db.transaction(['sessions', 'sets', 'meta'], 'readonly');
  const [sessions, sets, meta] = await Promise.all([
    promisifyRequest(transaction.objectStore('sessions').getAll()),
    promisifyRequest(transaction.objectStore('sets').getAll()),
    promisifyRequest(transaction.objectStore('meta').getAll()),
  ]);
  return {
    format: 'workout-app-backup',
    format_version: 1,
    exported_at: new Date().toISOString(),
    db_version: CONFIG.dbVersion,
    sessions,
    sets: sets.sort((a, b) => (a.completed_at ?? '').localeCompare(b.completed_at ?? '')),
    meta,
  };
}

// 같은 id는 덮어쓴다(같은 기록이므로). 기존 데이터를 지우지 않는다 —
// 복원이 삭제를 겸하면 실수 한 번으로 전부 잃는다.
async function importUserData(backup) {
  if (backup?.format !== 'workout-app-backup') throw new Error('이 앱의 백업 파일이 아니다.');
  if (!Array.isArray(backup.sessions) || !Array.isArray(backup.sets)) throw new Error('백업에 sessions/sets가 없다.');

  const db = await openDatabase();
  const transaction = db.transaction(['sessions', 'sets'], 'readwrite');
  for (const session of backup.sessions) transaction.objectStore('sessions').put(session);
  for (const set of backup.sets) transaction.objectStore('sets').put(set);
  await promisifyTransaction(transaction);
  return { sessions: backup.sessions.length, sets: backup.sets.length };
}

// SPEC §6의 long format. 사용자가 MATLAB에서 후처리한다.
// SPEC이 지정한 8개 컬럼 뒤에 is_warmup / unilateral을 덧붙였다 —
// 이 둘이 없으면 워밍업과 작업 세트, 한쪽 부하와 양쪽 합이 다시 섞인다.
async function exportCsv() {
  const { sets } = await exportUserData();
  const db = await openDatabase();
  const exercises = await promisifyRequest(db.transaction('exercises', 'readonly').objectStore('exercises').getAll());
  const nameById = Object.fromEntries(exercises.map((exercise) => [exercise.id, exercise.name_en]));

  const columns = ['date', 'exercise', 'set_no', 'reps', 'weight_kg', 'rir', 'completed', 'completed_at', 'is_warmup', 'unilateral'];
  const rows = sets.map((set) => [
    (set.completed_at ?? '').slice(0, 10),
    nameById[set.exercise_id] ?? set.exercise_id,
    set.set_index,
    set.actual_reps ?? '',
    set.actual_weight ?? '',
    set.actual_rir ?? '',
    set.completed,
    set.completed_at ?? '',
    set.is_warmup === true,
    set.unilateral === true,
  ].join(','));

  return [columns.join(','), ...rows].join('\n');
}

// ── 자가점검 ───────────────────────────────────────────────────────────────
// 프레임워크 없이 assert만. 시드가 조용히 망가지는 경우(빈 값이 0으로 뭉개짐,
// 숫자가 문자열로 들어감, 일부 행 누락)를 잡는 것이 목적이다.
async function selftest() {
  // 번들 빌드에서는 CONFIG.expected가 제거된다(개인 훈련 이력이라 배포본에 넣지 않는다).
  if (!CONFIG.expected) {
    return { pass: false, results: [{ ok: false, label: '자가점검 기대값이 없다', detail: '번들 빌드에서는 실행할 수 없다. 로컬 debug.html에서 실행할 것.' }] };
  }
  const results = [];
  const check = (label, ok, detail = '') => {
    results.push({ ok, label, detail });
    return ok;
  };

  const { exerciseCount, historyCount } = await counts();
  check('종목 수', exerciseCount === CONFIG.expected.exerciseCount,
    `${exerciseCount} (기대 ${CONFIG.expected.exerciseCount})`);
  check('과거 세트 수', historyCount === CONFIG.expected.historyCount,
    `${historyCount} (기대 ${CONFIG.expected.historyCount})`);

  const historyRows = await readAll('history_sets');

  const eraCounts = {};
  for (const row of historyRows) eraCounts[row.era] = (eraCounts[row.era] || 0) + 1;
  for (const [era, expectedCount] of Object.entries(CONFIG.expected.eraCounts)) {
    check(`시기 '${era}' 세트 수`, eraCounts[era] === expectedCount,
      `${eraCounts[era] ?? 0} (기대 ${expectedCount})`);
  }

  const nullRirCount = historyRows.filter((row) => row.rir === null).length;
  check('RIR 미기록 세트가 null로 보존됨', nullRirCount === CONFIG.expected.nullRirCount,
    `${nullRirCount} (기대 ${CONFIG.expected.nullRirCount})`);

  const nullWeightCount = historyRows.filter((row) => row.weight_kg === null).length;
  check('중량 미기록 세트가 null로 보존됨', nullWeightCount === CONFIG.expected.nullWeightCount,
    `${nullWeightCount} (기대 ${CONFIG.expected.nullWeightCount})`);

  const badNumericRow = historyRows.find((row) =>
    (row.weight_kg !== null && typeof row.weight_kg !== 'number') ||
    (row.rir !== null && typeof row.rir !== 'number') ||
    typeof row.reps !== 'number');
  check('숫자 컬럼이 number 또는 null', badNumericRow === undefined,
    badNumericRow ? JSON.stringify(badNumericRow) : '문자열로 새어 들어온 값 없음');

  const squatHistory = await historyFor('back_squat');
  check("historyFor('back_squat') 조회", squatHistory.length > 0, `${squatHistory.length}세트`);
  check('조회 결과가 최신 시기 우선 정렬', squatHistory.length === 0 || squatHistory[0].era === '2025 Nov-Dec',
    squatHistory.length ? squatHistory[0].era : '-');

  const orphanRow = historyRows.find((row) => !row.exercise_id);
  check('모든 과거 세트가 종목 id를 가짐', orphanRow === undefined,
    orphanRow ? JSON.stringify(orphanRow) : '고아 행 없음');

  return { pass: results.every((result) => result.ok), results };
}

// session.js — 세션 진행 상태
//
// 템플릿(처방)과 db(기록) 사이의 얇은 층이다. 화면 렌더링은 index.html이 한다.
//
// 세트 기록의 3상태를 절대 섞지 않는다:
//   행이 없음        아직 안 함
//   completed=true   수행함
//   completed=false  명시적으로 건너뜀
// 과거 Numbers 시트가 이 셋을 구분하지 못해 수행 여부를 확정할 수 없었다.




// 마지막 완료 세트로부터 이 시간이 지나 재진입하면 "이어서 할까 / 끝낼까"를 한 번만 묻는다.
// 그 안이면 아무것도 묻지 않는다 — 마찰이 이 앱의 적이다.
const RESUME_PROMPT_AFTER_MS = 90 * 60 * 1000;

// 15회를 넘는 세트에서는 RIR을 제어 변수로 쓰지 않는다.
// 근거: parameters.rir_self_report_validity — 15회 초과 구간의 자기보고 오차가 ~5회에 달한다.
// (certainty moderate_high). 이 상수는 근거표의 임계값이며 임의값이 아니다.
const RIR_UNRELIABLE_ABOVE_REPS = 15;



async function loadTemplateFile() {
  const response = await bundledFetch('data/session-templates.json');
  if (!response.ok) throw new Error(`session-templates.json 로드 실패 (${response.status})`);
  const file = await response.json();
  return {
    templates: [...file.templates].sort((a, b) =>
      (a.week - b.week) || ((a.day_index ?? 0) - (b.day_index ?? 0))),
    warmupProtocol: file.warmup_protocol,
    rampPlan: file.ramp_plan,
    programLabel: file.program_label ?? '복귀 램프',
    honesty: file.honesty ?? null,
  };
}

// 중량 조절 단위. 바벨은 원판 2.5kg, 머신은 스택 1칸을 5kg으로 가정한다.
// 실제 헬스장 스택 간격이 다르면 이 함수만 고치면 된다.
function weightIncrement(exercise) {
  if (exercise.equipment.includes('barbell')) return 2.5;
  if (exercise.equipment.includes('machine')) return 5;
  return 2.5;
}

function roundToIncrement(weight, exercise) {
  const step = weightIncrement(exercise);
  return Math.round(weight / step) * step;
}

/**
 * 한 종목의 워밍업 세트를 만든다.
 * 워밍업은 hypertrophy 볼륨에 포함되지 않는다 — 근거표는 RIR 3 이하의 hard set만 센다.
 * 세트 수·강도는 관행이며 warmup_protocol.honesty에 그렇게 적혀 있다.
 */
function warmupSetsFor(item, exercise, workingWeight, protocol) {
  if (!protocol || item.bodyweight) return [];

  const isCompound = Object.keys(exercise.muscles).length > 1;
  const scheme = isCompound ? protocol.compound_sets : protocol.isolation_sets;

  return scheme
    .map((step) => ({
      load_pct: step.load_pct,
      reps: step.reps,
      rest_seconds: step.rest_seconds,
      weight: workingWeight === null ? null : roundToIncrement(workingWeight * step.load_pct / 100, exercise),
    }))
    // 작업 부하보다 가볍지 않은 워밍업은 의미가 없다(가벼운 바벨 종목에서 발생).
    .filter((step) => step.weight === null || step.weight < workingWeight);
}

async function loadEvidence() {
  const response = await bundledFetch('docs/programming-evidence.json');
  if (!response.ok) throw new Error(`programming-evidence.json 로드 실패 (${response.status})`);
  return response.json();
}

// 템플릿 item 배열 → 실제로 수행할 세트 목록(평평한 배열).
// 화면은 이 배열의 인덱스 하나씩을 순서대로 보여준다.
async function expandPrescribedSets(template, warmupProtocol = null) {
  const items = [...template.items].sort((a, b) => a.order - b.order);
  const prescribedSets = [];

  for (const item of items) {
    const exercise = await getExercise(item.exercise_id);
    if (!exercise) throw new Error(`종목 '${item.exercise_id}'이(가) exercises 스토어에 없다.`);
    // 처방 중량이 비어 있으면(스미스 카프레이즈) 그 종목에서 마지막으로 쓴 중량을 기본값으로.
    // 본 블록(progression: 'double')은 부하를 표에서 읽지 않고 직전 수행에서 계산한다.
    let progressionResult = null;
    if (item.progression === 'double' && !item.bodyweight) {
      progressionResult = nextPrescription(
        await recentWorkingSets(item.exercise_id, { unilateral: item.unilateral === true }),
        {
          rep_low: item.target_rep_low,
          rep_high: item.target_rep_high,
          rir_high: item.target_rir_high,
          increment: weightIncrement(exercise),
        },
        // 초보자는 최대 노력을 과소평가한다(PMID 28301439). 램프와 같은 +1 보정을 적용한다.
        { isRamp: template.is_ramp === true || template.novice_rir_correction === true });
    }

    const fallbackWeight = item.prescribed_weight === null
      ? await lastActualWeight(item.exercise_id, item.unilateral === true)
      : null;
    const workingWeight = progressionResult?.weight ?? item.prescribed_weight ?? fallbackWeight;

    const common = {
      exercise,
      exercise_id: item.exercise_id,
      bodyweight: item.bodyweight === true,
      // 한쪽씩 수행하는가. 템플릿이 기본값을 주고 사용자가 세트 화면에서 바꿀 수 있다.
      // 한쪽씩일 때 기록되는 중량은 '한쪽 부하'다. 이 구분이 없으면 progression 엔진이
      // 한쪽 90kg과 양쪽 180kg을 같은 종목의 2배 성장으로 읽는다.
      unilateral: item.unilateral === true,
      item_note: item.item_note ?? null,
      progression: progressionResult,
    };

    const warmups = warmupSetsFor(item, exercise, workingWeight, warmupProtocol);
    warmups.forEach((warmup, index) => {
      prescribedSets.push({
        ...common,
        is_warmup: true,
        set_index: index + 1,
        total_sets: warmups.length,
        prescribed_weight: warmup.weight,
        default_weight: warmup.weight,
        prescribed_rep_low: warmup.reps,
        prescribed_rep_high: warmup.reps,
        // 워밍업에는 RIR 목표가 없다. 노력도가 아니라 조직 준비가 목적이다.
        prescribed_rir_low: null,
        prescribed_rir_high: null,
        rest_seconds: warmup.rest_seconds,
        load_pct: warmup.load_pct,
      });
    });

    for (let setIndex = 1; setIndex <= item.target_sets; setIndex++) {
      prescribedSets.push({
        ...common,
        is_warmup: false,
        set_index: setIndex,
        total_sets: item.target_sets,
        prescribed_weight: progressionResult?.weight ?? item.prescribed_weight,
        default_weight: workingWeight,
        // increase_reps 신호일 때는 목표 반복 상한을 한 칸 올린다 — 장비 해상도가 거칠어
        // 부하 대신 반복이 레버인 경우다 (parameters.progression: equipment granularity).
        prescribed_rep_low: item.target_rep_low,
        prescribed_rep_high: item.target_rep_high + (progressionResult?.action === 'increase_reps' ? 1 : 0),
        prescribed_rir_low: item.target_rir_low,
        prescribed_rir_high: item.target_rir_high,
        rest_seconds: item.rest_seconds,
      });
    }
  }

  return prescribedSets;
}

// 진행 중인 세션이 있으면 돌려주고, 없으면 null. 여기서 세션을 만들지 않는다 —
// 앱을 열기만 한 것과 세션을 시작한 것은 다르고, M4 이행률 통계가 그 차이를 읽는다.
async function startOrResume() {
  const existing = await activeSession();
  if (!existing) return { session: null, recorded: [], needsResumeDecision: false };

  const recorded = await setsForSession(existing.id);
  const last = await lastCompletedSet(existing.id);
  const idleMs = last ? Date.now() - new Date(last.completed_at).getTime()
                      : Date.now() - new Date(existing.started_at).getTime();

  return { session: existing, recorded, needsResumeDecision: idleMs > RESUME_PROMPT_AFTER_MS, idleMs };
}

// 다음에 보여줄 세트의 인덱스. 기록된 행 수가 곧 진행 위치다
// (수행이든 건너뜀이든 "결정된" 세트이므로 둘 다 소비한다).
function nextSetIndex(recorded) {
  return recorded.length;
}

function baseSetRecord(session, prescribed, recordedCount, unilateral) {
  return {
    session_id: session.id,
    exercise_id: prescribed.exercise_id,
    set_index: prescribed.set_index,
    recorded_order: recordedCount,
    prescribed_weight: prescribed.prescribed_weight,
    prescribed_rep_low: prescribed.prescribed_rep_low,
    prescribed_rep_high: prescribed.prescribed_rep_high,
    prescribed_rir_low: prescribed.prescribed_rir_low,
    prescribed_rir_high: prescribed.prescribed_rir_high,
    // 처방 rest. 이걸 저장해야 M4가 실제 completed_at 간격과 비교할 수 있다.
    rest_seconds: prescribed.rest_seconds,
    // actual_weight가 한쪽 부하인지 양쪽 합인지. M3는 이 값이 다른 세트끼리 비교하지 않는다.
    unilateral: unilateral === true,
    // 워밍업은 hypertrophy 볼륨과 progression 계산에서 제외된다.
    // M3/M4는 이 플래그로 걸러낸다 — 세션에 존재하지만 자극 집계에는 들어가지 않는다.
    is_warmup: prescribed.is_warmup === true,
    note: null,
  };
}

async function completeSet(session, prescribed, recordedCount, { reps, weight, rir, unilateral }) {
  return recordSet({
    ...baseSetRecord(session, prescribed, recordedCount, unilateral),
    actual_reps: reps,
    actual_weight: weight,
    // 15회를 넘으면 RIR을 기록하지 않는다. 0으로 채우면 M3 엔진이 그 값을 믿는다.
    // 워밍업도 마찬가지로 RIR을 남기지 않는다 — 실패까지 남은 횟수를 물어볼 세트가 아니다.
    actual_rir: (prescribed.is_warmup || reps > RIR_UNRELIABLE_ABOVE_REPS) ? null : rir,
    completed: true,
    completed_at: new Date().toISOString(),
  });
}

async function skipSet(session, prescribed, recordedCount) {
  return recordSet({
    ...baseSetRecord(session, prescribed, recordedCount, prescribed.unilateral),
    actual_reps: null,
    actual_weight: null,
    actual_rir: null,
    completed: false,               // "안 함"이 아니라 "안 하기로 했음"
    completed_at: new Date().toISOString(),
  });
}

async function finishSession(session) {
  await updateSession(session.id, { status: 'done', ended_at: new Date().toISOString() });
}

async function skipSession(session, reason) {
  await updateSession(session.id, {
    status: 'skipped',
    skip_reason: reason,
    ended_at: new Date().toISOString(),
  });
}

// 최근 7일 안에 이미 수행(또는 건너뜀)한 템플릿 id 집합. 홈 화면 표시용.
async function recentlyLoggedTemplateIds(days = 7) {
  const cutoff = Date.now() - days * 24 * 60 * 60 * 1000;
  const sessions = await allSessions();
  return new Set(
    sessions
      .filter((session) => session.status !== 'in_progress')
      .filter((session) => new Date(session.started_at).getTime() >= cutoff)
      .map((session) => session.template_id)
  );
}

// 램프 주차 추정: 첫 세션 이후 경과일 / 7. 기록이 없으면 1주차.
// 실제 생활은 밀리므로 사용자가 화면에서 직접 바꿀 수 있고, 그 선택이 우선한다.
async function suggestedWeek(maxWeek = 4) {
  const sessions = await allSessions();
  if (sessions.length === 0) return 1;
  const firstStart = sessions.map((session) => session.started_at).sort()[0];
  const days = Math.floor((Date.now() - new Date(firstStart).getTime()) / 86400000);
  return Math.min(maxWeek, Math.floor(days / 7) + 1);
}

// 종목별 deload 신호. 반응형만 — 달력 기반 자동 deload는 만들지 않는다
// (parameters.deload.verdict: 직접 RCT 2편 모두 근비대에 null, 하나는 근력에 음성).
async function deloadSignals(exerciseIds) {
  const signals = [];
  for (const exerciseId of exerciseIds) {
    const sessions = await recentWorkingSets(exerciseId, { sessionCount: 6 });
    const series = sessions.map((sets) =>
      Math.max(...sets.map((set) => e1rm(set.actual_weight, set.actual_reps, set.actual_rir) ?? 0)));
    const signal = detectDeloadSignal(series.filter((value) => value > 0));
    if (signal) signals.push({ exercise_id: exerciseId, ...signal });
  }
  return signals;
}

const SKIP_REASONS = ['시간 없음', '피로', '통증', '헬스장 못 감', '그냥'];

// ── 자가점검 (M2) ─────────────────────────────────────────────────────────
// 검사 대상은 화면이 아니라 기록의 의미다: 수행 / 명시적 건너뜀 / 아직 안 함이 섞이지 않는가.
// 임시 세션을 만들어 확인하고 끝나면 지운다. 실제 훈련 기록은 건드리지 않는다.
async function selftestSessionRecording() {
  const results = [];
  const check = (label, ok, detail = '') => results.push({ ok, label, detail });

  const fakePrescribed = {
    exercise_id: 'back_squat', set_index: 1, bodyweight: false,
    prescribed_weight: 75, prescribed_rep_low: 12, prescribed_rep_high: 15,
    prescribed_rir_low: 4, prescribed_rir_high: 5, rest_seconds: 180,
  };

  // 워밍업 계산은 순수 함수라 여기서 직접 검사한다.
  const protocol = {
    compound_sets: [{ load_pct: 50, reps: 10, rest_seconds: 60 }, { load_pct: 75, reps: 6, rest_seconds: 60 }],
    isolation_sets: [{ load_pct: 50, reps: 10, rest_seconds: 60 }],
  };
  const machineCompound = { equipment: 'machine', muscles: { quads: 1, glutes: 1 } };
  const barbellIsolation = { equipment: 'barbell/EZ', muscles: { biceps: 1 } };

  const compoundWarmups = warmupSetsFor({}, machineCompound, 180, protocol);
  check('compound 워밍업 2세트', compoundWarmups.length === 2, `${compoundWarmups.length}세트`);
  check('워밍업 부하가 스택 단위(5kg)로 반올림',
    compoundWarmups.map((set) => set.weight).join() === '90,135',
    compoundWarmups.map((set) => set.weight).join());

  const isolationWarmups = warmupSetsFor({}, barbellIsolation, 14, protocol);
  check('isolation 워밍업 1세트', isolationWarmups.length === 1, `${isolationWarmups.length}세트`);
  check('바벨 워밍업이 2.5kg 단위', isolationWarmups[0]?.weight === 7.5, String(isolationWarmups[0]?.weight));

  check('맨몸 종목은 워밍업 없음',
    warmupSetsFor({ bodyweight: true }, machineCompound, null, protocol).length === 0);
  check('작업 부하보다 무거운 워밍업은 제외',
    warmupSetsFor({}, barbellIsolation, 2.5, protocol).length === 0,
    '2.5kg 작업 부하에서 워밍업 0세트');

  const session = await createSession('__selftest__');
  try {
    const completed = await completeSet(session, fakePrescribed, 0, { reps: 13, weight: 75, rir: 4 });
    check('완료 세트: completed=true', completed.completed === true, String(completed.completed));
    check('완료 세트: completed_at 존재', typeof completed.completed_at === 'string', completed.completed_at ?? '없음');
    check('완료 세트: actual_rir 보존', completed.actual_rir === 4, String(completed.actual_rir));

    const skipped = await skipSet(session, { ...fakePrescribed, set_index: 2 }, 1);
    check('건너뛴 세트: completed=false', skipped.completed === false, String(skipped.completed));
    check('건너뛴 세트: actual_reps=null', skipped.actual_reps === null, String(skipped.actual_reps));

    // 15회 초과 세트에서 RIR을 기록하지 않는지. 0으로 채우면 M3 엔진이 그 값을 믿는다.
    const highRep = await completeSet(session, { ...fakePrescribed, set_index: 3 }, 2, { reps: 20, weight: 40, rir: 2 });
    check(`${RIR_UNRELIABLE_ABOVE_REPS}회 초과 세트는 RIR을 버림`, highRep.actual_rir === null, String(highRep.actual_rir));

    const rows = await setsForSession(session.id);
    check('세션의 세트 3개 조회', rows.length === 3, `${rows.length}개`);
    check('기록 순서 보존', rows.map((row) => row.recorded_order).join() === '0,1,2', rows.map((row) => row.recorded_order).join());
    check('아직 안 한 세트는 행이 없음', rows.length === 3, '처방이 몇 세트든 기록된 행만 존재해야 한다');

    const resumePoint = nextSetIndex(rows);
    check('재개 위치 = 기록된 행 수', resumePoint === 3, String(resumePoint));
  } finally {
    const removed = await deleteSession(session.id);
    check('임시 세션 정리', removed === 3, `세트 ${removed}개 삭제`);
  }

  return { pass: results.every((result) => result.ok), results };
}

const BUILD_STAMP = '09-01 01:14 UTC';

  inventory: null, daysPerWeek: 5, generatedNote: '', programLabel: '복귀 램프', honesty: null,

};

const timer = createRestTimer({
  onTick: (remaining) => {
    state.remainingMs = remaining;
    const element = document.getElementById('remaining');
    if (element) element.textContent = formatRemaining(remaining);
  },
  onFinish: () => { if (state.phase === 'rest') goToCurrentSet(); },
});

const escapeHtml = (text) => String(text).replace(/[&<>"]/g, (character) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[character]));

const current = () => state.prescribedSets[state.index] ?? null;

function loadDefaults(prescribed) {
  state.reps = Math.floor((prescribed.prescribed_rep_low + prescribed.prescribed_rep_high) / 2);
  state.rir = prescribed.prescribed_rir_low;
  state.weight = prescribed.default_weight;
  state.unilateral = prescribed.unilateral === true;
}

function goToCurrentSet() {
  timer.stop();
  state.index = nextSetIndex(state.recorded);
  if (state.index >= state.prescribedSets.length) {
    finishSession(state.session).then(() => { state.phase = 'done'; render(); });
    return;
  }
  loadDefaults(current());
  state.phase = 'set';
  render();
}
