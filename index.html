    <button class="primary" data-action="resume">이어서 하기</button>
    <button class="secondary" data-action="finish-now">여기서 끝내기</button>
    <p class="note">끝내면 남은 세트는 기록되지 않습니다. 건너뛴 것으로 표시하지도 않습니다 —
       하지 않은 것과, 하지 않기로 표시한 것은 다릅니다.</p>`;
}

// 현재 종목의 세트 진행을 점으로 그린다. 워밍업과 본세트를 '|'로 나눠
// 지금 어느 구간에 있는지 글자를 읽지 않고도 보이게 한다.
function renderSetDots(prescribed) {
  const sameExercise = state.prescribedSets.filter((set) => set.exercise_id === prescribed.exercise_id);
  const currentIndex = state.prescribedSets.indexOf(prescribed);
  const dot = (set) => {
    const index = state.prescribedSets.indexOf(set);
    const classes = [index < currentIndex ? 'filled' : '', index === currentIndex ? 'current' : '']
      .filter(Boolean).join(' ');
    return `<i class="${classes}"></i>`;
  };
  const warmups = sameExercise.filter((set) => set.is_warmup);
  const working = sameExercise.filter((set) => !set.is_warmup);
  return `<span class="dots">${warmups.map(dot).join('')}` +
    `${warmups.length && working.length ? '<span class="sep">|</span>' : ''}` +
    `${working.map(dot).join('')}</span>`;
}

function renderSet() {
  const prescribed = current();
  const isWarmup = prescribed.is_warmup === true;
  const rirDisabled = state.reps > RIR_UNRELIABLE_ABOVE_REPS;
  const needsWeight = !prescribed.bodyweight && state.weight === null;

  const weightField = prescribed.bodyweight ? '' : `
    <div class="field">
      <label>중량 (kg${state.unilateral ? ', 한쪽' : ''})${prescribed.prescribed_weight === null ? ' — 처방값 없음, 직접 입력' : ''}</label>
      <div class="stepper">
        <button data-action="weight" data-delta="-1" ${state.weight === null ? 'disabled' : ''}>−</button>
        <output>${state.weight === null ? '—' : state.weight}</output>
        <button data-action="weight" data-delta="1">+</button>
      </div>
    </div>`;

  return `
    <div class="topbar"><h1>${escapeHtml(state.template.name)}</h1>
      <span class="muted">${state.recorded.length + 1} / ${state.prescribedSets.length}</span></div>

    <div class="phase ${isWarmup ? 'warmup' : 'working'}">
      <span>${isWarmup
        ? `워밍업 ${prescribed.set_index} / ${prescribed.total_sets}`
        : `본세트 ${prescribed.set_index} / ${prescribed.total_sets}`}</span>
      ${renderSetDots(prescribed)}
    </div>

    <p class="exercise">${escapeHtml(prescribed.exercise.name_en)}</p>
    <p class="setcount">${isWarmup
      ? `준비 세트 — 작업 부하의 ${prescribed.load_pct}%. 힘을 쓰지 않습니다.`
      : '기록에 남는 세트입니다.'}</p>

    <div class="prescription${isWarmup ? ' warmup' : ''}">
      <div class="load">${prescribed.bodyweight ? '맨몸' : `${prescribed.prescribed_weight ?? '?'} kg`}
        × ${prescribed.prescribed_rep_low === prescribed.prescribed_rep_high
          ? prescribed.prescribed_rep_low
          : `${prescribed.prescribed_rep_low}–${prescribed.prescribed_rep_high}`}</div>
      <div class="rir">${isWarmup
        ? 'RIR을 묻지 않습니다'
        : `RIR ${prescribed.prescribed_rir_low}–${prescribed.prescribed_rir_high}`}</div>
    </div>

    ${weightField}

    ${prescribed.bodyweight ? '' : `
    <div class="field">
      <label>수행 방식</label>
      <div class="chips">
        <button data-action="unilateral" data-value="0" aria-pressed="${!state.unilateral}">양쪽 동시</button>
        <button data-action="unilateral" data-value="1" aria-pressed="${state.unilateral}">한쪽씩</button>
      </div>
      ${state.unilateral ? `<p class="note">중량은 <strong>한쪽 부하</strong>로 기록됩니다.
        횟수도 한쪽 기준입니다. 근비대 측면에서 어느 쪽이 낫다는 근거는 근거표에 없습니다 —
        기록을 섞지 않기 위한 구분입니다.</p>` : ''}
    </div>`}

    <div class="field">
      <label>수행 횟수</label>
      <div class="stepper">
        <button data-action="reps" data-delta="-1">−</button>
        <output>${state.reps}</output>
        <button data-action="reps" data-delta="1">+</button>
      </div>
    </div>

    ${isWarmup ? '' : `
    <div class="field">
      <label>RIR — 몇 회 더 할 수 있었나</label>
      <div class="chips">
        ${RIR_CHOICES.map((value) => `
          <button data-action="rir" data-value="${value}"
                  aria-pressed="${!rirDisabled && state.rir === value}"
                  ${rirDisabled ? 'disabled' : ''}>${value}${value === 6 ? '+' : ''}</button>`).join('')}
      </div>
      ${rirDisabled ? `<p class="note">15회를 넘는 세트에서는 RIR을 기록하지 않습니다.
        자기보고 오차가 ~5회에 달해 제어 변수로 쓸 수 없습니다
        (<span class="tag">rir_self_report_validity · moderate_high</span>).</p>` : ''}
    </div>`}

    <button class="primary" data-action="complete" ${needsWeight ? 'disabled' : ''}>
      ${needsWeight ? '중량을 입력하세요' : (isWarmup ? '워밍업 완료' : '세트 완료')}</button>
    <button class="secondary" data-action="skip-set">이 세트 건너뜀</button>

    ${prescribed.progression && !isWarmup ? `<p class="note">
      <span class="tag">progression</span> ${escapeHtml(prescribed.progression.reason)}</p>` : ''}
    ${prescribed.item_note ? `<p class="note">${escapeHtml(prescribed.item_note)}</p>` : ''}`;
}

function renderRest() {
  const next = state.prescribedSets[nextSetIndex(state.recorded)] ?? null;
  const previous = state.prescribedSets[state.recorded.length - 1];
  const isNewExercise = next && previous && next.exercise_id !== previous.exercise_id;

  return `
    <div class="topbar"><h1>쉬는시간</h1>
      <span class="muted">${state.recorded.length} / ${state.prescribedSets.length}</span></div>

    <div class="timer"><div class="remaining" id="remaining">${formatRemaining(state.remainingMs)}</div></div>

    ${next ? `
      <div class="next">
        <div class="label">${isNewExercise ? '다음 운동' : next.is_warmup ? '다음 — 워밍업' : '다음 — 본세트'}</div>
        <p class="exercise" style="font-size:1.25rem">${escapeHtml(next.exercise.name_en)}</p>
        <p class="muted">${next.set_index}세트 / ${next.total_sets} ·
           ${next.bodyweight ? '맨몸' : `${next.prescribed_weight ?? state.weight ?? '?'} kg`}
           × ${next.prescribed_rep_low}–${next.prescribed_rep_high} ·
           RIR ${next.prescribed_rir_low}–${next.prescribed_rir_high}</p>
      </div>` : '<p>마지막 세트였습니다.</p>'}

    <button class="primary" data-action="next-set">건너뛰고 다음 세트</button>

    <div class="warn">화면을 끄면 알림이 오지 않습니다. iOS 웹앱에는 로컬 알림 기능이 없습니다.
      남은 시간 자체는 시계로 계산하므로 화면을 껐다 켜도 정확합니다.
      ${timer.hasWakeLock() ? '타이머가 도는 동안 화면을 켜 둡니다.' : '이 환경에서는 화면 켜두기(Wake Lock)를 쓸 수 없습니다.'}</div>`;
}

function renderSkipMenu() {
  return `
    <div class="topbar"><h1>오늘 건너뜀</h1></div>
    <p class="muted">이유를 고르면 기록됩니다. 이유별 빈도는 나중에 대시보드에 나옵니다.</p>
    <div class="chips" style="flex-direction:column">
      ${SKIP_REASONS.map((reason) => `
        <button data-action="skip-session" data-reason="${escapeHtml(reason)}"
                style="height:3.25rem">${escapeHtml(reason)}</button>`).join('')}
    </div>
    <button class="secondary" data-action="back">돌아가기</button>`;
}

function renderDone() {
  const completedCount = state.recorded.filter((row) => row.completed).length;
  const skippedCount = state.recorded.filter((row) => !row.completed).length;
  return `
    <div class="topbar"><h1>세션 종료</h1></div>
    <p>수행 ${completedCount}세트 · 건너뜀 ${skippedCount}세트 · 처방 ${state.prescribedSets.length}세트</p>
    <p class="note">기록은 이 기기에 저장됐습니다. 다음 세션 처방은 M3(progression 엔진)에서 이 기록으로 계산됩니다.</p>
    <button class="secondary" data-action="reload">처음으로</button>`;
}

function render() {
  if (state.phase === 'loading') { app.textContent = '불러오는 중…'; return; }
  if (state.phase === 'error') {
    app.innerHTML = `<div class="topbar"><h1>실패</h1></div><p>${escapeHtml(state.error)}</p>
      <p class="note">file:// 로 열면 데이터를 못 읽습니다. 이 폴더에서
      <code>python -m http.server 8765 --bind 127.0.0.1</code> 실행 후 http://127.0.0.1:8765 로 열 것.</p>`;
    return;
  }
  if (state.phase === 'pick') app.innerHTML = renderPick();
  else if (state.phase === 'backup') app.innerHTML = renderBackup();
  else if (state.phase === 'dashboard') app.innerHTML = renderDashboard();
  else if (state.phase === 'routine') app.innerHTML = renderRoutine();
  else if (state.phase === 'intro') app.innerHTML = renderIntro();
  else if (state.phase === 'resume_prompt') app.innerHTML = renderResumePrompt();
  else if (state.phase === 'set') app.innerHTML = renderSet();
  else if (state.phase === 'rest') app.innerHTML = renderRest();
  else if (state.phase === 'skip_menu') app.innerHTML = renderSkipMenu();
  else if (state.phase === 'done') app.innerHTML = renderDone();
}

// 대시보드는 '처방'이 아니라 '수행'을 집계한다. 과거 로그에서 하체 세트는 시트에 처방되어
// 있었고 실제로는 상당수가 수행되지 않았다 — 두 숫자를 섞으면 그 실패가 보이지 않는다.
async function buildDashboard() {
  const sinceDays = 7;
  const [sets, sessions, exercises] = await Promise.all([allSets(), allSessions(), allExercises()]);
  const exercisesById = Object.fromEntries(exercises.map((exercise) => [exercise.id, exercise]));

  const parameters = Object.fromEntries(state.evidence.parameters.map((entry) => [entry.id, entry]));
  const plan = state.rampPlan.find((entry) => entry.week === state.week) ?? state.rampPlan[0];
  const scale = plan.volume_pct_of_target / 100;
  const intermediateBand = parameters.weekly_volume.training_status_bands.intermediate;

  const exerciseIds = [...new Set(sets.filter((set) => set.completed && !set.is_warmup).map((set) => set.exercise_id))];
  const trends = exerciseIds
    .map((exerciseId) => {
      const trend = e1rmTrend(sets, exerciseId);
      return trend ? { ...trend, name: exercisesById[exerciseId]?.name_en ?? exerciseId } : null;
    })
    .filter(Boolean)
    .sort((a, b) => b.points.length - a.points.length);

  return {
    sinceDays,
    volume: performedVolume(sets, exercisesById, { sinceDays }),
    band: intermediateBand.map((value) => value * scale),
    floor: parameters.weekly_volume.model.minimum_effective_dose,
    noiseFloorPct: 3.27,
    gaps: performedCoverageGaps(sets, exercisesById, state.coverageMap, { sinceDays }),
    stats: sessionStats(sessions),
    rest: restAdherence(sets),
    trends,
  };
}

// ── 입력 ──────────────────────────────────────────────────────────────────
app.addEventListener('click', async (event) => {
  const button = event.target.closest('button[data-action]');
  if (!button) return;
  const { action, delta, value, reason, template } = button.dataset;

  if (action === 'pick') {
    state.template = state.templates.find((item) => item.id === template);
    state.prescribedSets = await expandPrescribedSets(state.template, state.warmupProtocol);
    state.phase = 'intro';
    render();

  } else if (action === 'back-to-pick') {
    state.phase = 'pick';
    state.backupMessage = '';
    render();

  } else if (action === 'week') {
    state.week = Number(button.dataset.week);
    await setMeta('selected_week', state.week);
    render();

  } else if (action === 'days') {
    state.daysPerWeek = Number(button.dataset.days);
    await setMeta('days_per_week', state.daysPerWeek);
    render();

  } else if (action === 'regenerate') {
    try {
      const plan = state.rampPlan.find((entry) => entry.is_main_block);
      const result = generateWeek({
        exercises: await allExercises(),
        coverageMap: state.coverageMap,
        evidence: state.evidence,
        inventory: state.inventory,
        daysPerWeek: state.daysPerWeek,
        volumePct: plan.volume_pct_of_target,
      });
      await setMeta('generated_main_block', { generated_at: new Date().toISOString(), templates: result.templates });
      state.templates = [...state.templates.filter((template) => !template.is_main_block), ...result.templates];
      const warnings = result.findings.filter((finding) => finding.severity === 'warning');
      state.generatedNote = `세션 ${result.templates.length}개 생성. 근육당 목표 ${result.targetPerMuscle.toFixed(1)} fractional sets.` +
        (warnings.length ? ` 경고 ${warnings.length}건: ${warnings[0].message}` : ' 커버리지 위반 없음.');
    } catch (error) {
      // 생성 실패 시 기존 프로그램을 건드리지 않는다.
      state.generatedNote = `생성 실패: ${error.message} — 기존 프로그램을 유지합니다.`;
    }
    render();

  } else if (action === 'routine') {
    state.phase = 'routine';
    state.routineDone = new Set();
    state.routineMessage = '';
    render();

  } else if (action === 'routine-item') {
    const itemId = button.dataset.item;
    if (state.routineDone.has(itemId)) state.routineDone.delete(itemId);
    else state.routineDone.add(itemId);
    render();

  } else if (action === 'routine-done') {
    const totalItems = state.routine.blocks.reduce((sum, block) => sum + block.items.length, 0);
    await recordRoutineSession(state.routine.id, { completedItems: state.routineDone.size, totalItems });
    state.routineMessage = `기록했습니다 — ${state.routineDone.size} / ${totalItems}개 항목. ` +
      '세트는 남기지 않습니다. 근비대 볼륨이 아니기 때문입니다.';
    render();

  } else if (action === 'dashboard') {
    state.phase = 'dashboard';
    state.dashboard = null;
    render();
    state.dashboard = await buildDashboard();
    render();

  } else if (action === 'backup') {
    state.phase = 'backup';
    state.backupText = '';
    state.backupMessage = '';
    render();

  } else if (action === 'backup-json') {
    const backup = await exportUserData();
    state.backupText = JSON.stringify(backup);
    state.backupMessage = `세션 ${backup.sessions.length}개 · 세트 ${backup.sets.length}개.`;
    render();

  } else if (action === 'backup-csv') {
    state.backupText = await exportCsv();
    state.backupMessage = 'CSV(long format). MATLAB에서 readtable로 읽을 수 있습니다.';
    render();

  } else if (action === 'backup-copy') {
    const text = document.getElementById('backup-text').value;
    try {
      await navigator.clipboard.writeText(text);
      state.backupMessage = '복사했습니다.';
    } catch {
      // 샌드박스나 권한 문제로 막힐 수 있다. 그때는 직접 선택해서 복사해야 한다.
      document.getElementById('backup-text').select();
      state.backupMessage = '자동 복사가 막혔습니다. 위 상자를 길게 눌러 직접 복사하세요.';
    }
    render();

  } else if (action === 'backup-restore') {
    try {
      const result = await importUserData(JSON.parse(document.getElementById('backup-text').value));
      state.recorded = [];
      state.session = null;
      state.loggedTemplateIds = await recentlyLoggedTemplateIds();
      state.backupMessage = `복원 완료: 세션 ${result.sessions}개 · 세트 ${result.sets}개.`;
    } catch (error) {
      state.backupMessage = `복원 실패: ${error.message}`;
    }
    render();

  } else if (action === 'reps') {
    state.reps = Math.max(1, state.reps + Number(delta));
    render();

  } else if (action === 'weight') {
    const step = weightIncrement(current().exercise);
    state.weight = Math.max(0, (state.weight ?? 0) + Number(delta) * step);
    render();

  } else if (action === 'rir') {
    state.rir = Number(value);
    render();

  } else if (action === 'unilateral') {
    state.unilateral = value === '1';
    render();

  } else if (action === 'start' || action === 'resume') {
    // 세션 행은 여기서 처음 만들어진다. 앱을 열기만 한 것은 세션이 아니다.
    state.session ??= await createSession(state.template.id);
    goToCurrentSet();

  } else if (action === 'complete') {
    unlockAudio(); // iOS는 사용자 제스처 안에서 만든 AudioContext만 소리를 낸다. 이 탭이 그 제스처다.
    const prescribed = current();
    const record = await completeSet(state.session, prescribed, state.recorded.length, {
      reps: state.reps,
      weight: prescribed.bodyweight ? null : state.weight,
      rir: state.rir,
      unilateral: state.unilateral,
    });
    state.recorded.push(record);
    if (nextSetIndex(state.recorded) >= state.prescribedSets.length) {
      await finishSession(state.session);
      state.phase = 'done';
      render();
    } else {
      state.phase = 'rest';
      timer.start(prescribed.rest_seconds);
      render();
    }

  } else if (action === 'skip-set') {
    const record = await skipSet(state.session, current(), state.recorded.length);
    state.recorded.push(record);
    goToCurrentSet();

  } else if (action === 'next-set') {
    goToCurrentSet();

  } else if (action === 'skip-session-menu') {
    state.phase = 'skip_menu';
    render();

  } else if (action === 'skip-session') {
    state.session ??= await createSession(state.template.id);
    await skipSession(state.session, reason);
    state.phase = 'done';
    render();

  } else if (action === 'finish-now') {
    timer.stop();
    await finishSession(state.session);
    state.phase = 'done';
    render();

  } else if (action === 'back') {
    state.phase = 'intro';
    render();

  } else if (action === 'reload') {
    location.reload();
  }
});

// ── 시작 ──────────────────────────────────────────────────────────────────
try {
  await seedIfNeeded();
  const [templateFile, evidence, loggedTemplateIds, coverageMapResponse, inventoryResponse] = await Promise.all([
    loadTemplateFile(), loadEvidence(), recentlyLoggedTemplateIds(),
    bundledFetch('data/coverage-map.json'), bundledFetch('data/gym-inventory.json'),
  ]);
  const routineResponse = await bundledFetch('data/nightly-routine.json');
  if (!routineResponse.ok) throw new Error(`nightly-routine.json 로드 실패 (${routineResponse.status})`);
  state.routine = await routineResponse.json();
  if (!coverageMapResponse.ok) throw new Error(`coverage-map.json 로드 실패 (${coverageMapResponse.status})`);
  if (!inventoryResponse.ok) throw new Error(`gym-inventory.json 로드 실패 (${inventoryResponse.status})`);
  state.coverageMap = await coverageMapResponse.json();
  state.inventory = await inventoryResponse.json();
  state.templates = templateFile.templates;
  // 사용자가 생성기를 돌린 적이 있으면 본 블록은 생성 결과로 대체한다.
  const generated = await getMeta('generated_main_block');
  if (generated?.templates?.length) {
    state.templates = [...templateFile.templates.filter((template) => !template.is_main_block), ...generated.templates];
  }
  state.daysPerWeek = (await getMeta('days_per_week')) ?? 5;
  state.warmupProtocol = templateFile.warmupProtocol;
  state.rampPlan = templateFile.rampPlan;
  state.programLabel = templateFile.programLabel;
  state.honesty = templateFile.honesty;
  state.evidence = evidence;
  state.loggedTemplateIds = loggedTemplateIds;

  // 사용자가 고른 주차가 있으면 그것이 우선하고, 없으면 첫 세션 이후 경과일로 추정한다.
  const savedWeek = await getMeta('selected_week');
  state.week = savedWeek ?? await suggestedWeek(state.rampPlan.length);

  // deload는 제안일 뿐 자동 실행이 아니다. 본 블록 종목만 본다.
  const mainBlockExercises = [...new Set(state.templates
    .filter((template) => template.is_main_block)
    .flatMap((template) => template.items.map((item) => item.exercise_id)))];
  state.deloads = await deloadSignals(mainBlockExercises);

  const resumed = await startOrResume();
  state.session = resumed.session;
  state.recorded = resumed.recorded;
  state.idleMs = resumed.idleMs ?? 0;

  const resumedTemplate = resumed.session
    ? state.templates.find((item) => item.id === resumed.session.template_id)
    : null;

  if (resumed.session && !resumedTemplate) {
    // 앱을 업데이트하면서 템플릿 id가 바뀌거나 사라진 경우다. 여기서 예외를 던지면
    // 앱 전체가 열리지 않는다 — 오래된 세션 하나 때문에 앱이 멈춰서는 안 된다.
    // 기록된 세트가 있으면 그대로 마감해 보존하고, 빈 세션이면 지운다(잃을 것이 없다).
    if (resumed.recorded.length > 0) await finishSession(resumed.session);
    else await deleteSession(resumed.session.id);
    state.session = null;
    state.recorded = [];
    state.phase = 'pick';
    render();

  } else if (!resumed.session) {
    // 진행 중인 세션이 없으면 오늘 뭘 할지부터 고른다.
    state.phase = 'pick';
    render();

  } else {
    state.template = resumedTemplate;
    state.prescribedSets = await expandPrescribedSets(state.template, state.warmupProtocol);

    if (resumed.needsResumeDecision) { state.phase = 'resume_prompt'; render(); }
    else if (resumed.recorded.length > 0) goToCurrentSet();
    else { state.phase = 'intro'; render(); }
  }
} catch (error) {
  state.phase = 'error';
  state.error = error.message;
  render();
}

</script>

<script>
  // 서비스워커는 secure context(https 또는 localhost)에서만 등록된다.
  // 실패해도 앱은 그대로 동작한다 — 오프라인만 안 될 뿐이다.
  if ('serviceWorker' in navigator) {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
