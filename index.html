<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>트레이닝 프로그램</title>
<style>
  :root {
    color-scheme: light dark;
    --line: rgba(128,128,128,.35);
    --dim: rgba(128,128,128,.9);
  }
  * { box-sizing: border-box; }
  body {
    font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 0 auto;
    padding: max(1rem, env(safe-area-inset-top)) 1rem calc(1.5rem + env(safe-area-inset-bottom));
    max-width: 30rem;
    -webkit-text-size-adjust: 100%;
  }
  h1 { font-size: 1.15rem; margin: 0; }
  .muted { color: var(--dim); font-size: .875rem; }
  .topbar { display: flex; justify-content: space-between; align-items: baseline;
            border-bottom: 1px solid var(--line); padding-bottom: .6rem; margin-bottom: 1.25rem; }

  .exercise { font-size: 1.6rem; font-weight: 600; margin: .25rem 0 0; }
  .setcount { color: var(--dim); margin: .15rem 0 1.25rem; }
  .prescription { text-align: center; padding: 1.25rem 0; border-block: 1px solid var(--line); }
  .prescription .load { font-size: 2.1rem; font-weight: 600; letter-spacing: -.02em; }
  .prescription .rir { color: var(--dim); margin-top: .3rem; }

  .field { margin: 1.25rem 0; }
  .field > label { display: block; font-size: .8125rem; color: var(--dim); margin-bottom: .4rem; }
  .stepper { display: flex; align-items: center; gap: .75rem; }
  .stepper output { font-size: 1.9rem; font-weight: 600; min-width: 4.5rem; text-align: center; font-variant-numeric: tabular-nums; }
  .stepper button { width: 3.25rem; height: 3.25rem; font-size: 1.5rem; }

  .chips { display: flex; gap: .4rem; flex-wrap: wrap; }
  .chips button { flex: 1 1 2.6rem; min-width: 2.6rem; height: 3rem; font-size: 1.05rem; }
  .chips button[aria-pressed="true"] { background: CanvasText; color: Canvas; }

  button {
    font: inherit; color: inherit; background: transparent;
    border: 1px solid currentColor; border-radius: .6rem; padding: .5rem;
    -webkit-tap-highlight-color: transparent;
  }
  button:disabled { opacity: .35; }
  .primary { width: 100%; padding: 1.15rem; font-size: 1.15rem; font-weight: 600; margin-top: 1.5rem; }
  .secondary { width: 100%; padding: .85rem; margin-top: .6rem; color: var(--dim); }

  .timer { text-align: center; padding: 2rem 0 1rem; }
  .timer .remaining { font-size: 4rem; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.03em; }
  .next { border: 1px solid var(--line); border-radius: .75rem; padding: 1rem; margin-top: 1rem; }
  .next .label { font-size: .75rem; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }

  .warn { border: 1px solid var(--line); border-radius: .6rem; padding: .75rem;
          font-size: .8125rem; color: var(--dim); margin-top: 1rem; }
  details { margin-top: 1.25rem; font-size: .875rem; }
  details p { color: var(--dim); }
  summary { cursor: pointer; padding: .35rem 0; }
  .tag { display: inline-block; font-size: .6875rem; border: 1px solid var(--line);
         border-radius: .3rem; padding: .05rem .35rem; color: var(--dim); }
  .note { font-size: .8125rem; color: var(--dim); margin-top: .75rem; }
  /* 워밍업과 본세트를 한눈에 구분한다. 헬스장에서 작은 글자를 읽고 있을 여유가 없다. */
  .phase { display: flex; align-items: center; justify-content: space-between;
           padding: .5rem .8rem; border-radius: .5rem; margin-bottom: .9rem;
           font-size: .875rem; font-weight: 600; letter-spacing: .02em; }
  .phase.working { background: CanvasText; color: Canvas; }
  .phase.warmup { background: transparent; color: var(--dim);
                  border: 2px dashed var(--line); }
  .dots { display: flex; gap: .3rem; align-items: center; }
  .dots i { width: .55rem; height: .55rem; border-radius: 50%;
            border: 1.5px solid currentColor; display: inline-block; }
  .dots i.filled { background: currentColor; }
  .dots i.current { box-shadow: 0 0 0 3px rgba(128,128,128,.35); }
  .dots .sep { opacity: .5; margin: 0 .15rem; }
  .prescription.warmup { border-style: dashed; }
  .prescription.warmup .load { font-size: 1.7rem; opacity: .8; }
</style>
<script>
  // 모듈의 문법 오류는 조용히 죽는다 — 증상이 "버튼이 안 눌린다"뿐이라 원인을 못 찾는다.
  // 클래식 스크립트로 window error를 잡아 화면에 띄운다.
  addEventListener('error', (event) => {
    const box = document.createElement('pre');
    box.style.cssText = 'white-space:pre-wrap;color:#c4302b;border:1px solid;padding:.75rem;margin:1rem 0';
    box.textContent = `JS 오류: ${event.message}\n${event.filename ?? ''}:${event.lineno ?? ''}`;
    document.body && document.body.prepend(box);
  });
</script>

 입력한 값에서 시작해 double progression으로 갱신된다.", "volume": "본 블록 기준 주 112 작업 세트다. 훈련 경험이 적은 사람의 근거표 밴드(4-8 fractional sets/근육)보다 높다. 밴드 초과가 해롭다는 근거는 없지만 초과분의 이득도 확인되지 않았다. 첫 4주는 램프(33 → 50 → 67 → 100%)라 40세트에서 시작한다.", "starting_loads": "시작 부하가 없다. 역산할 기준값이 존재하지 않으므로 추측하지 않는다 — 첫 세트에서 입력한 값이 기준이 된다. 가볍게 시작해서 올리는 편이 안전하다.", "rir": "보고한 RIR에 +1 보정을 적용한다. 초보는 최대 노력을 과소평가한다(PMID 28301439). 이 보정은 검증된 발견이 아니라 엔지니어링 추론이다.", "biggest_lever": "종목 구성이 아니라 매주 무게가 올라가는지가 결정적이다. 미훈련 여성 55명 8주 RCT에서 progressive overload가 삼두 두께 +21.4% vs 비점진 +11.3% vs 대조 +1.3% (PMID 41718594).", "not_covered": "식이·에너지 균형·체지방 감소는 이 근거표에 항목이 0건이다. 앱은 그에 대해 아무것도 주장하지 않는다."}, "ramp_plan": [{"week": 1, "label": "W1", "is_main_block": false, "volume_pct_of_target": 33, "reps": "12-15", "rir": "4-5", "working_sets_per_session": [8, 8, 8, 8, 8]}, {"week": 2, "label": "W2", "is_main_block": false, "volume_pct_of_target": 50, "reps": "10-12", "rir": "3", "working_sets_per_session": [12, 12, 12, 12, 12]}, {"week": 3, "label": "W3", "is_main_block": false, "volume_pct_of_target": 67, "reps": "8-12", "rir": "2", "working_sets_per_session": [16, 16, 16, 16, 16]}, {"week": 4, "label": "W4", "is_main_block": false, "volume_pct_of_target": 100, "reps": "8-12", "rir": "1-2", "working_sets_per_session": [22, 24, 21, 22, 23]}, {"week": 5, "label": "본 블록 (W5+)", "is_main_block": true, "volume_pct_of_target": 100, "reps": "8-12", "rir": "1-2", "working_sets_per_session": [22, 24, 21, 22, 23]}], "evidence_source": {"reps_and_rir": "returner_protocol.ramp_schedule + parameters.proximity_to_failure.exercise_specific_rir_targets", "rest": "parameters.rest_interval.defaults_seconds (multi_joint 120-180s, single_joint 60-120s)", "loads": "시작 부하 없음. 첫 수행에서 입력한 값이 기준이 되고 이후 double progression으로 계산한다.", "volume_band": "parameters.weekly_volume.training_status_bands.intermediate (10-16) × 주차별 램프 비율"}, "warmup_protocol": {"certainty": "convention", "honesty": "근거표에 워밍업 세트 수·강도를 검증한 항목이 없다. 이 표는 관행이다. 근거가 있는 것은 '각 동작의 첫 노출을 부드럽게 하라'는 원칙뿐이다 (returner_protocol.core_rationale.the_first_session_is_the_dangerous_one — repeated-bout effect, PMID 25810385).", "not_counted_as_volume": "워밍업은 hypertrophy 볼륨 집계에 들어가지 않는다. parameters.volume_metric은 RIR 3 이하의 hard set만 센다. 따라서 워밍업을 넣어도 램프 볼륨은 변하지 않는다.", "compound_sets": [{"load_pct": 50, "reps": 10, "rest_seconds": 60}, {"load_pct": 75, "reps": 6, "rest_seconds": 60}], "isolation_sets": [{"load_pct": 50, "reps": 10, "rest_seconds": 60}], "rules": {"compound_vs_isolation": "종목의 muscles 항목이 2개 이상이면 compound로 본다.", "bodyweight": "맨몸 종목은 워밍업을 넣지 않는다.", "drop_if_not_lighter": "계산된 워밍업 부하가 작업 부하 이상이면 그 워밍업 세트를 뺀다(가벼운 바벨 종목에서 발생).", "unknown_working_weight": "작업 부하가 정해지지 않은 종목은 워밍업 1세트를 부하 없이 넣고 사용자가 입력한다."}}, "templates": [{"id": "ramp_w1_lower_a", "name": "Lower A — 대퇴사두", "week": 1, "day_index": 1, "is_ramp": true, "is_main_block": false, "items": [{"exercise_id": "leg_press", "order": 1, "target_sets": 2, "target_rep_low": 12, "target_rep_high": 15, "target_rir_low": 4, "target_rir_high": 5, "rest_seconds": 150, "prescribed_weight": null, "progression": "double"}, {"exercise_id": "leg_extension", "order": 2, "target_sets": 2, "target_rep_low": 12, "target_rep_high": 15, "target_rir_low": 4, "target_rir_high": 5, "rest_seconds": 90, "prescribed_weight": null, "item_note": "등받이를 눕혀 고관절을 편 자세로. 90도 직립보다 rectus femoris에 유리 (coverage_rules.quad_rf_variant, certainty moderate, PMID 39699974).", "progression": "double"}, {"exercise_id": "seated_leg_curl", "order": 3, "target_sets": 2, "target_rep_low": 12, "target_rep_high": 15, "target_rir_low": 4, "target_rir_high": 5, "rest_seconds": 90, "prescribed_weight": null, "item_note": "무릎 굴곡은 앉은 자세(고관절 굴곡)로. prone보다 햄스트링 전체와 이관절 head에 유리하다 (coverage_rules.hamstring_two_slot, certainty moderate_high, PMID 33009197).", "progression": "double"}, {"exercise_id": "calf_raise", "order": 4, "target_sets": 2, "target_rep_low": 12, "target_rep_high": 15, "target_rir_low": 4, "target_rir_high": 5, "rest_seconds": 90, "prescribed_weight" . 훈련 직전에는 하지 않는 편이 낫다 — 정적 스트레칭 직후 일시적 근력 저하는 널리 보고되지만 이 프로젝트의 근거표에는 그 항목이 없다(요확인).", "items": [{"id": "hip_flexor_stretch", "name": "고관절 굴곡근", "prescription": "좌우 각 30–45초", "hold_seconds": 40, "cue": "런지 자세에서 뒷다리 엉덩이를 앞으로 밀고 갈비뼈를 내린다. 허리를 젖혀서 만드는 느낌이면 잘못된 것이다."}, {"id": "thoracic_rotation", "name": "흉추 회전", "prescription": "좌우 각 8회", "hold_seconds": null, "cue": "옆으로 누워 무릎을 포갠 채 위쪽 팔을 열어 젖힌다. 골반은 고정."}, {"id": "pec_doorway", "name": "가슴 (문틀)", "prescription": "좌우 각 30초", "hold_seconds": 30, "cue": "팔꿈치를 어깨 높이에 두고 한 발 앞으로. 어깨 앞쪽이 찌릿하면 각도를 낮춘다."}, {"id": "hamstring_stretch", "name": "햄스트링", "prescription": "좌우 각 30초", "hold_seconds": 30, "cue": "무릎을 살짝 굽힌 채 고관절에서 접는다. 등을 말아서 손끝을 닿게 하는 것이 목적이 아니다."}, {"id": "calf_stretch", "name": "종아리", "prescription": "좌우 각 30초", "hold_seconds": 30, "cue": "벽을 밀며 뒷발 뒤꿈치를 바닥에. 무릎을 편 자세와 굽힌 자세를 각각 해 두 근육을 나눠 늘린다."}]}]}, "docs/programming-evidence.json": {"schema_version": "1.0.0", "generated": "2026-08-24", "purpose": "Evidence base for a hypertrophy program-generation engine. The engine reads this file; programming rules are NOT hardcoded in application logic. Update this file when literature changes.", "population_note": "The evidence pool is predominantly young (mean ~25 y), ~79% male, and 6-12 week interventions. Trained-participant data are sparse. Apply accordingly.", "certainty_scale": {"high": "Multiple independent syntheses converge; effect direction robust to method.", "moderate_high": "Between moderate and high: converging evidence, but resting on one population or one measurement method.", "moderate": "One good meta-analysis or several converging RCTs; some methodological limits.", "low": "Single small trial, subgroup analysis, or narrative review.", "very_low": "Underpowered, contested, or convention with no primary validation.", "convention": "Widely practiced with NO peer-reviewed validation located. Must be labelled as such in any user-facing copy.", "low_expert_opinion": "Synthesis or guideline construction with no direct trial. Label evidence-INFORMED, not evidence-based.", "low_biomechanical_reasoning": "Inferred from applied anatomy, not measured. Never surface to users as evidence.", "high_absence_of_evidence": "High confidence that NO supporting literature exists (exhaustive search returned nothing).", "engine_note": "This list is the CLOSED vocabulary for the certainty field. Any engine switching on certainty must handle all nine values."}, "measurement_caveat": {"note": "Ultrasound muscle thickness dominates this literature. It is site-specific, operator-dependent, and confounded by acute swelling.", "swelling_confound": "After 7/14/21 sets, muscle thickness and echo intensity returned to baseline within 24 h (PMID 41565215). Post-test timing relative to last session materially affects reported hypertrophy.", "noise_floor_pct": 3.27, "noise_floor_source": "MRI typical error 2xTE = 3.27% (PMID 38174375)", "engine_rule": "Set the app's own progress-detection threshold above ~3%. Present expected gains as ranges, never single numbers.", "single_site_warning": "Downgrade any single-site ultrasound comparison one certainty level (PMID 38513182)."}, "optimization_hierarchy": {"source": "PMID 42172438 (Roberts MD et al., J Appl Physiol 140(6):1761-1776; summary of the 2025 Jyvaskyla conference, published 2026)", "order": ["weekly_volume", "proximity_to_failure", "rest_interval", "exercise_selection"], "source_honesty": "IMPORTANT: the cited paper lists these variables UNRANKED and also includes volume-load, which this ordering omits. It is a conference-summary review, not a formal consensus statement. The ORDER above is a synthesis judgement across this whole evidence base, NOT the paper's ranking. Do not present it to users as a published hierarchy.", "source_verbatim": "'weekly sets, volume-load, rest interval duration, and training proximity to failure meaningfully influence hypertrophic outcomes in the general population, whereas exercise selection can be flexible'", "note": "Exercise selection is flexible and should be optimized for MUSCLE COVERAGE and adherence, not treated as a primary growth lever. Volume explains only ~22% of between-study variance (Pelland marginal R2 = 22.3%) - do not oversell any single lever."}, "parameters": [{"id": "weekly_volume", "domain": "volume", "question": "How many sets per muscle per week?", "certainty": "moderate", "model": {"shape": "square_root", "unit": "fractional weekly sets per muscle", "slope_at_mean_pct_per_set": 0.24, "slope_ci": [0.15, 0.33], "mean_volume_anchor": 12.25, "minimum_effective_dose": 4, "posterior_prob_slope_gt_zero": 1.0, "plateau_identified": false, "marginal_r_squared": 0.223, "cost_per_detectable_increment": {"5_to_10_sets": 6, "11_to_18_sets": 8.5, "19_to_29_sets": 10.75, "30_to_42_sets": 12.5}}, "engine_rule": "Model return as sqrt(weekly fractional sets), NOT linear and NOT a capped step. Floor 4 fractional sets/wk for any muscle to be grown. Default band 10-20. Above ~20, add volume only if recovery and adherence permit.", "training_status_bands": {"novice_or_returner_ramp": [4, 8], "intermediate": [10, 16], "advanced": [14, 22], "triceps_exception_upper": 25}, "evidence": [{"pmid": "41343037", "first_author": "Pelland JC", "year": 2025, "journal": "Sports Medicine 56(2):481-505", "doi": "10.1007/s40279-025-02344-w", "design": "Bayesian multi-level meta-regression, 67 studies, 2058 participants", "role": "primary"}, {"pmid": "27433992", "first_author": "Schoenfeld BJ", "year": 2017, "journal": "J Sports Sci 35(11)", "doi": "10.1080/02640414.2016.1210197", "design": "Meta-regression, 34 groups from 15 studies; linear model, ES +0.023/set = +0.37%/set", "role": "superseded", "note": "Linear form is likely misspecification; over-predicts at high volume. Sanity-check only in the 5-15 set range."}, {"pmid": "35291645", "first_author": "Baz-Valle E", "year": 2022, "journal": "J Hum Kinet 81:199-210", "doi": "10.2478/hukin-2022-0017", "design": "Meta-analysis, 6 studies quantitative, trained men", "role": "supporting", "note": "Moderate vs high volume: quads p=0.19 (ns), biceps p=0.59 (ns), triceps p=0.01 favouring high. Triceps result is one significant p among three uncorrected tests - may not replicate."}, {"pmid": "39405023", "first_author": "Radaelli R", "year": 2025, "journal": "Sports Medicine 55(1):167-192", "doi": "10.1007/s40279-024-02123-z", "design": "Network meta-analysis, 151 trials, n=6306, adults 60+", "role": "supporting", "note": "LOW volume was the MOST effective tier for lean body mass (SMD 0.25, CI 0.10-0.40) and hypertrophy (SMD 0.40, CI 0.25-0.54) in older adults. Moderate and high volume were required only for STRENGTH."}, {"pmid": "38174375", "first_author": "Lixandrao ME", "year": 2024, "journal": "J Appl Physiol 136(2):421-429", "doi": "10.1152/japplphysiol.00670.2023", "design": "Within-subject unilateral RCT, 85 older adults, 1 vs 4 sets, MRI", "role": "supporting", "note": "51/85 were non-responders to single-set training; those showed a significant time x set interaction favouring 4 sets. This is the direct RCT support for the non-responder escalation branch."}, {"pmid": "30160627", "first_author": "Heaselgrave SR", "year": 2019, "journal": "IJSPP 14(3)", "doi": "10.1123/ijspp.2018-0427", "design": "RCT, 49 trained men, 9 vs 18 vs 27 weekly biceps sets, 6 wk", "role": "contrary", "note": "MT +4.3% / +9.5% / +5.4%; no between-group differences; middle dose numerically best."}], "caveats": ["Marginal R2 = 22.3%: weekly volume explains under a quarter of between-study variance. Do not present volume as the dominant lever.", "Sample is 79% male, mean age 25. The 30-42 set range rests on few studies and is extrapolation-heavy.", "High-volume arms are disproportionately short (6-8 wk) studies where fatigue masking may not have dissipated."]}, {"id": "volume_metric", "domain": "volume", "question": "What counts as a set?", "certainty": "moderate", "engine_rule": "The HARD SET (taken to <=~3 RIR) is the atomic unit. Count indirect (secondary-muscle) sets at exactly 0.5. Store tonnage/volume-load for load progression only - never use it to equate or compare programs. Do not credit sets below ~5 reps or above ~30 reps at full weight in the hypertrophy tally.", "fractional_indirect_coefficient": 0.5, "evidence": [{"pmid": "41343037", "first_author": "Pelland JC", "year": 2025, "doi": "10.1007/s40279-025-02344-w", "design": "Bayesian model comparison of three set-counting schemes (indirect = 0, 0.5, 1)", "role": "primary", "note": "Fractional (0.5) won decisively: hypertrophy 2xLog(BF) = 9.48 vs 'total' and 10.29 vs 'direct'; strength 18.21 and 45.96. This upgrades the 0.5 convention from folklore to best-supported-of-three."}, {"pmid": "30063555", "first_author": "Baz-Valle E", "year": 2021, "journal": "JSCR 35(3):870-878", "doi": "10.1519/JSC.0000000000002776", "design": "Systematic review, 14 RCTs, trained participants", "role": "supporting", "note": "Sets to or near failure are an adequate volume metric in the 6-20+ rep range."}, {"pmid": "33826122", "first_author": "Nunes JP", "year": 2021, "journal": "Sports Medicine 51(6)", "doi": "10.1007/s40279-021-01449-2", "design": "Methodological review", "role": "supporting", "note": "Volume-load is mathematically confounded with load and inappropriate when load is the manipulated variable."}], "caveats": ["Only three coefficients (0, 0.5, 1) were tested - 0.5 may be the best of a coarse grid, not the true value.", "The correct coefficient likely varies by muscle and exercise. Adding isolation arm work to a multi-joint program produced NO additional arm hypertrophy in untrained (PMID 23537028) or trained (PMID 26244600) men, implying indirect arm sets from pressing/pulling may be worth closer to 1.0 for arms specifically.", "CRITICAL PAIRING: Pelland's dose-response curve is expressed in FRACTIONAL sets. If the engine uses raw set counts against that curve, the prescription is miscalibrated."]}, {"id": "per_session_volume_cap", "domain": "volume", "question": "How many sets per muscle in one session?", "certainty": "low", "engine_rule": "Soft cap ~8-10 hard sets per muscle per session. If the weekly target exceeds this, RAISE FREQUENCY rather than deepen the session. Ship as a hedge, explicitly labelled - do NOT surface 'junk volume' to users as established fact.", "evidence": [{"pmid": "27941492", "first_author": "Amirthalingam T", "year": 2017, "journal": "JSCR 31(11)", "doi": "10.1519/JSC.0000000000001747", "design": "RCT, 19 men, 6 wk, 10 vs 5 sets/exercise", "role": "supporting", "note": "5-set group showed GREATER trunk lean mass gains (reported p=0.043, ES -0.21). Authors recommend 4-6 sets/exercise. FLAG: an effect of |0.21| in n=19 is hard to reconcile with p=0.043, and the ES sign runs opposite to the stated direction - the reported triplet (ES, p, direction) is internally odd. Treat the DIRECTION as the finding and do not derive a magnitude from this study."}, {"pmid": "30153194", "first_author": "Schoenfeld BJ", "year": 2019, "journal": "MSSE 51(1):94-103", "doi": "10.1249/MSS.0000000000001764", "design": "RCT, 34 trained men, 8 wk, 1 vs 3 vs 5 sets/exercise/session", "role": "contrary", "note": "Muscle thickness showed a dose-response FAVOURING higher per-session volume - points the opposite direction."}, {"pmid": "41565215", "first_author": "Alvarez M", "year": 2026, "journal": "Int J Sports Med 47(8)", "doi": "10.1055/a-2791-5145", "design": "Acute crossover, 13 trained men, 7 vs 14 vs 21 lower-body sets", "role": "contrary", "note": "21 sets raised session-RPE and lowered perceived recovery (p<0.05) but produced NO difference in muscle thickness, echo intensity, or 10RM volume-load; all swelling markers returned to baseline within 24 h. The cost showed up in perception, not physiology."}], "caveats": ["This is the weakest rule in the file. No adequately powered chronic RCT has isolated per-session set count at equated weekly volume.", "If the true ceiling is much higher, this cap needlessly forces extra sessions and hurts adherence."]}, {"id": "frequency", "domain": "volume", "question": "How often per muscle per week?", "certainty": "moderate_high", "engine_rule": "Treat frequency as a VOLUME-DELIVERY MECHANISM, not a growth variable. Set weekly volume first, then choose frequency to keep per-session volume under the cap and to fit the user's schedule. 16 sets as 2x8 or 4x4 is roughly equivalent for hypertrophy. RAISE frequency when strength is a co-goal - that effect is real and large. Allow higher frequency for upper body than lower body.", "model": {"hypertrophy_slope_pct": 0.32, "hypertrophy_ci": [-0.14, 0.82], "hypertrophy_posterior_prob": 0.913, "strength_slope_pct": 3.27, "strength_ci": [2.74, 3.84], "strength_posterior_prob": 1.0, "slope_interpretation": "strength_slope_pct is the MARGINAL slope at the mean frequency. Because the model shows diminishing returns, the 1x -> 2x step (12.72% -> 17.32%, a 4.60 pp jump) is steeper than the mean slope and does not contradict it. Do not read 3.27 as a per-session constant. (Unrelated coincidence: 3.27 also appears as the MRI noise floor - different quantity.)"}, "evidence": [{"pmid": "41343037", "first_author": "Pelland JC", "year": 2025, "doi": "10.1007/s40279-025-02344-w", "role": "primary", "note": "Hypertrophy CrI spans zero - 'compatible with negligible effects'. Strength: 1x/wk -> 12.72% vs 2x/wk -> 17.32%."}, {"pmid": "30558493", "first_author": "Schoenfeld BJ", "year": 2019, "journal": "J Sports Sci 37(11)", "doi": "10.1080/02640414.2018.1555906", "design": "Meta-analysis, 25 studies", "role": "primary", "note": "No significant difference between higher and lower frequency on a volume-equated basis, including in trained participants."}, {"pmid": "27102172", "first_author": "Schoenfeld BJ", "year": 2016, "journal": "Sports Medicine 46(11)", "doi": "10.1007/s40279-016-0543-8", "design": "Meta-analysis, 10 studies", "role": "superseded", "note": "ES 0.49 vs 0.30 (p=0.002) favouring higher frequency. THIS IS THE ORIGIN OF THE UBIQUITOUS 'TRAIN EACH MUSCLE TWICE A WEEK' RULE, and it is contradicted by the two larger later analyses once volume is equated."}, {"pmid": "8563679", "first_author": "MacDougall JD", "year": 1995, "journal": "Can J Appl Physiol 20(4)", "doi": "10.1139/h95-038", "design": "Tracer study, 6 men", "role": "mechanistic", "note": "MPS +50% at 4 h, +109% at 24 h, back to within 14% of control by ~36 h. Mechanistic rationale for >=2x/week, but n=6 and 1995 methods."}, {"pmid": "40267413", "first_author": "Margoni M", "year": 2025, "journal": "JSCR 39(6):625-633", "doi": "10.1519/JSC.0000000000005103", "design": "Randomised crossover, 16 trained adults", "role": "supporting", "note": "Higher neuromuscular fatigue in LOWER body than upper body across all protocols (p<0.05). No meaningful sex difference - do NOT build sex-specific recovery rules."}], "caveats": ["Wrong at extremes the data barely cover: 20+ sets in one weekly session is not equivalent to 4 spread sessions, because per-session ceilings bind.", "The '2x/week minimum' heuristic the app may inherit from popular sources traces to PMID 27102172 and does not survive volume-equation."]}, {"id": "proximity_to_failure", "domain": "intensity", "question": "How close to failure?", "certainty": "moderate", "engine_rule": "DECOUPLE RIR TARGET FROM GOAL - this is the highest-value rule in the file. Hypertrophy: 0-2 RIR. Strength: 2-4 RIR. Model 0-2 RIR as a PLATEAU, not a gradient; apply a small penalty only beyond ~3 RIR. Do NOT build a per-RIR linear decay function. Allow failure only on the FINAL set of an exercise.", "exercise_specific_rir_targets": {"heavy_compound_squat_deadlift_pattern": [2, 3], "moderate_load_compound": [1, 2], "machine_and_isolation": [0, 1], "returner_ramp_override": {"week_1": [4, 5], "week_2": 3, "week_3": 2, "week_4_onward": "normal targets", "note": "The override is a TAPER, not a flat band. It ends when the ramp ends."}}, "evidence": [{"pmid": "38970765", "first_author": "Robinson ZP", "year": 2024, "journal": "Sports Medicine 54(9):2209-2231", "doi": "10.1007/s40279-024-02069-2", "design": "Exploratory multilevel meta-regressions", "role": "primary", "note": "ATTRIBUTION CORRECTION: commonly mis-cited as 'Refalo 2024'. First author is Robinson ZP; Refalo is 4th of 7. Hypertrophy: RIR slopes negative, CIs excluding null. Strength: CIs contain null. NUMERIC SLOPE MAGNITUDES COULD NOT BE VERIFIED (paywalled) - do not derive numeric rules from this paper without full text."}, {"pmid": "36334240", "first_author": "Refalo MC", "year": 2023, "journal": "Sports Medicine 53(3):649-665", "doi": "10.1007/s40279-022-01784-y", "design": "Systematic review + meta-analysis, 15 studies", "role": "primary", "note": "Any-definition failure vs non-failure ES 0.19 (CI 0.00-0.37, p=0.045). MOMENTARY failure vs non-failure ES 0.12 (CI -0.13-0.37, p=0.343) - null. The effect VANISHES as the definition tightens, the opposite of a real dose-response. Authors report evidence for a NON-LINEAR relationship."}, {"pmid": "38393985", "first_author": "Refalo MC", "year": 2024, "journal": "J Sports Sci 42(1):85-101", "doi": "10.1080/02640414.2024.2321021", "design": "8-wk within-participant contralateral RCT, 18 trained", "role": "primary", "note": "Quadriceps thickness FAIL 0.181 cm vs RIR 0.182 cm - functionally identical. Also: mean accumulated volume was SIMILAR between FAIL and RIR over 8 weeks."}, {"pmid": "33497853", "first_author": "Grgic J", "year": 2022, "journal": "J Sport Health Sci 11(2)", "doi": "10.1016/j.jshs.2021.01.007", "design": "Meta-analysis, 15 studies", "role": "supporting", "note": "Overall hypertrophy ES 0.22 (CI -0.11-0.55) null. RESISTANCE-TRAINED SUBGROUP hypertrophy ES 0.15 (CI 0.03-0.26). Subgroup analysis on a null main effect - treat cautiously."}, {"pmid": "42410632", "first_author": "Wu S", "year": 2026, "journal": "BMC Sports Sci Med Rehabil 18(1)", "doi": "10.1186/s13102-026-01861-z", "design": "Meta-analysis, 20 studies, 556 participants", "role": "contrary", "note": "Dynamic strength FAVOURS non-failure: SMD 0.24 (CI 0.06-0.42, p=0.01). No effect on hypertrophy."}], "caveats": ["In the flagship meta-regression, RIR was ESTIMATED BY REVIEWERS from study text, not measured. This makes the headline dose-response substantially softer than it is usually presented.", "No study manipulates VERIFIED RIR across the full 0-4 range with adequate power.", "Evidence beyond 3 RIR is Very Low - the region is barely studied."]}, {"id": "rir_self_report_validity", "domain": "intensity", "question": "Can the app trust a user's reported RPE/RIR?", "certainty": "moderate_high", "critical": true, "summary": "The error is REAL, DIRECTIONAL, and BOUNDED. Users believe they are closer to failure than they are, so an uncorrected RPE prescription systematically UNDER-DOSES stimulus.", "error_model": {"reps_le_8_or_load_ge_75pct": {"assume_offset": 0, "absolute_error_reps": 0.65, "trust": "high"}, "reps_9_to_15": {"assume_offset": 1, "absolute_error_reps": 2.0, "trust": "medium"}, "reps_gt_15": {"assume_offset": null, "observed_absolute_error_reps": 5.15, "observed_error_sd": 2.92, "observed_source": "PMID 30747900, called 5RPE in ~16-rep back squat sets", "trust": "none", "action": "Do not use RIR as a control variable. Prescribe load-and-reps or an explicit 'to failure' instruction. The observed error is recorded to justify the exclusion, NOT as an offset to apply - an error of that size cannot be corrected away."}}, "engine_rule": "(1) Only prescribe RIR targets in the 0-3 range. (2) Apply the load-and-rep-dependent correction above - this is an ENGINEERING INFERENCE, not a validated finding; label it internally. (3) Periodically prescribe an actual set to failure PER EXERCISE and derive a per-user, per-exercise offset. (4) Do NOT assume accuracy improves with app tenure. (5) Do not build logic that branches on a 1-RIR difference.", "evidence": [{"pmid": "30747900", "first_author": "Zourdos MC", "year": 2021, "journal": "JSCR 35(Suppl 1):S158-S165", "doi": "10.1519/JSC.0000000000002995", "design": "25 trained men, back squat 70% 1RM to failure (mean 16 reps)", "role": "critical", "note": "RIR error: at 9RPE = 2.05 +/- 1.73 reps; at 7RPE = 3.65 +/- 2.46; AT 5RPE = 5.15 +/- 2.92 REPS. Error correlates with total reps in set (r=0.65 at 5RPE). TRAINING AGE WAS NOT PREDICTIVE (p>0.05)."}, {"pmid": "37967832", "first_author": "Refalo MC", "year": 2024, "journal": "JSCR 38(3):e78-e85", "doi": "10.1519/JSC.0000000000004653", "design": "24 trained, bench press 75% 1RM, 1-RIR and 3-RIR calls", "role": "favourable_case", "note": "Raw accuracy -0.17 +/- 1.00 reps; absolute 0.65 +/- 0.78 reps. Statistical equivalence within +/-1 rep. No relationship with sex, years of experience, or relative strength."}, {"pmid": "37036795", "first_author": "Remmert JF", "year": 2023, "journal": "Percept Mot Skills 130(3)", "doi": "10.1177/00315125231169868", "design": "58 participants, 3 isolation exercises at 72.5% 1RM", "role": "moderator", "note": "Significant main effects for proximity to failure (p<0.01) and set number (p<0.01). NO effect of exercise (p=0.688), sex (p=0.917), or training experience (p=0.462)."}, {"pmid": "33629974", "first_author": "Odgers JB", "year": 2021, "journal": "JSCR 35(Suppl 1):S23-S30", "doi": "10.1519/JSC.0000000000003905", "design": "27 trained, front squat and hex-bar deadlift at 80% 1RM", "role": "moderator", "note": "At 80% 1RM squat error was only 0.09-0.86 reps at 9RPE vs 0.71-1.19 at 6RPE - far smaller than the 70% 1RM squat error in PMID 30747900. LOAD, not exercise, drives this."}, {"pmid": "37436724", "first_author": "Remmert JF", "year": 2023, "journal": "Percept Mot Skills 130(5)", "doi": "10.1177/00315125231189098", "design": "9 trained men, 6 wk of practice with feedback", "role": "contrary_to_learning", "note": "Significant effect of time on RAW error (-0.077 reps/session) but NO significant effect on ABSOLUTE error - the MAGNITUDE of error did not improve. n=9, weak evidence of no effect, but it contradicts the common assumption that RPE skill trains up."}, {"pmid": "40249908", "first_author": "Hermann T", "year": 2025, "journal": "MSSE 57(9):2021-2031", "doi": "10.1249/MSS.0000000000003728", "design": "RCT, 42 trained, 8 wk", "role": "contrary", "note": "Accuracy DID improve over the intervention, particularly for bench press; better for bench than squat. Conflicts with the above. Calibrate PER EXERCISE, not per user."}, {"pmid": "28301439", "first_author": "Ormsbee MJ", "year": 2019, "journal": "JSCR 33(2):337-345", "doi": "10.1519/JSC.0000000000001901", "design": "27 college-aged men, experienced vs novice", "role": "returner_relevant", "note": "At 1RM: experienced RPE 9.86 vs novice 9.35 (p=0.011) - NOVICES UNDER-RATE MAXIMAL EFFORT. Directly relevant: assume a returner's reported RIR is 1-2 reps optimistic for the first several weeks."}, {"pmid": "36662153", "first_author": "Perez-Castilla A", "year": 2023, "journal": "JSCR 37(8):1551-1558", "doi": "10.1519/JSC.0000000000004448", "design": "15 participants, Smith-machine prone bench pull", "role": "supporting", "note": "Absolute errors up to ~2 RIR. All models underestimated RIR at >=1 RIR and overestimated at 0 RIR."}], "caveats": ["No study has validated a correction factor of the kind proposed here. The offset table is an engineering inference from the data.", "The favourable-accuracy case (bench, >=75% 1RM, 0-3 RIR) is a single lab and participants knew they were being tested to failure."]}, {"id": "load_and_rep_range", "domain": "intensity", "question": "What load / rep range?", "certainty": "high", "engine_rule": "Let load float freely across ~60-85% 1RM (roughly 5-20 reps) for hypertrophy without expected penalty. Select load by exercise suitability, joint tolerance, and user preference. Reserve >=80% 1RM for when strength is a stated goal. CRITICAL INTERACTION: load-independence is CONDITIONAL on high effort. Prescribing 30% 1RM at 3 RIR is prescribing nothing - it is the one combination the literature affirmatively predicts will fail.", "practical_ranges": {"compound": [5, 10], "isolation": [10, 20]}, "evidence": [{"pmid": "33433148", "first_author": "Lopez P", "year": 2021, "journal": "MSSE 53(6):1206-1216", "doi": "10.1249/MSS.0000000000002585", "design": "Network meta-analysis, 28 studies, 747 adults, sets to volitional failure only", "role": "primary", "note": "Hypertrophy: NO differences between low (>15RM), moderate (9-15RM), high (<=8RM), p=0.113-0.469; p=0.871-0.995 in high-quality subgroup. Strength: high and moderate load both superior to low (SMD 0.60-0.63 and 0.34-0.35)."}, {"pmid": "28834797", "first_author": "Schoenfeld BJ", "year": 2017, "journal": "JSCR 31(12):3508-3523", "doi": "10.1519/JSC.0000000000002200", "design": "Meta-analysis, 21 studies, all sets to momentary failure", "role": "primary", "note": "Independent replication: strength favours high load, hypertrophy similar."}, {"pmid": "25530577", "first_author": "Schoenfeld BJ", "year": 2016, "journal": "Eur J Sport Sci 16(1)", "doi": "10.1080/17461391.2014.989922", "design": "Meta-analysis, 8 studies, 191 subjects", "role": "dissenting", "note": "Hypertrophy difference favouring HIGH load 0.43 +/- 0.24 (CI -0.05-0.92, p=0.076). Non-significant but the point estimate was not trivial. Do not present load-independence as settled fact; if a user is a non-responder on low-load work, shifting heavier is evidence-consistent."}]}, {"id": "rest_interval", "domain": "rest", "question": "How long between sets?", "certainty": "moderate", "engine_rule": "Rest is INSTRUMENTAL, not an independent growth driver. Model it as a volume-load preservation constraint: if rep drop-off between sets exceeds ~20-25%, LENGTHEN REST before reducing load. Defaults: multi-joint 120-180 s, single-joint 60-120 s. Force >=180 s on the primary heavy compound if strength is a co-goal.", "defaults_seconds": {"multi_joint": [120, 180], "single_joint": [60, 120], "strength_primary": 180, "low_load_high_rep_to_failure": [30, 60]}, "evidence": [{"pmid": "39205815", "first_author": "Singer A", "year": 2024, "journal": "Front Sports Act Living 6:1429789", "doi": "10.3389/fspor.2024.1429789", "design": "Bayesian meta-analysis, 9 studies, 19 measurements", "role": "primary", "note": "Controlled pairwise short vs longer: arm 0.13 (CrI -0.27-0.51), thigh 0.17 (-0.13-0.43), whole body -0.08 (-0.45-0.29). ALL CREDIBLE INTERVALS CROSS ZERO. Authors attribute the small benefit to reductions in volume load with short rest; detriments plateau beyond ~90 s."}, {"pmid": "35622106", "first_author": "Longo AR", "year": 2022, "journal": "JSCR 36(6):1554-1559", "doi": "10.1519/JSC.0000000000003668", "design": "10-wk within-subject 2x2 volume-equated RCT, n=28", "role": "mediation_proof", "note": "Quad CSA: LI +13.1% and VLI-SI +12.9% vs SI +6.8% and VSI-LI +6.6%. GROUPING IS BY VOLUME LOAD, NOT REST LENGTH. This isolates the mediator. Two valid engine solutions exist: rest longer, or rest short and ADD SETS to restore volume load."}, {"pmid": "37347940", "first_author": "Rosa A", "year": 2023, "journal": "JSCR 37(7):1350-1357", "doi": "10.1519/JSC.0000000000004508", "design": "Acute crossover, squat and leg extension at 1/2/3 min", "role": "supporting", "note": "Largest difference is 1 min vs 2-3 min; TRIVIAL difference between 2 and 3 min for both exercise types."}, {"pmid": "27984843", "first_author": "Fink JE", "year": 2017, "journal": "Int J Sports Med 38(2)", "doi": "10.1055/s-0042-119204", "design": "8-wk RCT, n=21, 40% 1RM to failure, 30 s vs 150 s", "role": "boundary", "note": "No between-group differences. For low-load high-rep blocks taken to failure, rest can be compressed to 30-60 s."}, {"pmid": "28933024", "first_author": "Grgic J", "year": 2018, "journal": "Sports Medicine 48(1):137-151", "doi": "10.1007/s40279-017-0788-x", "design": "Systematic review, 23 studies, 491 participants", "role": "strength_only", "note": ">2 min appears required to maximise STRENGTH in trained individuals; 60-120 s sufficient in untrained. Narrative synthesis, no pooled SMD - the 2-min threshold is an author judgement."}], "caveats": ["No chronic trial has compared optimal rest for compound vs isolation exercise directly. The two-tier rule is a reasonable inference, not a measured finding.", "The Singer analysis equates SETS, not TIME. If short rests are used to fit MORE total sets into a fixed session, the calculus changes."]}, {"id": "exercise_selection_principle", "domain": "exercise_selection", "question": "How should the engine choose exercises?", "certainty": "moderate", "engine_rule": "SELECTION HEURISTIC: tag each exercise with where in its ROM the EXTERNAL MOMENT ARM PEAKS, and prefer exercises whose peak torque coincides with the target muscle's lengthened position. Do NOT tag by joint angle alone. Optimize selection for MUSCLE COVERAGE and adherence, not as a primary growth lever. Never rank exercises by EMG.", "evidence": [{"pmid": "41777276", "first_author": "Pedrosa GF", "year": 2026, "journal": "Sports Med Int Open 10", "doi": "10.1055/a-2733-7605", "design": "Narrative review", "role": "organizing_principle", "note": "'Greater muscle growth after exercises and ROMs that train muscles at longer lengths occurs WHEN THERE IS A RELEVANT EXTERNAL TORQUE IN THE LENGTHENED POSITION.' Low as evidence, high as a design principle - it explains the calf, triceps, and null joint-angle results with one rule. Untested as a prediction rule."}, {"pmid": "37877099", "first_author": "Plotkin DL", "year": 2023, "journal": "Front Physiol 14:1279170", "doi": "10.3389/fphys.2023.1279170", "design": "9-wk RCT, n=34, MRI CSA, hip thrust vs back squat", "role": "emg_falsification", "note": "All gluteal sites showed higher sEMG in hip thrust, BUT THIS DID NOT PREDICT HYPERTROPHY. Gluteal mCSA CIs all straddle zero. Squat additionally grew quads (+3.6 cm2) and adductors (+2.5 cm2). This directly falsifies EMG-based exercise ranking."}, {"pmid": "32077380", "first_author": "Nunes JP", "year": 2021, "journal": "Eur J Sport Sci 21(2)", "doi": "10.1080/17461391.2020.1733672", "design": "Meta-analysis, 11 quality-appraised studies", "role": "order", "note": "Exercise ORDER: hypertrophy ES 0.03 (p=0.862) - no effect. Strength favours whatever is done first (MJ-first ES 0.32 p=0.034; SJ-first ES -0.58 p=0.032). Order by the user's STRENGTH priority, not by a hypertrophy rule. Do not tell users 'compounds first' is required for growth."}, {"pmid": "39388663", "first_author": "Kassiano W", "year": 2025, "journal": "Res Q Exerc Sport 96(2)", "doi": "10.1080/02701367.2024.2409961", "design": "10-wk RCT, n=70", "role": "rotation", "note": "Rotating exercises across the week produced the same hypertrophy as constant selection (MT +7.8-17.7% vs +7.5-19.3%, p>.05). Rotation is an ADHERENCE feature, not a growth feature."}, {"pmid": "37582807", "first_author": "Haugen ME", "year": 2023, "journal": "BMC Sports Sci Med Rehabil 15(1):103", "doi": "10.1186/s13102-023-00713-4", "design": "Meta-analysis, 13 studies, 1016 participants", "role": "equipment", "note": "Free weights vs machines, hypertrophy SMD -0.055 (CI -0.397-0.287, p=0.751) - null. Strength transfers preferentially to the modality trained. Equipment is a FREE VARIABLE."}, {"pmid": "40692697", "first_author": "Larsen S", "year": 2025, "journal": "Front Physiol 16:1611468", "doi": "10.3389/fphys.2025.1611468", "design": "8-wk within-participant, n=24 trained, cable vs dumbbell lateral raise, ROM matched", "role": "equipment", "note": "Multivariate BF < 0.01, 'extreme' support for the NULL. Do not encode 'cables are better because of constant tension'."}, {"pmid": "42516618", "first_author": "Hermann T", "year": 2026, "journal": "Int J Exerc Sci 19(1):1008", "design": "8-wk RCT, n=48, pre-exhaust vs traditional", "role": "pre_exhaust", "note": "Slightly greater gains favouring TRADITIONAL, with statistical uncertainty. Do not generate pre-exhaust supersets as a hypertrophy-optimising template."}]}, {"id": "range_of_motion", "domain": "exercise_selection", "question": "Full ROM or lengthened partials?", "certainty": "moderate", "engine_rule": "Default to FULL, COMFORTABLE, CONTROLLED ROM - the option that is never wrong. Deviate to lengthened partials only for a stated reason (pain, load limitation, time). NEVER prescribe shortened partials. Do NOT prescribe 'maximum possible ROM' as a blanket rule. Do NOT claim lengthened partials build more muscle.", "user_facing_copy": "Equivalent, with a possible small edge for including the stretched position.", "evidence": [{"pmid": "41055237", "first_author": "Gschneidner D", "year": 2025, "journal": "J Sports Sci 43(23):2963-2976", "doi": "10.1080/02640414.2025.2567805", "design": "Pre-registered randomised cluster trial, 15 sites, n=297, 12 wk", "role": "primary", "note": "THE LARGEST AND BEST-POWERED TRIAL ON THIS QUESTION IS A NULL. Arm CSA condition x time = -0.032; thigh = 0. Equivalence p: arm 0.071, thigh 0.019 (neither cleared the adjusted alpha of 0.005). CSA was ESTIMATED, not imaged."}, {"doi": "10.47206/ijsc.v3i1.182", "first_author": "Wolf M", "year": 2023, "journal": "Int J Strength Cond 3(1)", "pmid": null, "design": "Meta-analysis - JOURNAL NOT INDEXED IN PUBMED, k and n unverifiable", "role": "most_cited_favourable", "note": "Overall SMDs favoured FULL ROM but were trivial-to-small (0.05-0.2). Long-length-partials subgroup: -0.28 (95% CI -0.81 to 0.16), CI CROSSES ZERO. This -0.28 is the number most often quoted in practitioner media; always present it with its interval."}, {"pmid": "40570881", "first_author": "Varovic D", "year": 2025, "journal": "Int J Sports Med 46(14)", "doi": "10.1055/a-2615-4935", "design": "Bayesian meta-analysis, 12 studies, regional outcomes", "role": "regional_null", "note": "Proximal SMD 0.05 (QI -0.07-0.16), mid 0.07 (-0.02-0.15), distal 0.09 (-0.01-0.19). Do NOT promise users regional shaping from length manipulation. Caveat: average between-condition length contrast was only 21.8% - possibly underpowered against the real manipulation."}, {"pmid": "39959841", "first_author": "Wolf M", "year": 2025, "journal": "PeerJ 13:e18904", "doi": "10.7717/peerj.18904", "design": "8-wk within-participant RCT, n=30 TRAINED", "role": "supporting_null", "note": "Bayes factors 0.16-0.30, 'moderate' support for the null. Authors' own recommendation is to emphasise the stretched position EITHER by full ROM OR by partials - a statement about INCLUDING the lengthened position, not about partials being superior."}, {"pmid": "34170576", "first_author": "Pallares JG", "year": 2021, "journal": "Scand J Med Sci Sports 31(10)", "doi": "10.1111/sms.14006", "design": "Meta-analysis, 16 studies, RoB 2 + GRADE", "role": "full_rom_favourable", "note": "Lower-limb hypertrophy ES 0.88 (p=0.027) favouring full ROM. IMPORTANT LIMITATION: this pooled LENGTHENED and SHORTENED partials together. Most partial arms were shortened-biased, so ES 0.88 substantially overstates the disadvantage of lengthened partials."}, {"pmid": "40113586", "first_author": "Larsen S", "year": 2025, "journal": "J Sports Sci 43(10):986-994", "doi": "10.1080/02640414.2025.2481534", "design": "8-wk within-participant, n=23, 7.2 y training age", "role": "diminishing_rom", "note": "Extending leg-press knee flexion from ~100 to ~154 deg did nothing: multivariate BF < 0.01, 'extreme' support for the null. Beyond a functionally adequate ROM the returns are nil."}, {"pmid": "41988507", "first_author": "Larsen S", "year": 2026, "journal": "Front Physiol 17:1750722", "doi": "10.3389/fphys.2026.1750722", "design": "10-wk within-participant, 30 UNTRAINED men enrolled / 24 completed, cable curl at peak shoulder extension vs neutral, RESISTANCE PROFILE AND ROM MATCHED", "role": "mechanistic_null", "note": "Proximal ATE -0.40 mm (CrI -1.06-0.26), distal +0.21 mm (-0.25-0.65). The only study isolating joint angle from resistance profile - and it found nothing. This is why the engine must key on TORQUE PROFILE, not joint angle."}], "muscle_specific_exceptions": {"calf_gastrocnemius": {"pmid": "37015016", "note": "Lengthened (deep dorsiflexion) partials: MG +15.2% vs full +6.7% vs shortened +3.4% (p<=0.009). The strongest muscle-specific case for the lengthened-partials concept.", "certainty": "moderate"}, "biceps": {"pmid": "36828324", "note": "Initial (lengthened) ROM preacher curl > final ROM for CSA at 70% biceps length (p=0.001); no difference at 50% (p=0.311); no difference in summed CSA (p=0.111).", "certainty": "low"}}}, {"id": "tempo_and_contraction_type", "domain": "execution", "question": "Tempo, eccentric emphasis, technique strictness?", "certainty": "moderate", "engine_rule": "Do NOT prescribe tempo as a hypertrophy variable. Instruct: control the eccentric (~1-3 s), do not bounce, let the concentric be intentional but not deliberately slowed. REJECT '4-0-4' style templates as growth-optimising. Reject super-slow (>10 s/rep). Prescribe normal coupled concentric-eccentric reps as default. Keep technique cues for JOINT SAFETY, not growth optimisation.", "evidence": [{"pmid": "25601394", "first_author": "Schoenfeld BJ", "year": 2015, "journal": "Sports Medicine 45(4):577-85", "doi": "10.1007/s40279-015-0304-0", "design": "Meta-analysis, 8 studies", "role": "primary", "note": "Hypertrophy similar across repetition durations 0.5-8 s. >10 s/rep is inferior, though authors note a lack of controlled studies. Only 8 studies - thin base."}, {"pmid": "39652733", "first_author": "da Silva LSL", "year": 2025, "journal": "JSCR 39(1):115-134", "doi": "10.1519/JSC.0000000000004981", "design": "Meta-analysis, 26 RCTs, 682 participants, direct imaging only", "role": "eccentric", "note": "Eccentric vs concentric: SMD 0.285 (CI -0.131-0.701, p=0.179), I2 = 84.4%, GRADE: VERY LOW (authors' own rating). Subgroups favouring eccentric (upper limbs, <=8 wk, muscle-thickness assessment, isokinetic) are exactly the signature expected from residual swelling and equipment artefacts."}, {"pmid": "40191387", "first_author": "Augustin F", "year": 2025, "journal": "Int J Exerc Sci 18(3):329-342", "doi": "10.70252/GDBL2230", "design": "8-wk within-participant, n=30, strict vs cheat curls and pushdowns", "role": "technique", "note": "Similar increases at all sites, BF 0.06-0.61 supporting the null - DESPITE markedly greater volume load for CHEAT every week. Volume load and hypertrophy dissociated cleanly. Do not gate progression on strict-form volume-load metrics for isolation work."}, {"pmid": "41951916", "first_author": "Cowley N", "year": 2026, "journal": "Sports Medicine 56(8):1955-1977", "doi": "10.1007/s40279-026-02428-1", "design": "Bayesian network meta-analysis, 8 RT methods", "role": "context", "note": "'No resistance training method that consistently induces superior adaptations.' All strength/power relative effects had CrIs crossing zero."}]}, {"id": "advanced_techniques", "domain": "execution", "question": "Drop sets, supersets, myo-reps, rest-pause, cluster sets?", "certainty": "moderate", "verdict": "NO hypertrophy-per-set benefit. Real time savings. Every one of these is a TIME-EFFICIENCY feature.", "engine_rule": "Default to TRADITIONAL STRAIGHT SETS. Expose advanced techniques only under an explicit 'time-efficiency' or 'variety' flag, with a 'no growth advantage demonstrated' tag. NEVER as premium or intensity-multiplier features. For supersets, restrict pairings to AGONIST-ANTAGONIST or unrelated muscle groups - the engine must REJECT same-muscle pairings under a hypertrophy objective.", "evidence": [{"pmid": "39903375", "first_author": "Zhang X", "year": 2025, "journal": "Sports Medicine 55(4):953-975", "doi": "10.1007/s40279-025-02176-8", "design": "Meta-analysis, 19 studies, 313 participants", "role": "supersets", "note": "Chronic hypertrophy SMD -0.05 (p=0.87); strength 0.10 (p=0.36). Volume preserved. Training efficiency SMD 1.74 (p=0.01). Costs: RPE 0.77 (p=0.02), lactate 0.94-1.13, energy cost 1.93. CRITICAL SUBGROUP: agonist-antagonist INCREASED reps (SMD 0.68, p=0.01); SIMILAR-BIOMECHANICAL supersets REDUCED volume load (SMD -1.08, p<0.01)."}, {"pmid": "41920484", "first_author": "Havers T", "year": 2026, "journal": "Sports Med Open", "doi": "10.1186/s40798-026-01012-1", "design": "Meta-analysis, 12 studies, n=274", "role": "drop_sets", "note": "Chronic hypertrophy SMD 0.04 (CI -0.29-0.36); strength -0.04 (-0.34-0.26). Acutely raised RPE (SMD 1.62) and lactate (0.67). Offer as time-efficiency only - and NOT for returners, given the higher perceptual and fatigue cost."}, {"pmid": "37523092", "first_author": "Sodal LK", "year": 2023, "journal": "Sports Med Open 9(1):66", "doi": "10.1186/s40798-023-00620-5", "design": "Meta-analysis, 5-6 studies, 142 participants", "role": "drop_sets", "note": "Between-group SMD 0.155 (CI -0.199-0.509, p=0.392) - null. Some drop-set modalities took half to one-third the time."}, {"pmid": "33475986", "first_author": "Davies TB", "year": 2021, "journal": "Sports Medicine", "doi": "10.1007/s40279-020-01408-3", "design": "Meta-analysis, 29 studies", "role": "cluster_sets", "note": "Hypertrophy -0.05 +/- 0.14 (CI -0.32-0.23, p=0.73); strength, power, velocity, endurance all null. No moderation by any variable. The general prior for named training schemes should be 'probably equivalent'."}, {"pmid": "39932536", "first_author": "Vargas-Molina S", "year": 2025, "journal": "Eur J Appl Physiol 125(6)", "doi": "10.1007/s00421-025-05712-6", "design": "Within-participant unilateral, n=10, cluster vs traditional, MATCHED ON SETS, REPS AND RIR", "role": "cluster_sets", "note": "Similar MT increases. Methodologically the useful study - it isolates set structure by holding EFFORT constant, and finds nothing. Cleanest available refutation of 'cluster sets add stimulus'."}, {"pmid": "42112925", "first_author": "Bradshaw JT", "year": 2026, "journal": "JSCR 40(6):638-649", "doi": "10.1519/JSC.0000000000005388", "design": "Acute crossover n=9 + 8-wk parallel n=22, myo-reps", "role": "myo_reps", "note": "No between-group differences; MYO performed ~30% less volume load (p=0.001). VERY LOW certainty - n=22 is underpowered to detect anything smaller than a large effect. Absence of difference is not evidence of equivalence."}, {"pmid": "41718208", "first_author": "Tsartsapakis I", "year": 2026, "journal": "J Funct Morphol Kinesiol 11(1):80", "doi": "10.3390/jfmk11010080", "design": "Preregistered meta-analysis, 23 trials", "role": "pooled", "note": "Pooled g = 0.159; STRENGTH g = 0.351; HYPERTROPHY g = 0.046 (non-significant). CAUTION: reported tau2 near zero across all models is implausible for 23 heterogeneous studies spanning six techniques - treat point estimates as soft."}]}, {"id": "progression", "domain": "progression", "question": "How should load and volume progress?", "certainty": "moderate_high", "engine_rule": "PROGRESSION MUST BE A FIRST-CLASS OBJECT, NOT OPTIONAL - it roughly DOUBLES hypertrophy for the same session count. Load progression and rep progression are equivalent: choose by EQUIPMENT GRANULARITY (coarse dumbbell jumps -> progress reps; machine/barbell -> progress load) and joint-stress tolerance. Default increment: +2-10% load when the user beats the rep target by 1-2 reps (double progression). If progress stalls on one lever, offer the other.", "evidence": [{"pmid": "41718594", "first_author": "Kassiano W", "year": 2026, "journal": "MSSE", "doi": "10.1249/MSS.0000000000003968", "design": "Within-subject arm-randomised RCT, 55 untrained women, 8 wk", "role": "primary", "note": "Triceps thickness: progressive overload +21.4% vs non-progressive +11.3% vs control +1.3% (p<0.001). Roughly 2x the hypertrophy. NOTE: non-progressive training STILL produced significant growth."}, {"pmid": "38286426", "first_author": "Chaves TS", "year": 2024, "journal": "Int J Sports Med", "doi": "10.1055/a-2256-5857", "design": "Within-subject leg-randomised RCT, 39 untrained, 10 wk", "role": "load_vs_reps", "note": "1RM and CSA both showed NO between-group difference (p>0.05)."}, {"pmid": "36199287", "first_author": "Plotkin D", "year": 2022, "journal": "PeerJ 10:e14142", "doi": "10.7717/peerj.14142", "design": "RCT, 43 participants with >=1 y experience, 8 wk", "role": "load_vs_reps_trained", "note": "RF growth modestly favoured REPS (2.8 mm, CI -0.5-5.8); dynamic strength slightly favoured LOAD (2.0 kg, CI -2.4-7.8) - authors call this 'of questionable practical significance'. NOTE: both intervals cross zero and are 2-5x the point estimate in width, so this is a null with imprecise estimates, NOT a precise equivalence result. Other outcomes in the same trial (muscle thicknesses <1 mm, endurance <1%, CMJ 0.1 cm) do have narrow intervals. Either way: do not spend engine complexity choosing between these."}, {"pmid": "40500534", "first_author": "Scarpelli MC", "year": 2025, "journal": "Eur J Appl Physiol", "doi": "10.1007/s00421-025-05817-y", "design": "Within-subject RCT, 37 untrained, 10 wk, responder clustering", "role": "individual_response", "note": "~34% responded better to rep progression, ~19% to load progression, ~35% no difference. CAUTION: responder clustering on a 2-typical-error criterion always produces apparent responders by chance. Frame as 'try the other lever', not as a biological responder type."}, {"pmid": "19204579", "first_author": "ACSM Position Stand", "year": 2009, "journal": "MSSE 41(3):687-708", "doi": "10.1249/MSS.0b013e3181915670", "design": "Practice guideline", "role": "default_increment", "note": "Increase load by 2-10% when the individual can perform the current workload for 1-2 reps beyond target. THAT IS DOUBLE PROGRESSION - but presented as a recommendation, NOT as the winner of any comparison."}], "double_progression_honesty_flag": "NO head-to-head trial comparing double progression against alternative schemes exists. Its authority is the 2009 ACSM guideline, not comparative evidence. Use it because it is safe, simple, self-limiting and endorsed - not because it is proven superior. If a user asks whether it is 'the best', the honest answer is that no study has tested it."}, {"id": "autoregulation", "domain": "progression", "question": "Autoregulate load, or use fixed percentages?", "certainty": "moderate_high", "engine_rule": "For a hypertrophy app, autoregulating LOAD is optional; autoregulating VOLUME matters more. Percentage-of-1RM prescription is NOT inferior for strength - convenient, since returners have no reliable current 1RM. If implementing velocity or RIR gating, set thresholds PERMISSIVELY (allow going closer to failure) for hypertrophy, not restrictively.", "evidence": [{"pmid": "35038063", "first_author": "Hickmott LM", "year": 2022, "journal": "Sports Med Open 8(1):9", "doi": "10.1186/s40798-021-00404-9", "design": "Meta-analysis, 15 studies, PROSPERO-registered", "role": "primary", "note": "Load autoregulation vs standardised: 1RM MD 2.07 kg (CI -0.32-4.46, p=0.09) - NO significant difference. Velocity loss <=25% gave greater 1RM (MD 2.32 kg, p=0.02) but LOWER hypertrophy (MD 0.61 cm2, p=0.03) than VL >25%. VL >25% vs 20-25%: no hypertrophy difference (p=0.28)."}, {"pmid": "36178597", "first_author": "Jukic I", "year": 2023, "journal": "Sports Medicine 53(1):177-214", "doi": "10.1007/s40279-022-01754-4", "design": "Meta-analysis + meta-regression, 18 acute + 19 longitudinal studies", "role": "velocity_loss", "note": "Hypertrophy vs VL: b = 0.006 (CI 0.001-0.012). PRACTICAL TRANSLATION: moving from 20% to 40% VL buys roughly 0.12 SMD. That is small. VL did NOT influence strength or endurance. Velocity loss is a MONITORING variable, not a prescription lever."}, {"pmid": "38418370", "first_author": "Jukic I", "year": 2024, "journal": "Physiol Rep 12(5):e15955", "doi": "10.14814/phy2.15955", "design": "46 trained participants, back squat", "role": "velocity_individualisation", "note": "INDIVIDUAL RIR-velocity relationships reached acceptable accuracy (<2 reps error); GENERAL (population-level) relationships did NOT. A shipped population-default velocity table will not work."}], "velocity_loss_targets": {"hypertrophy": [20, 25], "strength_power": [0, 20], "note": "Beyond 25% VL buys nothing measurable for hypertrophy (p=0.28) while costing fatigue. Requires hardware most users lack."}}, {"id": "periodization", "domain": "periodization", "question": "Linear, undulating, or none?", "certainty": "moderate_high", "engine_rule": "For a hypertrophy-focused engine, DO NOT SPEND COMPLEXITY ON PERIODIZATION MODEL SELECTION. Volume and progression carry the outcome. Do not offer LP vs DUP as a hypertrophy-relevant choice. Periodize only if the user has a strength goal, and then prefer undulating - for TRAINED users only.", "evidence": [{"pmid": "35044672", "first_author": "Moesgaard L", "year": 2022, "journal": "Sports Medicine", "doi": "10.1007/s40279-021-01636-1", "design": "Meta-analysis, 35 studies, volume-equated comparisons only", "role": "primary", "note": "1RM strength ES 0.31 (CI 0.04-0.57, p=0.02) favouring periodized. HYPERTROPHY ES 0.13 (CI -0.10-0.36, p=0.27) - NO DIFFERENCE. LP vs UP hypertrophy ES 0.05 (CI -0.20-0.29, p=0.72) - no difference."}, {"pmid": "28848690", "first_author": "Grgic J", "year": 2017, "journal": "PeerJ 5:e3695", "doi": "10.7717/peerj.3695", "design": "Meta-analysis, 13 studies", "role": "corroboration", "note": "LP vs DUP hypertrophy: pooled d = -0.02 (CI -0.25-0.21, p=0.848). A textbook null with a tight CI."}, {"pmid": "41365305", "first_author": "Delaire L", "year": 2025, "journal": "J Cachexia Sarcopenia Muscle", "doi": "10.1002/jcsm.70162", "design": "Meta-regressions, 14 studies, 528 sarcopenic older adults", "role": "supporting", "note": "Manipulating frequency, intensity, volume, periodization or failure did NOT improve muscle-mass gains. AGE was the only significant moderator. Strong support for 'just get them training consistently'."}]}, {"id": "deload", "domain": "periodization", "question": "Should the app schedule deload weeks?", "certainty": "moderate_high", "verdict": "NO. Two direct RCTs exist and BOTH are null-to-negative for hypertrophy. One found deloading was WORSE for strength. Everything else in the deload literature is survey data on what athletes do, not on whether it works.", "engine_rule": "DO NOT SCHEDULE AUTOMATIC CALENDAR-DRIVEN DELOADS FOR HYPERTROPHY. If the app offers one, make it REACTIVE (user reports fatigue, pain, poor sleep, life disruption) or LOGISTICAL (travel, illness) - and flag that it costs a little strength. If offered, copy the surveyed format (~6-7 days, hold frequency and exercise selection, cut sets and reps, cut load, raise RIR) because it matches user expectations - and LABEL IT AS CONVENTION.", "evidence": [{"pmid": "38274324", "first_author": "Coleman M", "year": 2024, "journal": "PeerJ 12:e16777", "doi": "10.7717/peerj.16777", "design": "RCT, 39 trained, 9 wk, 1-wk deload at midpoint vs continuous", "role": "direct_rct", "note": "No differences in muscle size, endurance or power. TRAD showed GREATER improvements in both isometric and dynamic lower-body strength. NOTE: Mike Israetel, the main popular proponent of deload/volume-landmark frameworks, is a co-author - which makes the null result more, not less, credible."}, {"pmid": "41730991", "first_author": "Pancar Z", "year": 2026, "journal": "Sci Rep 16(1)", "doi": "10.1038/s41598-026-40612-5", "design": "Within-subject RCT, 19 untrained men, 8 wk, reduced-volume deload weeks", "role": "direct_rct", "note": "No time x condition interactions (p=0.239-0.955); effects small (partial eta2 0.001-0.076); all delta CIs included zero."}, {"pmid": "38499934", "first_author": "Rogerson D", "year": 2024, "journal": "Sports Med Open 10(1):26", "doi": "10.1186/s40798-024-00691-y", "design": "Survey, 246 competitive strength/physique athletes", "role": "practice_only", "note": "100% of athletes deload. Typical duration 6.4 +/- 1.7 days, every 5.6 +/- 2.3 weeks. Volume down, frequency unchanged, load down, RIR up. THIS IS HIGH-CERTAINTY EVIDENCE ABOUT WHAT ATHLETES DO AND ZERO EVIDENCE ABOUT WHETHER IT WORKS."}]}, {"id": "deload_detection", "domain": "monitoring", "question": "Can the app detect when a deload is needed?", "certainty": "low", "engine_rule": "Use the practical subset only: barbell velocity at fixed load, jump height, per-set RIR-based RPE. IGNORE HORMONES ENTIRELY. DO NOT GATE PRESCRIPTION ON HRV. Require a sustained multi-session decrement well outside the error band (suggest >10% over >=2-3 sessions) - a single below-average session is noise. RPE drift can be a SOFT input to a suggestion, never a hard automated trigger.", "noise_floor": {"cmj_typical_error_pct": [5.7, 6.5], "imtp_typical_error_pct": [6.3, 8.9], "source_pmid": "40969919", "note": "Measured in ELITE athletes under standardised lab conditions with repeated trials. A user's phone-recorded jump at home will be considerably noisier. A 5% dip is noise."}, "evidence": [{"pmid": "40969919", "first_author": "Pojskic H", "year": 2025, "journal": "Front Physiol 16:1663590", "doi": "10.3389/fphys.2025.1663590", "design": "Reliability study, 45 elite athletes", "role": "noise_floor"}, {"pmid": "33312273", "first_author": "Helms ER", "year": 2020, "journal": "J Hum Kinet 74:23-42", "doi": "10.2478/hukin-2020-0011", "design": "Systematic review, 90 studies, 11 monitoring themes", "role": "candidate_markers", "note": "Review itself uses the phrase 'preliminary utility'. Correlating with performance is not the same as predicting who needs a deload."}, {"pmid": "28400506", "first_author": "Walker S", "year": 2017, "journal": "Physiol Rep", "doi": "10.14814/phy2.13241", "design": "Training study, strength-trained men, 10 wk", "role": "hormone_rejection", "note": "Authors of a study DESIGNED to find a positive concluded that tracking acute hormonal responses 'may not provide a sensitive enough guide for decisions regarding program design and periodization'."}], "negative_findings": ["HRV-guided resistance training: a PubMed search returned 3 results, NONE testing HRV-guided RT prescription. HRV-guided training research is an ENDURANCE literature. Cardiac parasympathetic recovery and neuromuscular recovery are not the same thing (PMID 23912805).", "RPE drift at fixed load as a validated deload trigger: NO validating study located. The +/-2 RIR estimation error (PMID 36662153) swamps the effect you would be looking for."]}], "returner_protocol": {"id": "return_after_layoff", "certainty": "low_expert_opinion", "honesty_flag": "NO published randomised trial of a graded return-to-resistance-training protocol for healthy adults after a long voluntary layoff exists. This protocol is a SYNTHESIS from adjacent evidence and must be labelled evidence-INFORMED, not evidence-BASED.", "core_rationale": {"the_injury_mechanism": "Connective tissue loses 30-40% of tolerable load within weeks of inactivity (PMID 26477918), while strength loses only ~14.5% over ~7 weeks (PMID 23529287) and neural/motor-learning strength can remain ~60% elevated after 20 weeks off (PMID 30991013). THE GAP BETWEEN WHAT THE CNS CAN STILL PRODUCE AND WHAT THE TENDON CAN STILL TOLERATE IS THE INJURY MECHANISM. Cap week-1 intensity well below what the user FEELS capable of.", "why_the_ramp_is_free": "Muscle damage is NOT required for hypertrophy (PMID 29282529). The first ~3 weeks back are a repair/remodelling phase, not a growth phase - MyoPS at week 1 did not correlate with hypertrophy, while MyoPS at weeks 3 and 10 correlated at r ~0.9 (PMID 27219125). A returner loses NOTHING by avoiding soreness in the first weeks. This removes the main objection to conservative ramping.", "the_first_session_is_the_dangerous_one": "The repeated-bout effect means the first unaccustomed bout produces markedly greater damage, soreness, strength loss and CK release than an identical second bout weeks later (PMID 25810385). Program the first 1-2 sessions per MOVEMENT PATTERN at deliberately submaximal volume and eccentric exposure. Protection then persists for weeks. This justifies 'introduce each novel movement gently once' rather than 'go easy on everything for N weeks'."}, "gating_by_layoff_length": {"le_3_weeks": {"ramp": "none", "rationale": "Strength is maintained up to ~3 weeks of detraining (PMID 23529287)."}, "4_to_16_weeks": {"ramp_weeks": 2, "expected_strength_loss_pct": [10, 20], "action": "Reduce working loads accordingly and re-test."}, "gt_16_weeks": {"ramp_weeks": [3, 4]}, "gt_12_months": {"ramp_weeks": 4, "classify_as": "novice", "source": "ACSM 2009 (PMID 19204579) defines novice to explicitly include those 'who have not trained for several years': 8-12 RM loads, 2-3 sessions/week."}}, "ramp_schedule": {"week_1": {"volume_pct_of_target": 33, "rep_range": "12-15 RM", "rir": [4, 5], "eccentric_emphasis": false, "plyometrics": false}, "week_2": {"volume_pct_of_target": 50, "rep_range": "10-12 RM", "rir": 3, "plyometrics": false}, "week_3": {"volume_pct_of_target": 67, "rep_range": "8-12 RM", "rir": 2, "plyometrics": false}, "week_4_onward": {"volume_pct_of_target": 100, "rir": [1, 2], "plyometrics": "permitted from week 4"}, "load_increment_from_week_2": "ACSM 2-10% rule", "honesty": "Every week-by-week percentage here is a judgement call. The one part with real support is 'make the first exposure to each movement gentle'."}, "expectation_setting": {"muscle_memory_honest_copy": "You will likely reach your old numbers faster than you first built them, mostly through skill and neural re-adaptation. The muscle-tissue advantage is unproven.", "do_not_claim": "Do NOT tell users their myonuclei are banked forever. The 147-study human meta-analysis found myonuclei are LOST during human atrophy (PMID 35961635), and a critical re-inspection shows ~20% loss even in the foundational rodent data (PMID 40768525).", "regain_evidence": "The two best-controlled human within-subject trials (PMID 30991013, PMID 39159314) found NO retraining hypertrophy advantage. The one study with a genuine de-novo control arm (PMID 1827108) found the never-trained group adapted equally fast. The faster-regain evidence comes from uncontrolled before/after comparisons (PMID 32017951, PMID 19060453).", "planning_heuristic": "~0.5-0.7x the original time-to-target to return to a PREVIOUSLY ACHIEVED strength level after a moderate layoff. Labelled a heuristic.", "do_not_judge_early": "Do not judge program efficacy on the first 3 weeks - that window is repair, not growth. And do NOT use soreness as a feedback signal anywhere in the app."}, "safety_red_flags": {"escalate_to_medical": "Severe persistent soreness PLUS dark urine, swelling, or disproportionate weakness. The app should STOP programming and route to medical care, not 'push through'.", "rhabdomyolysis_context": "Exertional rhabdomyolysis is driven by 'high-intensity, repetitive, and/or prolonged exercise unmatched to fitness level' (PMID 33655999). In one hospital series, 10 of 12 exertional cases were resistance-training-related, but ZERO had acute kidney injury, ICU admission or death (PMID 26949203). Real enough to justify a ramp; low enough that the ramp is cheap insurance. DO NOT FEARMONGER.", "exercise_bias": "Bias exercise selection away from high-skill overhead and loaded-spine work in the first weeks back - shoulder and spine predominate in injury reports (PMID 24276294, Very Low certainty survey data)."}, "rir_correction_for_returners": "Assume a returner's self-reported RIR is 1-2 REPS OPTIMISTIC for the first several weeks (PMID 28301439: novices under-rate maximal effort). Hold prescribed RIR HIGH (4-5) in ramp week 1 and taper it (3 -> 2 -> normal) across the ramp - the safety argument overrides the marginal hypertrophy gain from training closer to failure ONLY while the ramp is running."}, "coverage_rules": {"note": "These are the hardest-supported exercise-selection rules in the file. The engine should FLAG a program that violates them.", "rules": [{"id": "quad_rf", "rule": "A quadriceps block with NO knee-extension exercise is RECTUS-FEMORIS-DEFICIENT.", "certainty": "moderate_high", "evidence": "Leg press does not grow RF: +1.1% (p=0.379) vs knee extension +13.2% (p<=0.001), MRI volume across 17 muscles, PMID 41630124. Corroborated by PMID 41379528: leg extension beat squat for RF at all three sites (+11.4/12.3/17.5% vs +2.0/5.7/7.9%, all p<0.001).", "mechanism": "RF is biarticular and shortened at the hip during leg press. This does NOT generalise to all MJ vs SJ pairs."}, {"id": "quad_vl", "rule": "A quad block with NO squat/press pattern is VL-DISTAL-DEFICIENT.", "certainty": "moderate", "evidence": "Squat beat leg extension for distal VL: +18.2% vs +11.2% (p<0.001), PMID 41379528."}, {"id": "quad_rf_variant", "rule": "For RF specifically, prescribe leg extension with the hip EXTENDED or only mildly flexed (reclined/low seat back), not upright at 90 deg.", "certainty": "moderate", "evidence": "BF > 100, p(ATE>0) > 0.999 favouring 40 deg over 90 deg hip flexion for RF; 'strong' evidence of NO difference for VL (BF = 0.07). PMID 39699974.", "caveat": "Mechanism ambiguous - a more extended hip also changes the machine's resistance profile."}, {"id": "hamstring_two_slot", "rule": "TWO SLOTS REQUIRED: (1) a knee-flexion exercise performed SEATED / hip-flexed, never prone-only; (2) a HIP-EXTENSION exercise (RDL, 45 deg back extension, GHR) for biceps femoris long head.", "certainty": "moderate_high", "evidence": "Seated vs prone leg curl: whole hamstrings +14% vs +9%, biarticular heads +8-24% vs +4-19%; monoarticular short head equal (+10% vs +9%). MRI volume, 12 wk, PMID 33009197. Hip extension > Nordic for BFlh (d=1.03, p=0.037), PMID 27660368; eccentric hip extension BFlh +13.3%, SM +12.5%, PMID 35941515.", "note": "Fascicle-length adaptations detrain within 4 weeks (-14.8%, p<0.005) - keep hip-extension work continuous, not cycled out. Nordics are NOT useless: they grow semitendinosus equally."}, {"id": "triceps_long_head", "rule": "Flag any triceps block containing ONLY pushdowns and pressing as LONG-HEAD-DEFICIENT. Make OVERHEAD extension the default triceps isolation.", "certainty": "moderate_high", "evidence": "Overhead vs neutral-arm cable extension: long head +28.5% vs +19.6% (d=0.61, p<0.001); lateral+medial +14.6% vs +10.5% (d=0.39, p=0.002); whole triceps +19.9% vs +13.9% (d=0.54, p<0.001). MRI volume, 12 wk, PMID 35819335. Overhead used 34-39% LOWER absolute loads - tell users this is expected and correct.", "contraindication": "Shoulder flexion restriction or overhead pain."}, {"id": "calf_standing", "rule": "A calf program MUST include a STANDING (knee-extended) calf raise or the gastrocnemius receives essentially no stimulus. Seated calf raise is a SOLEUS-ONLY supplement, never a substitute.", "certainty": "moderate_high", "evidence": "Standing vs seated: lateral gastroc +12.4% vs +1.7%, medial +9.2% vs +0.6%, whole triceps surae +5.6% vs +2.1% (all p<=0.011). Soleus equal (+2.1% vs +2.9%, p=0.410). Gastroc did not significantly change in the seated leg. MRI volume, PMID 38156065."}, {"id": "calf_dorsiflexion", "rule": "For calves, prescribe deep dorsiflexion and permit lengthened-biased partials.", "certainty": "moderate", "evidence": "Initial(lengthened)-ROM MG +15.2% vs full +6.7% vs final(shortened) +3.4% (p<=0.009), PMID 37015016. The strongest muscle-specific case for the lengthened-partials concept - does NOT generalise to other muscles."}, {"id": "front_delt", "rule": "Default to ZERO dedicated front-delt isolation unless the user has a specific deficit - the anterior deltoid receives substantial volume from all horizontal and vertical pressing.", "certainty": "low_biomechanical_reasoning"}, {"id": "glute_no_emg", "rule": "Do NOT privilege hip thrust over squat for glutes, and NEVER rank glute exercises by EMG.", "certainty": "moderate", "evidence": "Hip thrust vs squat, MRI CSA, all gluteal-site CIs straddle zero; squat additionally grew quads (+3.6 cm2, CI 0.7-6.4) and adductors (+2.5 cm2, CI 1.2-3.9). Higher gluteal sEMG in hip thrust did NOT predict hypertrophy. PMID 37877099.", "selection_basis": "Choose on the strength goal and which secondary muscles are wanted."}, {"id": "no_regional_abs", "rule": "The engine must NOT claim regional ('upper/lower abs') targeting.", "certainty": "high_absence_of_evidence", "note": "There is essentially no controlled exercise-selection hypertrophy literature for the abdominals."}, {"id": "no_regional_biceps", "rule": "Do NOT claim long-head/short-head biceps targeting is established.", "certainty": "moderate", "evidence": "The Zabaleta-Korta trial's between-group tests were ALL null (group p=0.274, region p=0.571, interaction p=0.367), PMID 37559762. The Larsen shoulder-angle trial was a null (PMID 41988507). What IS supported is that the initial (lengthened) portion of the curl ROM beats the final portion (PMID 36828324)."}]}, "exercise_library_tag_key": {"M": "The muscle-length tag is supported by a measured hypertrophy or imaging finding, PMID given.", "B": "The tag is BIOMECHANICAL REASONING, not a measured finding. Treat as a hypothesis in the engine and DO NOT surface it to users as evidence.", "length_tag_definition": "Where the PEAK EXTERNAL TORQUE DEMAND falls relative to the target muscle's length - NOT joint angle alone."}, "exercise_library": [{"muscle": "chest", "name": "Barbell/dumbbell flat bench press", "primary": "pec major (sternocostal)", "secondary": ["anterior deltoid", "triceps"], "equipment": "barbell or dumbbells + bench", "length_at_peak_load": "mid-to-long", "tag": "B"}, {"muscle": "chest", "name": "Incline press (30-45 deg)", "primary": "pec major (clavicular)", "secondary": ["anterior deltoid", "triceps"], "equipment": "barbell/dumbbells + incline bench", "length_at_peak_load": "mid-to-long", "tag": "B", "note": "Clavicular bias supported at only 1 of 3 pec sites; PMID 32922646, Low certainty, n=47, once-weekly training"}, {"muscle": "chest", "name": "Dumbbell or cable fly (deep)", "primary": "pec major", "secondary": ["anterior deltoid"], "equipment": "dumbbells or cable crossover", "length_at_peak_load": "long", "tag": "B"}, {"muscle": "chest", "name": "Machine chest press", "primary": "pec major", "secondary": ["anterior deltoid", "triceps"], "equipment": "machine", "length_at_peak_load": "mid", "tag": "B"}, {"muscle": "lats", "name": "Lat pulldown", "primary": "latissimus dorsi", "secondary": ["biceps", "teres major", "lower traps"], "equipment": "cable pulldown", "length_at_peak_load": "long at top", "tag": "B"}, {"muscle": "lats", "name": "Pull-up / chin-up", "primary": "latissimus dorsi", "secondary": ["biceps", "teres major"], "equipment": "bar", "length_at_peak_load": "long at bottom", "tag": "B"}, {"muscle": "lats", "name": "Straight-arm pulldown / cable pullover", "primary": "latissimus dorsi", "secondary": ["teres major", "triceps long head"], "equipment": "cable + rope", "length_at_peak_load": "long", "tag": "B"}, {"muscle": "lats", "name": "Single-arm dumbbell row", "primary": "latissimus dorsi", "secondary": ["mid-traps", "rhomboids", "biceps"], "equipment": "dumbbell + bench", "length_at_peak_load": "mid", "tag": "B"}, {"muscle": "lats", "name": "Chest-supported machine row", "primary": "latissimus dorsi", "secondary": ["mid-traps", "rhomboids", "rear delt"], "equipment": "machine", "length_at_peak_load": "mid", "tag": "B"}, {"muscle": "upper_back", "name": "Barbell/dumbbell shrug", "primary": "upper trapezius", "secondary": ["levator scapulae"], "equipment": "barbell or dumbbells", "length_at_peak_load": "long at bottom", "tag": "B"}, {"muscle": "upper_back", "name": "Chest-supported row, retraction emphasis", "primary": "mid-trapezius, rhomboids", "secondary": ["rear delt", "lats"], "equipment": "incline bench + dumbbells or machine", "length_at_peak_load": "long at stretch", "tag": "B"}, {"muscle": "upper_back", "name": "Face pull", "primary": "mid/lower trapezius, rear delt", "secondary": ["rotator cuff"], "equipment": "cable + rope", "length_at_peak_load": "mid", "tag": "B"}, {"muscle": "front_delt", "name": "Overhead press", "primary": "anterior deltoid", "secondary": ["lateral deltoid", "triceps", "upper traps"], "equipment": "barbell or dumbbells", "length_at_peak_load": "mid-to-long", "tag": "B"}, {"muscle": "side_delt", "name": "Dumbbell lateral raise", "primary": "lateral deltoid", "secondary": ["supraspinatus", "upper traps"], "equipment": "dumbbells", "length_at_peak_load": "mid-to-short", "tag": "B", "note": "Equivalent to cable when ROM matched, BF<0.01 for the null, PMID 40692697"}, {"muscle": "side_delt", "name": "Cable lateral raise", "primary": "lateral deltoid", "secondary": ["supraspinatus", "upper traps"], "equipment": "cable, low pulley", "length_at_peak_load": "long-to-mid", "tag": "M", "pmid": "40692697"}, {"muscle": "side_delt", "name": "Machine lateral raise", "primary": "lateral deltoid", "secondary": ["supraspinatus"], "equipment": "machine", "length_at_peak_load": "mid", "tag": "B"}, {"muscle": "rear_delt", "name": "Reverse pec-deck", "primary": "posterior deltoid", "secondary": ["mid-traps", "rhomboids"], "equipment": "machine", "length_at_peak_load": "mid", "tag": "B"}, {"muscle": "rear_delt", "name": "Chest-supported dumbbell reverse fly", "primary": "posterior deltoid", "secondary": ["mid-traps", "rhomboids"], "equipment": "dumbbells + incline bench", "length_at_peak_load": "long at stretch", "tag": "B"}, {"muscle": "biceps", "name": "Incline dumbbell curl", "primary": "biceps brachii long head", "secondary": ["brachialis", "brachioradialis"], "equipment": "dumbbells + incline bench", "length_at_peak_load": "long", "tag": "B", "note": "Shoulder angle alone, with resistance profile and ROM matched, produced NO difference; PMID 41988507"}, {"muscle": "biceps", "name": "Preacher curl", "primary": "biceps brachii", "secondary": ["brachialis"], "equipment": "preacher bench + EZ bar or machine", "length_at_pea
